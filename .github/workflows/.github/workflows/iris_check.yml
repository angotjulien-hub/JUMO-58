name: IRIS - Analyse Nocturne Automatique

on:
  schedule:
    - cron: '0 0 * * *' # Se lance tous les jours à minuit
  workflow_dispatch: # Permet de le lancer manuellement pour tester

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installation des dépendances
        run: |
          pip install pandas matplotlib pyyaml

      - name: Exécution du moteur d'analyse
        run: |
          python moteur/analyse_frequence.py
          python moteur/calcul_rot.py
          python moteur/generer_rapport.py
          python moteur/update_dashboard.py

      - name: Sauvegarde des résultats
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "IRIS-Bot"
          git add .
          git commit -m "IRIS-Bot : Mise à jour des rapports de performance" || echo "Aucune modification"
          git push
