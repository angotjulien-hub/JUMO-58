<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRIS CHAUFFEUR PRO v14.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #010208; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        #map { position: absolute; inset: 0; z-index: 1; filter: grayscale(1) invert(0.95) contrast(1.1) brightness(0.4); }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="relative z-10 h-full flex flex-col p-6 pointer-events-none">
        <div class="flex justify-between items-start">
            <div class="glass p-5 rounded-[30px] flex gap-5 items-center border-l-4 border-cyan-500 pointer-events-auto">
                <div id="conn-status" class="w-4 h-4 bg-red-600 rounded-full"></div>
                <div>
                    <p id="ui-pol" class="orbitron text-lg font-black text-white italic">P--</p>
                    <p id="ui-agent" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Agent --</p>
                </div>
            </div>
            <div id="clock" class="glass orbitron text-2xl font-black px-8 py-3 rounded-2xl pointer-events-auto">00:00:00</div>
        </div>

        <div class="flex-1 flex flex-col justify-center items-center">
            <div class="glass px-16 py-10 rounded-[60px] text-center mb-8 pointer-events-auto">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-[0.6em] mb-4">Écart de Marche</p>
                <h1 id="eid-val" class="text-8xl font-black orbitron text-green-500">+00'00"</h1>
            </div>
        </div>

        <div class="flex justify-between items-end">
            <div class="glass px-6 py-4 rounded-3xl border-l-4 border-orange-500 pointer-events-auto">
                <p class="text-[8px] font-black text-slate-500 uppercase">Service</p>
                <p id="ui-svc" class="orbitron text-xl font-black text-orange-400">--</p>
            </div>
            <div class="flex items-center gap-4 text-right pointer-events-auto">
                <div class="leading-none">
                    <p class="text-[9px] font-black text-slate-500 uppercase mb-1">Vitesse</p>
                    <span id="speed" class="text-7xl font-black orbitron italic text-white">00</span>
                </div>
                <span class="text-xs font-black text-slate-600 orbitron rotate-90">KM/H</span>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pol = urlParams.get('police') || '5899';
        const svc = urlParams.get('service') || 'S58';
        const mat = urlParams.get('matricule') || '6254';

        const SERVER_URL = "https://angot.pythonanywhere.com/update_position";

        function init() {
            document.getElementById('ui-pol').innerText = `P${pol}`;
            document.getElementById('ui-svc').innerText = svc;
            document.getElementById('ui-agent').innerText = `Agent ${mat}`;

            setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR');
            }, 1000);

            startGPS();
        }

        function startGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(async (p) => {
                    const {latitude, longitude, speed} = p.coords;
                    const speedKmh = Math.round((speed || 0) * 3.6);
                    document.getElementById('speed').innerText = speedKmh.toString().padStart(2, '0');

                    try {
                        const response = await fetch(SERVER_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                pol: pol,
                                lat: latitude,
                                lon: longitude,
                                speed: speedKmh,
                                service: svc
                            })
                        });

                        if(response.ok) {
                            document.getElementById('conn-status').className = "w-4 h-4 bg-green-500 rounded-full shadow-[0_0_15px_#22c55e]";
                        }
                    } catch (e) {
                        document.getElementById('conn-status').className = "w-4 h-4 bg-red-600 rounded-full shadow-[0_0_15px_#dc2626]";
                    }
                }, null, {enableHighAccuracy: true});
            }
        }
        window.onload = init;
    </script>
</body>
</html>
