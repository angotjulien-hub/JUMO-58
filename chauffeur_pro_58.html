<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS - Dashboard Conducteur L58</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --ratp-green: #009640; --danger: #dc3545; --warning: #ffc107; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 280px; background: #1a2a3a; color: white; display: flex; flex-direction: column; }
        .logo-area { padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .driver-info { padding: 20px; background: rgba(0,0,0,0.2); margin: 15px; border-radius: 12px; text-align: center; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; }
        
        .top-bar { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .badge-service { padding: 8px 16px; border-radius: 25px; font-weight: bold; background: #666; color: white; }
        .badge-active { background: var(--ratp-green); }
        .badge-sos { background: var(--danger); animation: pulse 1s infinite; }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-full { grid-column: span 2; }
        #map { height: 350px; border-radius: 12px; }
        
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--ratp-green); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #333; }
        .btn-sos { background: black; color: white; grid-column: span 2; font-size: 1.2rem; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; max-width: 400px; width: 90%; text-align: center; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo-area"><h2>🚌 RATP IRIS</h2><p>Ligne 58 - Connecté</p></div>
    <div class="driver-info">
        <i class="fas fa-user-circle fa-3x"></i>
        <div style="margin-top:10px;"><strong id="driverName">Michel D.</strong><br><small id="polDisplay">POL: --</small></div>
    </div>
</div>

<div class="main-content">
    <div class="top-bar">
        <div class="badge-service" id="serviceBadge">HORS SERVICE</div>
        <div style="font-size: 1.5rem; font-weight: bold;" id="currentTime">00:00:00</div>
        <button class="action-btn btn-danger btn-sos" id="sosBtn" onclick="triggerSOS()">🚨 ALERTE SOS / DETRESSE</button>
    </div>

    <div class="dashboard-grid">
        <div class="card card-full">
            <h3><i class="fas fa-map-marker-alt"></i> Localisation Temps Réel</h3>
            <div id="map"></div>
        </div>

        <div class="card">
            <h3><i class="fas fa-tasks"></i> Contrôle Service</h3>
            <div class="action-buttons">
                <button class="action-btn btn-primary" id="startBtn" onclick="startService()">Démarrer</button>
                <button class="action-btn btn-danger" id="stopBtn" onclick="stopService()" disabled>Terminer</button>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-exchange-alt"></i> Manœuvres</h3>
            <div class="action-buttons">
                <button class="action-btn btn-warning" onclick="requestManoeuvre('Sénat')">Sénat</button>
                <button class="action-btn btn-warning" onclick="requestManoeuvre('Châtelet')">Châtelet</button>
            </div>
        </div>
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <div id="modalBody"></div>
        <div class="action-buttons">
            <button class="action-btn btn-primary" id="confirmBtn">CONFIRMER</button>
            <button class="action-btn btn-danger" onclick="closeModal()">ANNULER</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const SERVER_URL = "https://angot.pythonanywhere.com";
    const pol = new URLSearchParams(window.location.search).get('pol') || "5899";
    let serviceActive = false;
    let map, userMarker;

    document.getElementById('polDisplay').innerText = `POL: ${pol}`;

    // --- INITIALISATION ---
    function init() {
        map = L.map('map').setView([48.842, 2.318], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        setInterval(() => { document.getElementById('currentTime').innerText = new Date().toLocaleTimeString(); }, 1000);
        startTracking();
        setInterval(checkOrders, 5000);
    }

    // --- COMMUNICATION SERVEUR ---
    function startTracking() {
        navigator.geolocation.watchPosition(async (pos) => {
            const { latitude, longitude, speed } = pos.coords;
            updateMap(latitude, longitude);
            
            if (serviceActive) {
                await fetch(`${SERVER_URL}/update_position`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ pol, lat: latitude, lon: longitude, speed: speed || 0, status: "EN SERVICE" })
                });
            }
        }, null, { enableHighAccuracy: true });
    }

    async function checkOrders() {
        if (!serviceActive) return;
        const res = await fetch(`${SERVER_URL}/check_order/${pol}`);
        const data = await res.json();
        if (data.order) {
            showModal(`⚠️ ORDRE PCC :<br><b style="font-size:1.2rem;">${data.order}</b>`, async () => {
                await fetch(`${SERVER_URL}/clear_order/${pol}`, { method: 'POST' });
                closeModal();
            });
        }
    }

    // --- ACTIONS INTERFACE ---
    function startService() {
        serviceActive = true;
        document.getElementById('serviceBadge').className = 'badge-service badge-active';
        document.getElementById('serviceBadge').innerText = "SERVICE ACTIF";
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
    }

    async function triggerSOS() {
        document.getElementById('serviceBadge').className = 'badge-service badge-sos';
        document.getElementById('serviceBadge').innerText = "SOS ÉMIS";
        await fetch(`${SERVER_URL}/update_position`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ pol, status: "🚨 SOS / DÉTRESSE 🚨" })
        });
        alert("ALERTE SOS ENVOYÉE AU PCC");
    }

    function requestManoeuvre(lieu) {
        showModal(`Demande de retournement : <b>${lieu}</b>.<br>Avez-vous l'accord radio ?`, () => {
            alert("Manœuvre enregistrée");
            closeModal();
        });
    }

    // --- UTILS ---
    function updateMap(lat, lng) {
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([lat, lng]).addTo(map);
        map.panTo([lat, lng]);
    }

    function showModal(html, onConfirm) {
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('confirmBtn').onclick = onConfirm;
        document.getElementById('authModal').classList.add('active');
    }

    function closeModal() { document.getElementById('authModal').classList.remove('active'); }

    init();
</script>
</body>
</html>
