<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRIS CHAUFFEUR PRO v14.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #010208; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .alert-active { animation: bg-alert 0.5s infinite alternate; display: flex !important; }
        @keyframes bg-alert { from { background: rgba(220, 38, 38, 0.7); } to { background: rgba(220, 38, 38, 0.95); } }
        #map { position: absolute; inset: 0; z-index: 1; filter: grayscale(1) invert(0.95) contrast(1.1) brightness(0.4); }
    </style>
</head>
<body>

    <div id="pcc-order-overlay" class="fixed inset-0 z-[9999] hidden flex-col items-center justify-center p-10 text-center">
        <div class="orbitron text-white text-xl mb-2 opacity-70">TRANSMISSION PCC PRIORITAIRE</div>
        <h2 id="pcc-order-text" class="orbitron text-6xl font-black text-white italic mb-10 leading-tight uppercase">REBROUSSAGE : ODÉON</h2>
        <button onclick="confirmOrder()" class="bg-white text-black orbitron font-black px-16 py-8 rounded-full text-2xl shadow-[0_0_50px_rgba(255,255,255,0.3)] active:scale-90 transition-all">REÇU / J'EXÉCUTE</button>
    </div>

    <div id="map"></div>

    <div class="relative z-10 h-full flex flex-col p-6 pointer-events-none">
        <div class="flex justify-between items-start">
            <div class="glass p-5 rounded-[30px] flex gap-5 items-center border-l-4 border-cyan-500 pointer-events-auto">
                <div id="conn-status" class="w-4 h-4 bg-red-600 rounded-full shadow-[0_0_15px_rgba(220,38,38,0.5)]"></div>
                <div>
                    <p id="ui-pol" class="orbitron text-lg font-black text-white italic">P--</p>
                    <p id="ui-agent" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Agent --</p>
                </div>
            </div>
            <div id="clock" class="glass orbitron text-2xl font-black px-8 py-3 rounded-2xl border border-white/10 pointer-events-auto">00:00:00</div>
        </div>

        <div class="flex-1 flex flex-col justify-center items-center">
            <div class="glass px-16 py-10 rounded-[60px] text-center mb-8 border border-white/5 pointer-events-auto">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-[0.6em] mb-4">Écart de Marche</p>
                <h1 id="eid-val" class="text-8xl font-black orbitron text-green-500 tracking-tighter">+00'00"</h1>
            </div>
            
            <div class="glass p-8 rounded-[40px] w-full max-w-md border-t-2 border-cyan-500 pointer-events-auto">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-black text-cyan-500 uppercase mb-1">Station Visée</p>
                        <h2 id="next-stop" class="text-3xl font-black italic text-white uppercase tracking-tighter">CHÂTELET</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] font-bold text-slate-500 uppercase">Théorique</p>
                        <p id="theo-time" class="orbitron text-3xl font-black text-white">07:00</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end">
            <div class="flex gap-4 pointer-events-auto">
                <div class="glass px-6 py-4 rounded-3xl border-l-4 border-orange-500">
                    <p class="text-[8px] font-black text-slate-500 uppercase">Service</p>
                    <p id="ui-svc" class="orbitron text-xl font-black text-orange-400">--</p>
                </div>
            </div>
            <div class="flex items-center gap-4 text-right pointer-events-auto">
                <div class="leading-none">
                    <p class="text-[9px] font-black text-slate-500 uppercase mb-1">Vitesse</p>
                    <span id="speed" class="text-7xl font-black orbitron italic text-white">00</span>
                </div>
                <span class="text-xs font-black text-slate-600 orbitron rotate-90">KM/H</span>
            </div>
        </div>
    </div>

    <audio id="snd-alert" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pol = urlParams.get('police') || '99';
        const svc = urlParams.get('service') || '--';
        const mat = urlParams.get('matricule') || '---';

        let peer, conn;

        function init() {
            document.getElementById('ui-pol').innerText = `P${pol}`;
            document.getElementById('ui-svc').innerText = svc;
            document.getElementById('ui-agent').innerText = `Agent ${mat}`;

            const map = L.map('map', {zoomControl:false}).setView([48.84, 2.32], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            peer = new Peer(`IRIS-BUS-${pol}`);
            peer.on('open', () => {
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                setupCommunications();
            });

            setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR');
            }, 1000);

            startGPS();
        }

        function setupCommunications() {
            conn.on('open', () => {
                document.getElementById('conn-status').className = "w-4 h-4 bg-green-500 rounded-full shadow-[0_0_15px_#22c55e]";
            });
            conn.on('data', d => {
                if(d.type === 'RETOURNEMENT_STRICT') {
                    document.getElementById('pcc-order-text').innerText = d.instruction;
                    document.getElementById('pcc-order-overlay').classList.add('alert-active');
                    document.getElementById('snd-alert').play();
                }
            });
        }

        function confirmOrder() {
            document.getElementById('pcc-order-overlay').classList.remove('alert-active');
            conn.send({type: 'ack', pol: pol, status: "EXÉCUTION EN COURS"});
        }

        function startGPS() {
            navigator.geolocation.watchPosition(p => {
                const {latitude, longitude, speed} = p.coords;
                document.getElementById('speed').innerText = Math.round((speed || 0) * 3.6).toString().padStart(2, '0');
                if(conn && conn.open) {
                    conn.send({type: 'pos', pol: pol, lat: latitude, lon: longitude, speed: speed});
                }
            }, null, {enableHighAccuracy: true});
        }

        window.onload = init;
    </script>
</body>
</html>
