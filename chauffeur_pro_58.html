<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRIS CHAUFFEUR PRO 58</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #010208; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .alert-overlay { position: fixed; inset: 0; background: rgba(220, 38, 38, 0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; display: none; }
        #map { position: absolute; inset: 0; z-index: 1; filter: grayscale(1) invert(0.95) contrast(1.1) brightness(0.5); }
        .ui-layer { position: absolute; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; padding: 20px; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>

    <div id="critical-alert" class="alert-overlay">
        <h2 class="orbitron text-5xl font-black mb-4">ORDRE DE REBROUSSAGE</h2>
        <p id="alert-msg" class="text-2xl font-bold uppercase mb-8">Point : ODÉON</p>
        <button onclick="ackOrder()" class="bg-white text-black px-12 py-6 rounded-full font-black orbitron text-xl">ACQUITTER L'ORDRE</button>
    </div>

    <div id="map"></div>

    <div class="ui-layer">
        <div class="flex justify-between items-start">
            <div class="glass p-4 rounded-2xl flex gap-4 items-center interactive border-l-4 border-cyan-500">
                <div id="status-dot" class="w-3 h-3 bg-red-600 rounded-full animate-pulse"></div>
                <div>
                    <p id="unit-label" class="orbitron text-sm font-black text-cyan-400">UNITÉ P--</p>
                    <p class="text-[8px] font-bold text-slate-500 tracking-widest uppercase">IRIS Connecté</p>
                </div>
            </div>
            <div id="clock" class="glass orbitron text-xl font-bold px-6 py-2 rounded-xl interactive">00:00:00</div>
        </div>

        <div class="flex-1 flex flex-col justify-center items-center">
            <div class="glass px-12 py-8 rounded-[50px] text-center mb-6 interactive shadow-2xl">
                <p class="text-[9px] font-black text-slate-500 uppercase tracking-[0.5em] mb-2">Écart Régulation</p>
                <h1 id="eid-val" class="text-7xl font-black orbitron text-green-500">+00'00"</h1>
            </div>
            
            <div class="glass p-6 rounded-[35px] w-full max-w-sm border-t-2 border-cyan-500 interactive shadow-2xl">
                <div class="flex justify-between items-center">
                    <div class="text-left">
                        <p class="text-[9px] font-bold text-cyan-500 uppercase">Prochain Point</p>
                        <h2 id="next-stop" class="text-2xl font-black italic uppercase text-white leading-tight">CHÂTELET</h2>
                    </div>
                    <div class="text-right">
                        <p id="theoretical-time" class="orbitron text-2xl font-black text-white">--:--</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end interactive">
            <button onclick="location.reload()" class="bg-white/5 p-4 rounded-2xl text-[9px] font-bold">REBOOT SYSTEM</button>
            <div class="text-right">
                <p class="text-[8px] font-black text-slate-500 uppercase">Vitesse</p>
                <span id="speed" class="text-6xl font-black orbitron italic">00</span>
                <span class="text-xs font-black text-zinc-600 orbitron">KM/H</span>
            </div>
        </div>
    </div>

    <script>
        let peer, conn, busId;
        busId = prompt("Entrez ID Unité (ex: 8501)") || "99";
        document.getElementById('unit-label').innerText = `UNITÉ P${busId}`;

        function init() {
            const map = L.map('map', {zoomControl:false}).setView([48.84, 2.32], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            peer = new Peer(`IRIS-BUS-${busId}`);
            peer.on('open', () => {
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                setupConn();
            });

            setInterval(updateClock, 1000);
            watchGPS();
        }

        function setupConn() {
            conn.on('open', () => {
                document.getElementById('status-dot').className = "w-3 h-3 bg-green-500 rounded-full";
            });
            conn.on('data', d => {
                if(d.type === 'RETOURNEMENT_STRICT') {
                    document.getElementById('alert-msg').innerText = d.instruction;
                    document.getElementById('critical-alert').style.display = 'flex';
                    if(navigator.vibrate) navigator.vibrate([500, 200, 500]);
                }
            });
        }

        function ackOrder() {
            document.getElementById('critical-alert').style.display = 'none';
            conn.send({type: 'ack', pol: busId, msg: "Ordre de rebroussage acquitté."});
        }

        function watchGPS() {
            navigator.geolocation.watchPosition(p => {
                const {latitude, longitude, speed} = p.coords;
                document.getElementById('speed').innerText = Math.round((speed || 0) * 3.6).toString().padStart(2, '0');
                if(conn && conn.open) conn.send({type: 'pos', pol: busId, lat: latitude, lon: longitude});
            }, null, {enableHighAccuracy: true});
        }

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR');
        }

        window.onload = init;
    </script>
</body>
</html>
