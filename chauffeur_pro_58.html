<!DOCTYPE html>
<html lang="fr">
<head>
    <title>IRIS CHAUFFEUR PRO</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .active-glow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        #map { background: #0f172a; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans overflow-hidden">
    <div class="h-screen flex flex-col p-4 gap-4">
        
        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <div>
                <div class="text-2xl font-black text-emerald-400">IRIS <span class="text-white">58</span></div>
                <div id="unit-id" class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">UNITÉ --</div>
            </div>
            <div id="clock" class="text-xl font-mono text-emerald-200 bg-black/30 px-3 py-1 rounded-md">00:00:00</div>
        </div>

        <button onclick="sendSOS()" id="sosBtn" class="bg-red-600 p-6 rounded-xl font-bold text-xl shadow-lg active:scale-95 transition-all border-b-4 border-red-800">
            🚨 ALERTE SOS / DÉTRESSE
        </button>

        <div id="map" class="flex-1 rounded-xl border border-slate-700 shadow-inner overflow-hidden"></div>

        <div class="grid grid-cols-2 gap-4">
            <button id="startBtn" onclick="toggleService()" class="bg-emerald-600 p-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                <span id="status-icon">▶</span> <span id="btnText">DÉMARRER</span>
            </button>
            <div class="bg-slate-800 p-4 rounded-xl text-center border border-slate-700">
                <small class="block text-slate-400 uppercase text-[9px] tracking-tighter">Vitesse GPS</small>
                <span id="speed" class="text-3xl font-black text-white">0</span> <span class="text-xs text-emerald-400 font-bold">km/h</span>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://angot.pythonanywhere.com";
        const pol = new URLSearchParams(window.location.search).get('pol') || "5801";
        document.getElementById('unit-id').innerText = "UNITÉ P" + pol;

        let active = false;
        let userMarker;
        let map = L.map('map', { zoomControl: false }).setView([48.8584, 2.3488], 15);

        // Fond de carte sombre style JUMO
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function toggleService() {
            active = !active;
            const btn = document.getElementById('startBtn');
            const btnText = document.getElementById('btnText');
            const icon = document.getElementById('status-icon');

            if (active) {
                btnText.innerText = "FIN DE SERVICE";
                icon.innerText = "■";
                btn.classList.replace('bg-emerald-600', 'bg-slate-700');
                btn.classList.add('active-glow');
            } else {
                if(confirm("Confirmer la fin de mission ?")) {
                    location.reload();
                } else {
                    active = true;
                }
            }
        }

        // Système SOS
        async function sendSOS() {
            const btn = document.getElementById('sosBtn');
            btn.classList.add('animate-pulse');
            btn.innerText = "🚨 SOS ENVOYÉ !";
            
            try {
                await fetch(`${SERVER_URL}/update_position`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        pol: pol,
                        status: "🚨 SOS DÉTRESSE",
                        lat: userMarker ? userMarker.getLatLng().lat : 0,
                        lon: userMarker ? userMarker.getLatLng().lng : 0,
                        speed: 0
                    })
                });
                alert("ALERTE : Le PCC a reçu votre signal SOS.");
            } catch (e) {
                alert("ERREUR RÉSEAU : Signal non transmis.");
            }
        }

        // Surveillance Géolocalisation
        navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, speed } = pos.coords;
            const kmh = speed ? (speed * 3.6).toFixed(0) : 0;
            
            document.getElementById('speed').innerText = kmh;

            // Update Marqueur
            if (!userMarker) {
                userMarker = L.circleMarker([latitude, longitude], { 
                    color: '#10b981', 
                    fillColor: '#10b981',
                    fillOpacity: 1, 
                    radius: 7 
                }).addTo(map);
            } else {
                userMarker.setLatLng([latitude, longitude]);
            }
            
            if (active) map.panTo([latitude, longitude]);

            // Envoi au serveur
            if(active) {
                fetch(`${SERVER_URL}/update_position`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        pol: pol, 
                        lat: latitude, 
                        lon: longitude, 
                        speed: kmh,
                        status: "EN SERVICE"
                    })
                }).catch(err => console.error("Sync Error"));
            }
        }, err => {
            console.error("GPS Error:", err);
        }, { 
            enableHighAccuracy: true,
            maximumAge: 1000 
        });

        // Réception des ordres PCC (toutes les 4 secondes)
        setInterval(async () => {
            if(!active) return;
            try {
                const res = await fetch(`${SERVER_URL}/check_order/${pol}`);
                const data = await res.json();
                if(data && data.order) {
                    // Signal sonore visuel (vibration via alert)
                    if(confirm("📩 NOUVEL ORDRE DU PCC :\n\n" + data.order + "\n\nAppuyez sur OK pour accuser réception.")) {
                        fetch(`${SERVER_URL}/clear_order/${pol}`, {method: 'POST'});
                    }
                }
            } catch (e) {}
        }, 4000);

        // Horloge temps réel
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR');
        }, 1000);
    </script>
</body>
</html>
