<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRIS PRO V5.6 - Ligne 58</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #22d3ee; --bg: #000; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        #map { height: 100%; width: 100%; filter: grayscale(1) invert(0.92) contrast(1.1); position: absolute; z-index: 0; }
        
        #tm-drawer { transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; }
        #tm-drawer.open { transform: translateY(0); }
        
        .station-row { position: relative; border-left: 2px solid rgba(34,211,238,0.1); margin-left: 12px; padding-left: 24px; }
        .station-row.active::before { content: ''; position: absolute; left: -7px; top: 12px; width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; box-shadow: 0 0 15px #22d3ee; }
        .station-row.past { opacity: 0.2; }

        /* Animation bouton SOS / Alerte */
        .btn-alert { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; }
        .btn-alert:active { background: #ef4444; color: white; }
    </style>
</head>
<body class="relative">

    <div id="map"></div>

    <div class="absolute inset-0 flex flex-col p-5 pointer-events-none">
        
        <header class="flex justify-between items-start pointer-events-auto">
            <div class="flex gap-4">
                <div class="bg-[#FFD700] text-black px-6 py-2 text-4xl font-black rounded-2xl orbitron shadow-2xl">58</div>
                <div class="flex flex-col">
                    <span id="dest-title" class="text-2xl font-black italic tracking-tighter uppercase">Vers Châtelet</span>
                    <div class="flex items-center gap-2">
                        <div id="status-dot" class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></div>
                        <span id="status-text" class="text-[8px] font-bold text-zinc-500 uppercase tracking-widest leading-none">IRIS OFFLINE</span>
                    </div>
                </div>
            </div>
            <div class="flex flex-col gap-2 items-end">
                <button onclick="toggleTM()" class="glass px-6 py-4 rounded-[25px] border-b-4 border-cyan-500 active:scale-90 transition-all">
                    <p class="orbitron text-[10px] font-black text-cyan-400">TABLEAU DE MARCHE</p>
                    <p id="clock" class="text-xs font-bold text-white mt-1">00:00:00</p>
                </button>
            </div>
        </header>

        <div class="flex-1 flex items-center justify-center">
            <div onclick="nextStation()" class="glass w-full max-w-xl p-10 rounded-[50px] border-t-4 border-cyan-500 text-center pointer-events-auto shadow-2xl active:scale-95 transition-all">
                <span class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.6em] mb-4 block italic">Prochain Arrêt</span>
                <h1 id="current-stop-name" class="text-4xl font-black italic uppercase tracking-tighter leading-tight mb-8">Chargement...</h1>
                <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                    <div id="progress-line" class="h-full bg-cyan-400 shadow-[0_0_15px_#22d3ee] transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <footer class="flex justify-between items-end pointer-events-auto">
            <div class="flex flex-col gap-3">
                <div class="glass px-6 py-3 rounded-3xl border-l-4 border-green-500">
                    <p class="text-[9px] font-black text-zinc-500 uppercase mb-1">EID / RÉGULATION</p>
                    <p class="text-2xl font-black text-green-500 orbitron italic">+01' 45"</p>
                </div>
                <button onclick="sendQuickMsg('ALERTE : INCIDENT VOYAGEUR')" class="btn-alert px-6 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest active:scale-95 transition-all">⚠️ Signalement</button>
            </div>
            
            <div class="glass p-8 rounded-[45px] text-center min-w-[160px]">
                <span id="speed-val" class="text-6xl font-black orbitron italic leading-none">00</span>
                <p class="text-[10px] text-zinc-500 font-black uppercase tracking-widest mt-2">km/h</p>
            </div>
        </footer>
    </div>

    <div id="tm-drawer" class="fixed bottom-0 left-0 right-0 h-[92vh] glass rounded-t-[60px] p-8 flex flex-col pointer-events-auto">
        <div class="w-20 h-2 bg-zinc-800 rounded-full mx-auto mb-8 cursor-pointer shadow-inner" onclick="toggleTM()"></div>
        
        <div class="mb-10 px-4">
            <p class="text-[10px] font-black text-cyan-500 uppercase tracking-[0.3em] mb-4">Actions Rapides PCC</p>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="sendQuickMsg('PROPOSITION : REBROUSSAGE A ALESIA')" class="glass p-4 rounded-2xl border-l-4 border-orange-500 text-left active:scale-95 transition-all">
                    <p class="text-[10px] font-black text-white uppercase italic">Suggérer Retournement</p>
                    <p class="text-[8px] text-zinc-500 mt-1 uppercase font-bold">Si retard > 8 min</p>
                </button>
                <button onclick="sendQuickMsg('INFO : FORT TRAFIC / BOUCHONS')" class="glass p-4 rounded-2xl border-l-4 border-yellow-500 text-left active:scale-95 transition-all">
                    <p class="text-[10px] font-black text-white uppercase italic">Signalement Trafic</p>
                    <p class="text-[8px] text-zinc-500 mt-1 uppercase font-bold">Zone Alésia / Maine</p>
                </button>
                <button onclick="sendQuickMsg('INFO : BUS COMPLET / RÉGULATION')" class="glass p-4 rounded-2xl border-l-4 border-cyan-500 text-left active:scale-95 transition-all">
                    <p class="text-[10px] font-black text-white uppercase italic">Charge Maximale</p>
                    <p class="text-[8px] text-zinc-500 mt-1 uppercase font-bold">Bus à saturation</p>
                </button>
                <button onclick="sendQuickMsg('DEMANDE : RELÈVE CONDUCTEUR')" class="glass p-4 rounded-2xl border-l-4 border-white text-left active:scale-95 transition-all">
                    <p class="text-[10px] font-black text-white uppercase italic">Demande Relève</p>
                    <p class="text-[8px] text-zinc-500 mt-1 uppercase font-bold">Prochain arrêt relève</p>
                </button>
            </div>
        </div>

        <div class="flex justify-between items-end mb-6 px-4">
            <h2 class="text-3xl font-black orbitron text-cyan-400 italic leading-none">TM 58-204</h2>
            <p class="text-zinc-500 font-bold uppercase text-[9px]">Théorique : 14:20 — 15:08</p>
        </div>

        <div id="tm-list" class="flex-1 overflow-y-auto no-scrollbar space-y-1 px-4 pb-24 border-t border-white/5 pt-6">
            </div>
    </div>

    <div id="pcc-modal" class="fixed inset-0 z-[200] bg-black/95 backdrop-blur-3xl hidden flex items-center justify-center p-8">
        <div class="glass p-12 rounded-[50px] border-t-8 border-cyan-500 text-center w-full max-w-2xl shadow-[0_0_100px_rgba(34,211,238,0.2)]">
            <p id="msg-category" class="orbitron text-cyan-400 text-[10px] font-bold mb-6 tracking-[0.5em] uppercase">Transmission IRIS</p>
            <h2 id="msg-body" class="text-4xl font-black italic uppercase leading-tight mb-12 tracking-tighter">MESSAGE...</h2>
            <button onclick="closePCC()" class="w-full bg-cyan-500 text-black py-8 rounded-[35px] font-black text-2xl uppercase tracking-widest active:scale-95 transition-all">Bien reçu</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const POL = params.get('police') || "0000";
        let currentIndex = 0, peer, conn, map, userMarker;

        const TIMETABLE = [
            {s: "Vanves-Michelet", t: "14:20"}, {s: "Albert Legris", t: "14:22"}, {s: "Jean Jaurès", t: "14:24"},
            {s: "Adolphe Pinard", t: "14:25"}, {s: "Pont de la Vallée", t: "14:27"}, {s: "Porte de Vanves", t: "14:29"},
            {s: "Colonel Monteil", t: "14:31"}, {s: "Didot", t: "14:33"}, {s: "Broussais", t: "14:34"},
            {s: "Didot-Alésia", t: "14:36"}, {s: "Pernety", t: "14:38"}, {s: "Mairie du 14e", t: "14:40"},
            {s: "Losserand-Maine", t: "14:42"}, {s: "Gaîté", t: "14:43"}, {s: "Gare Montparnasse", t: "14:45"},
            {s: "18 Juin 1940", t: "14:48"}, {s: "Vavin", t: "14:50"}, {s: "Guynemer-Vavin", t: "14:51"},
            {s: "Fleurus", t: "14:53"}, {s: "Musée Luxembourg", t: "14:54"}, {s: "Sénat", t: "14:56"},
            {s: "Odéon", t: "14:58"}, {s: "St-Germain", t: "15:00"}, {s: "St-André Arts", t: "15:02"},
            {s: "Pont Neuf", t: "15:04"}, {s: "Châtelet-Gesvres", t: "15:06"}, {s: "Châtelet", t: "15:08"}
        ];

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.83, 2.32], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            userMarker = L.circleMarker([0,0], {radius: 12, color: '#fff', fillColor: '#22d3ee', fillOpacity: 1, weight: 5}).addTo(map);
            setTimeout(() => map.invalidateSize(), 500);
        }

        function initPeer() {
            peer = new Peer(`BUS-58-P${POL}`);
            peer.on('open', () => {
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-cyan-500 shadow-[0_0_10px_cyan]";
                document.getElementById('status-text').innerText = "IRIS CONNECTÉ";
                document.getElementById('status-text').classList.replace('text-zinc-500', 'text-cyan-400');
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                conn.on('data', d => {
                    document.getElementById('msg-body').innerText = d.content || "ORDRE DE RÉGULATION";
                    document.getElementById('pcc-modal').classList.remove('hidden');
                    if(window.navigator.vibrate) window.navigator.vibrate([300, 100, 300]);
                });
            });
        }

        function sendQuickMsg(msg) {
            if(conn && conn.open) {
                conn.send({ type: 'msg', content: msg, from: POL });
                alert("Message envoyé au PCC : " + msg);
            } else {
                alert("Erreur : Non connecté au PCC IRIS");
            }
        }

        function buildTM() {
            const list = document.getElementById('tm-list');
            list.innerHTML = TIMETABLE.map((item, index) => `
                <div class="station-row py-4 ${index === currentIndex ? 'active' : ''} ${index < currentIndex ? 'past' : ''}">
                    <div class="flex justify-between items-center">
                        <p class="text-xl font-black uppercase italic ${index === currentIndex ? 'text-cyan-400' : 'text-white'}">${item.s}</p>
                        <p class="orbitron font-bold text-xl ${index === currentIndex ? 'text-cyan-400' : 'text-white'}">${item.t}</p>
                    </div>
                </div>
            `).join('');
        }

        function nextStation() {
            if(currentIndex < TIMETABLE.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('current-stop-name').innerText = TIMETABLE[currentIndex].s;
            document.getElementById('progress-line').style.width = (currentIndex / (TIMETABLE.length - 1)) * 100 + "%";
            buildTM();
        }

        function toggleTM() { document.getElementById('tm-drawer').classList.toggle('open'); }
        function closePCC() { document.getElementById('pcc-modal').classList.add('hidden'); }
        
        window.onload = () => {
            initMap();
            initPeer();
            updateDisplay();
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const { latitude, longitude, speed } = pos.coords;
                    document.getElementById('speed-val').innerText = Math.round((speed || 0) * 3.6).toString().padStart(2, '0');
                    userMarker.setLatLng([latitude, longitude]);
                    map.panTo([latitude, longitude]);
                    if(conn && conn.open) conn.send({type:'pos', lat:latitude, lon:longitude, pol:POL});
                }, null, { enableHighAccuracy: true });
            }
        };
    </script>
</body>
</html>
