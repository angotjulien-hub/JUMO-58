<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRIS CHAUFFEUR V9.0 - ELITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { background: #010208; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #map { position: absolute; inset: 0; z-index: 1; filter: grayscale(1) invert(0.95) contrast(1.1) brightness(0.5) hue-rotate(190deg); }
        .ui-layer { position: absolute; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; padding: 15px; }
        .interactive { pointer-events: auto !important; }
        .glass { background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Alertes et Flashs */
        .flash-red { animation: flash-red 0.5s infinite; }
        @keyframes flash-red { 0% { background: rgba(255,0,0,0.2); } 50% { background: rgba(255,0,0,0.5); } 100% { background: rgba(255,0,0,0.2); } }
        
        .terminus-glow { filter: drop-shadow(0 0 8px #22c55e); animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* Tiroir Signalétique */
        .drawer-sig { position: fixed; bottom: 0; left: 0; right: 0; background: #05070a; border-top: 2px solid #1e293b; transform: translateY(100%); transition: 0.3s; z-index: 2000; padding: 20px; border-radius: 30px 30px 0 0; }
        .drawer-sig.open { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="pcc-alert" onclick="this.style.display='none'" class="hidden fixed top-0 left-0 right-0 z-[10000] bg-red-600 p-6 text-center border-b-4 border-white">
        <p class="orbitron text-xs font-black tracking-widest">⚠️ ORDRE DU RÉGULATEUR</p>
        <h2 id="pcc-msg" class="text-xl font-black italic uppercase mt-1">REBROUSSAGE IMMÉDIAT</h2>
    </div>

    <div id="map"></div>

    <div class="ui-layer">
        <div class="flex justify-between items-start">
            <div class="glass p-4 rounded-2xl flex gap-4 items-center interactive border-l-4 border-cyan-500 shadow-2xl">
                <div id="gps-status" class="w-3 h-3 bg-red-600 rounded-full animate-pulse"></div>
                <div>
                    <p id="txt-service" class="orbitron text-sm font-black text-cyan-400 uppercase italic">LIGNE 58 - ATTENTE</p>
                    <p class="text-[8px] font-bold text-slate-500 tracking-widest">UNITÉ P<span id="bus-id-label">--</span> • CONNECTÉ PCC</p>
                </div>
            </div>
            <div id="clock" class="glass orbitron text-xl font-bold px-5 py-2 rounded-xl border border-white/10 interactive">00:00:00</div>
        </div>

        <div class="flex-1 flex flex-col justify-center items-center">
            <div id="eid-container" class="glass px-12 py-8 rounded-[50px] text-center mb-6 interactive shadow-2xl">
                <p class="text-[9px] font-black text-slate-500 uppercase tracking-[0.5em] mb-2">Écart de Régulation</p>
                <h1 id="eid-val" class="text-7xl font-black orbitron text-green-500">+00'00"</h1>
            </div>
            
            <div class="glass p-6 rounded-[35px] w-full max-w-sm border-t-2 border-cyan-500 interactive shadow-2xl" onclick="nextStop()">
                <div class="flex justify-between items-center">
                    <div class="text-left">
                        <p id="stop-type-label" class="text-[9px] font-bold text-cyan-500 uppercase tracking-widest">Radar Suivant</p>
                        <h2 id="stop-name" class="text-2xl font-black italic uppercase text-white leading-tight mt-1">CHOISIR MISSION</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-[8px] font-bold text-slate-500 uppercase">Théorique</p>
                        <p id="stop-time" class="orbitron text-2xl font-black text-white">--:--</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end">
            <div class="flex flex-col gap-2 interactive">
                <button onclick="openSig()" class="bg-red-600 text-white font-black text-[10px] px-8 py-5 rounded-3xl shadow-lg uppercase tracking-wider active:scale-95 transition-all">⚠️ SIGNALER</button>
                <div class="glass px-6 py-3 rounded-2xl border-l-4 border-blue-500">
                    <p class="text-[8px] font-bold text-slate-500 uppercase">TM (STATION)</p>
                    <p id="tm-val" class="orbitron text-lg font-black text-blue-400">0:00</p>
                </div>
            </div>

            <div class="flex items-center gap-4 interactive">
                <div class="text-right">
                    <p class="text-[8px] font-black text-slate-500 uppercase">Vitesse</p>
                    <span id="speed-val" class="text-6xl font-black orbitron italic leading-none">00</span>
                </div>
                <span class="text-xs font-black text-zinc-600 orbitron">KM/H</span>
            </div>
        </div>
    </div>

    <div id="drawer-sig" class="drawer-sig interactive">
        <div class="w-12 h-1.5 bg-zinc-800 rounded-full mx-auto mb-8" onclick="closeSig()"></div>
        <h3 class="orbitron text-center text-xl font-black mb-8 text-red-500 tracking-tighter italic">SIGNALER UN INCIDENT</h3>
        <div class="grid grid-cols-2 gap-4 pb-8">
            <button onclick="sendSignal('BOUCHON')" class="bg-[#1e293b] p-6 rounded-3xl border border-yellow-500/30 text-yellow-500 font-bold text-xs uppercase"><span class="block text-3xl mb-2">🚧</span> Bouchon</button>
            <button onclick="sendSignal('DEVIATION')" class="bg-[#1e293b] p-6 rounded-3xl border border-blue-500/30 text-blue-500 font-bold text-xs uppercase"><span class="block text-3xl mb-2">↪️</span> Déviation</button>
            <button onclick="sendSignal('MALAISE')" class="bg-[#1e293b] p-6 rounded-3xl border border-red-500/30 text-red-500 font-bold text-xs uppercase"><span class="block text-3xl mb-2">🚨</span> Malaise</button>
            <button onclick="sendSignal('INCIDENT')" class="bg-[#1e293b] p-6 rounded-3xl border border-orange-500/30 text-orange-500 font-bold text-xs uppercase"><span class="block text-3xl mb-2">⚠️</span> Autre</button>
        </div>
        <button onclick="closeSig()" class="w-full py-5 text-slate-500 font-bold uppercase text-xs">Annuler</button>
    </div>

    <div id="menu-missions" class="fixed inset-0 bg-[#010208] z-[3000] hidden p-8 flex flex-col">
        <h2 class="orbitron text-2xl font-black text-cyan-500 mb-8 italic">SÉLECTION DE LA MARCHE</h2>
        <div id="mission-list" class="space-y-4 overflow-y-auto interactive">
            </div>
        <button onclick="toggleMissions()" class="mt-8 py-5 border border-white/10 rounded-2xl text-slate-500 uppercase font-bold text-xs">Retour</button>
    </div>

    <script>
        const TERMINUS_IDS = ["CTL", "VM"];
        const DATA_58 = {
            "44454788": { ag: "1", stops: [
                {id: "CTL", name: "CHÂTELET", t: "07:00:00"}, {id: "GA", name: "QUAI AUGUSTINS", t: "07:00:00"},
                {id: "LUX", name: "LUXEMBOURG", t: "07:04:00"}, {id: "18J", name: "18 JUIN 1940", t: "07:09:00"},
                {id: "VM", name: "VANVES MICHELET", t: "07:33:00"}
            ]}
        };

        let map, userMarker, peer, conn, currentBusId;
        let activeMission = null, activeIdx = 0, tmSec = 0, atTerm = false;

        function init() {
            currentBusId = Math.floor(Math.random() * 99) + 1;
            document.getElementById('bus-id-label').innerText = currentBusId;

            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.84, 2.32], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            userMarker = L.circleMarker([0,0], {radius: 9, color: '#fff', fillColor: '#00f2ff', fillOpacity: 1, weight: 3}).addTo(map);

            peer = new Peer(`IRIS-BUS-${currentBusId}`);
            peer.on('open', () => {
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                document.getElementById('gps-status').className = "w-3 h-3 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e]";
            });

            peer.on('connection', c => {
                c.on('data', d => {
                    if(d.type === 'RETOURNEMENT_STRICT' || d.type === 'msg') {
                        const box = document.getElementById('pcc-alert');
                        box.classList.remove('hidden');
                        document.getElementById('pcc-msg').innerText = d.instruction || d.content;
                    }
                });
            });

            const list = document.getElementById('mission-list');
            Object.keys(DATA_58).forEach(id => {
                list.innerHTML += `<button onclick="loadMission('${id}')" class="w-full glass p-6 rounded-3xl text-left border-white/5 active:border-cyan-500">
                    <p class="orbitron text-cyan-400 text-lg font-black">MARCHE ${id} (AG ${DATA_58[id].ag})</p>
                    <p class="text-[10px] text-slate-500 mt-1 uppercase">Départ : ${DATA_58[id].stops[0].t}</p>
                </button>`;
            });

            setInterval(tick, 1000);
            startUltraGeo();
        }

        function loadMission(id) {
            activeMission = DATA_58[id];
            activeIdx = 0;
            document.getElementById('txt-service').innerText = `TV ${id} / AGENT ${activeMission.ag}`;
            toggleMissions();
            updateUI();
        }

        function tick() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('fr-FR');

            if(activeMission) {
                const target = activeMission.stops[activeIdx].t;
                const [h,m,s] = target.split(':').map(Number);
                const tDate = new Date(); tDate.setHours(h,m,s);
                const diff = now - tDate;
                const secTotal = Math.floor(Math.abs(diff)/1000);
                const dispM = Math.floor(secTotal/60);
                const dispS = secTotal % 60;
                
                const box = document.getElementById('eid-val');
                box.innerText = `${diff>=0?'+':'-'}${dispM.toString().padStart(2,'0')}'${dispS.toString().padStart(2,'0')}"`;
                box.className = `text-7xl font-black orbitron ${diff > 30000 ? 'text-red-500 flash-red' : 'text-green-500'}`;
            }

            if(atTerm) {
                tmSec++;
                document.getElementById('tm-val').innerText = `${Math.floor(tmSec/60)}:${(tmSec%60).toString().padStart(2,'0')}`;
            }
        }

        function updateUI() {
            const s = activeMission.stops[activeIdx];
            const isT = TERMINUS_IDS.includes(s.id);
            document.getElementById('stop-name').innerText = s.name;
            document.getElementById('stop-name').className = `text-2xl font-black italic uppercase leading-tight mt-1 ${isT?'text-green-500 terminus-glow':'text-white'}`;
            document.getElementById('stop-time').innerText = s.t.substring(0,5);
            document.getElementById('stop-type-label').innerText = isT ? "Terminus de Ligne" : "Radar de Pointage";
        }

        function nextStop() {
            if(activeMission && activeIdx < activeMission.stops.length-1) {
                activeIdx++; updateUI();
                if(window.navigator.vibrate) window.navigator.vibrate(50);
            }
        }

        function startUltraGeo() {
            const geoOptions = { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 };
            navigator.geolocation.watchPosition(p => {
                const lat = p.coords.latitude, lon = p.coords.longitude;
                document.getElementById('speed-val').innerText = Math.round((p.coords.speed || 0) * 3.6).toString().padStart(2, '0');
                userMarker.setLatLng([lat, lon]);
                map.panTo([lat, lon]);

                if(conn && conn.open) conn.send({ type: 'pos', pol: currentBusId, lat, lon });

                let near = false;
                if(map.distance([lat, lon], [48.8585, 2.3412]) < 60 || map.distance([lat, lon], [48.8210, 2.2985]) < 60) near = true;
                if(near && !atTerm) tmSec = 0;
                atTerm = near;
            }, (e) => console.error("GPS Error", e), geoOptions);
        }

        function sendSignal(type) {
            if(conn && conn.open) conn.send({ type: 'incident', pol: currentBusId, label: type });
            alert("SIGNAL TRANSMIS AU PCC : " + type);
            closeSig();
        }

        function openSig() { document.getElementById('drawer-sig').classList.add('open'); }
        function closeSig() { document.getElementById('drawer-sig').classList.remove('open'); }
        function toggleMissions() { document.getElementById('menu-missions').classList.toggle('hidden'); }
        function toggleMenu() { toggleMissions(); }

        window.onload = init;
    </script>
</body>
</html>
