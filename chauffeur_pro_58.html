        #map { height: 100%; width: 100%; filter: grayscale(1) invert(0.92) contrast(1.1); position: absolute; z-index: 1; }
        
        /* Priorité maximale pour les menus (z-index 999) */
        .drawer {

        }
        .drawer.open { transform: translateY(0); }
        
        .ui-layer { position: relative; z-index: 10; pointer-events: none; height: 100vh; display: flex; flex-col; }
        .interactive { pointer-events: auto; }

        .sig-card { @apply flex flex-col items-center justify-center p-8 rounded-[32px] border-2 border-white/10 active:scale-95 transition-all; }
    </style>
</head>
