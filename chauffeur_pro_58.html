<!DOCTYPE html>
<html>
<head>
    <title>IRIS CHAUFFEUR PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-slate-900 text-white font-sans overflow-hidden">
    <div class="h-screen flex flex-col p-4 gap-4">
        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div class="text-2xl font-black text-emerald-400">IRIS <span class="text-white">58</span></div>
            <div id="clock" class="text-xl font-mono">00:00:00</div>
        </div>

        <button onclick="sendSOS()" class="bg-red-600 p-6 rounded-xl font-bold text-xl animate-pulse">🚨 ALERTE SOS</button>

        <div id="map" class="flex-1 rounded-xl border border-slate-700"></div>

        <div class="grid grid-cols-2 gap-4">
            <button id="startBtn" onclick="toggleService()" class="bg-emerald-600 p-4 rounded-xl font-bold">DÉMARRER</button>
            <div class="bg-slate-800 p-4 rounded-xl text-center border border-slate-700">
                <small class="block text-slate-400">VITESSE</small>
                <span id="speed" class="text-2xl font-black">0</span> km/h
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://angot.pythonanywhere.com";
        const pol = new URLSearchParams(window.location.search).get('pol') || "5801";
        let active = false;
        let map = L.map('map').setView([48.85, 2.34], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        function toggleService() {
            active = !active;
            const btn = document.getElementById('startBtn');
            btn.innerText = active ? "STOP" : "DÉMARRER";
            btn.className = active ? "bg-red-600 p-4 rounded-xl font-bold" : "bg-emerald-600 p-4 rounded-xl font-bold";
        }

        navigator.geolocation.watchPosition(pos => {
            const speed = (pos.coords.speed * 3.6).toFixed(0) || 0;
            document.getElementById('speed').innerText = speed;
            if(active) {
                fetch(`${SERVER_URL}/update_position`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({pol, lat: pos.coords.latitude, lon: pos.coords.longitude, speed})
                });
            }
        }, null, {enableHighAccuracy: true});

        setInterval(async () => {
            if(!active) return;
            const res = await fetch(`${SERVER_URL}/check_order/${pol}`);
            const data = await res.json();
            if(data.order) {
                alert("ORDRE PCC : " + data.order);
                fetch(`${SERVER_URL}/clear_order/${pol}`, {method: 'POST'});
            }
        }, 5000);

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
