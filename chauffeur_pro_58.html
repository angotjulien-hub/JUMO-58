<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRIS GALAXY V7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        
        #map { position: absolute; inset: 0; z-index: 1; filter: grayscale(1) invert(0.92) brightness(0.8); }
        .ui-over-map { position: absolute; inset: 0; z-index: 50; pointer-events: none; display: flex; flex-direction: column; padding: 15px; }
        .interactive { pointer-events: auto; }

        /* NASA Style Radar Vertical (Collègues) */
        .radar-line { width: 4px; height: 200px; background: rgba(255,255,255,0.1); position: relative; border-radius: 2px; }
        .bus-node { position: absolute; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; border-radius: 2px; }
        
        .drawer { position: fixed; inset: 0; background: #000; transform: translateY(100%); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1000; }
        .drawer.open { transform: translateY(0); }

        .text-glow-cyan { text-shadow: 0 0 10px #22d3ee; }
        .text-glow-red { text-shadow: 0 0 10px #ef4444; }
        .text-glow-green { text-shadow: 0 0 10px #22c55e; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-over-map">
        <div class="flex justify-between items-start">
            <div class="flex gap-4 interactive">
                <div class="bg-yellow-400 text-black px-5 py-1 text-4xl font-black orbitron rounded-lg shadow-2xl">58</div>
                <div class="flex flex-col">
                    <span id="txt-marche" class="text-xs font-bold text-zinc-400 tracking-tighter">SÉLECTIONNEZ VOTRE SERVICE</span>
                    <div id="eid-box" class="text-3xl font-black orbitron text-green-500 text-glow-green">+00' 00"</div>
                </div>
            </div>

            <div class="flex flex-col items-end gap-2 interactive">
                <div id="clock" class="orbitron text-xl font-bold bg-black/50 px-4 py-1 rounded border border-white/10">00:00:00</div>
                <button onclick="toggleDrawer('menu-mission')" class="bg-cyan-600 text-black font-black text-[10px] px-4 py-2 rounded uppercase tracking-widest">Missions</button>
            </div>
        </div>

        <div class="flex-1 flex items-center">
            <div class="flex flex-col items-center gap-2 interactive ml-2 bg-black/40 p-3 rounded-full border border-white/5">
                <span class="text-[8px] font-bold text-zinc-500">N-1</span>
                <div class="radar-line">
                    <div id="bus-front" class="bus-node bg-white shadow-[0_0_8px_white]" style="top: 20%;"></div>
                    <div id="bus-me" class="bus-node bg-cyan-500 shadow-[0_0_12px_#22d3ee] h-4 w-4" style="top: 50%;"></div>
                    <div id="bus-back" class="bus-node bg-white/40" style="top: 85%;"></div>
                </div>
                <span class="text-[8px] font-bold text-zinc-500">N+1</span>
            </div>
        </div>

        <div class="flex flex-col gap-4 interactive">
            <div onclick="nextStep()" class="glass rounded-3xl p-6 border-t-2 border-cyan-500 shadow-2xl active:scale-95 transition-all">
                <div class="flex justify-between items-end mb-4">
                    <div class="flex flex-col">
                        <span id="lbl-next-type" class="text-[10px] text-cyan-500 font-bold tracking-widest uppercase">Radar de Pointage</span>
                        <h2 id="lbl-next-name" class="text-3xl font-black italic tracking-tighter uppercase leading-none mt-1">Attente...</h2>
                    </div>
                    <div class="text-right">
                        <span class="text-[9px] text-zinc-500 font-bold uppercase">Départ Prévu</span>
                        <p id="lbl-next-time" class="orbitron text-2xl font-black text-white">--:--</p>
                    </div>
                </div>
                <div class="w-full h-1 bg-white/5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-cyan-500 transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>

            <div class="flex justify-between items-center">
                <button onclick="toggleDrawer('menu-sig')" class="bg-red-600/20 border border-red-600/50 text-red-500 font-black text-xs px-8 py-4 rounded-2xl uppercase">Signalement</button>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-[8px] font-bold text-zinc-500 uppercase leading-none">Vitesse</p>
                        <span id="txt-speed" class="text-5xl font-black orbitron italic italic">00</span>
                    </div>
                    <span class="text-xs font-bold text-zinc-600 orbitron">KM/H</span>
                </div>
            </div>
        </div>
    </div>

    <div id="menu-mission" class="drawer p-8">
        <div class="flex justify-between items-center mb-10">
            <h2 class="orbitron text-2xl font-black italic">NAV-58 MISSIONS</h2>
            <button onclick="toggleDrawer('menu-mission')" class="text-zinc-500">FERMER</button>
        </div>
        <div id="list-missions" class="space-y-4">
            </div>
    </div>

    <script>
        // DONNÉES TECHNIQUES (Inspirées de tes CSV)
        const RADARS_GEOS = {
            "CTL": [48.858, 2.347], "GA": [48.854, 2.342], "LUX": [48.846, 2.337],
            "18J": [48.842, 2.323], "AL": [48.828, 2.327], "CHN": [48.811, 2.301], "VM": [48.821, 2.290]
        };

        const MISSION_EXEMPLE = {
            id: "44454788", agent: "1",
            stops: [
                {id: "CTL", h: "07:00:00"}, {id: "GA", h: "07:00:00"}, {id: "LUX", h: "07:04:00"},
                {id: "18J", h: "07:09:00"}, {id: "AL", h: "07:14:00"}, {id: "CHN", h: "07:23:00"}, {id: "VM", h: "07:33:00"}
            ]
        };

        let map, userMarker, currentIdx = 0, currentService = null;

        function init() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.84, 2.32], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            userMarker = L.circleMarker([0,0], {radius: 8, color: '#fff', fillColor: '#22d3ee', fillOpacity: 1, weight: 3}).addTo(map);
            
            // Simulation des missions (À coupler avec ton CSV)
            const list = document.getElementById('list-missions');
            [MISSION_EXEMPLE].forEach(m => {
                list.innerHTML += `
                    <button onclick="loadMission('${m.id}')" class="w-full glass p-6 rounded-2xl text-left border-white/5 active:border-cyan-500 transition-all">
                        <p class="orbitron text-cyan-400 text-lg font-bold">MARCHE ${m.id} (Agent ${m.agent})</p>
                        <p class="text-xs text-zinc-500 uppercase mt-1">Départ CTL: ${m.stops[0].h} -> Terminus VM</p>
                    </button>
                `;
            });

            setInterval(updateCore, 1000);
            startGeo();
        }

        function loadMission(id) {
            currentService = MISSION_EXEMPLE; // Simplifié pour l'exemple
            currentIdx = 0;
            document.getElementById('txt-marche').innerText = "TV " + id + " / AGENT " + currentService.agent;
            toggleDrawer('menu-mission');
            updateUI();
        }

        function updateCore() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('fr-FR');
            
            if(currentService) {
                const targetStr = currentService.stops[currentIdx].h;
                const [h, m, s] = targetStr.split(':').map(Number);
                const targetDate = new Date();
                targetDate.setHours(h, m, s);
                
                const diffMs = now - targetDate;
                const totalSec = Math.floor(Math.abs(diffMs) / 1000);
                const min = Math.floor(totalSec / 60);
                const sec = totalSec % 60;
                const sign = diffMs > 0 ? "+" : "-";

                const eidBox = document.getElementById('eid-box');
                eidBox.innerText = `${sign}${min.toString().padStart(2, '0')}' ${sec.toString().padStart(2, '0')}"`;
                
                if(diffMs > 30000) { // +30s retard
                    eidBox.className = "text-3xl font-black orbitron text-red-500 text-glow-red";
                } else if (diffMs < -30000) { // -30s avance
                    eidBox.className = "text-3xl font-black orbitron text-yellow-500";
                } else {
                    eidBox.className = "text-3xl font-black orbitron text-green-500 text-glow-green";
                }

                // Simulation Radar NASA (Mouvement aléatoire léger des collègues)
                document.getElementById('bus-front').style.top = (20 + Math.sin(now/2000)*5) + "%";
                document.getElementById('bus-back').style.top = (85 + Math.cos(now/3000)*3) + "%";
            }
        }

        function updateUI() {
            const stop = currentService.stops[currentIdx];
            const isTerminus = (stop.id === "CTL" || stop.id === "VM");
            
            document.getElementById('lbl-next-name').innerText = stop.id === "CTL" ? "CHÂTELET" : (stop.id === "VM" ? "VANVES-MICHELET" : stop.id);
            document.getElementById('lbl-next-name').className = `text-3xl font-black italic tracking-tighter uppercase leading-none mt-1 ${isTerminus ? 'text-green-500 text-glow-green' : 'text-white'}`;
            document.getElementById('lbl-next-time').innerText = stop.h.substring(0,5);
            document.getElementById('lbl-next-type').innerText = isTerminus ? "Terminus de Ligne" : "Radar de Régulation";
            document.getElementById('progress-bar').style.width = ((currentIdx / (currentService.stops.length-1)) * 100) + "%";
        }

        function nextStep() {
            if(currentService && currentIdx < currentService.stops.length - 1) {
                currentIdx++;
                updateUI();
                if(window.navigator.vibrate) window.navigator.vibrate([50, 30, 50]);
            }
        }

        function startGeo() {
            navigator.geolocation.watchPosition(p => {
                const s = Math.round((p.coords.speed || 0) * 3.6);
                document.getElementById('txt-speed').innerText = s.toString().padStart(2, '0');
                if(userMarker) {
                    userMarker.setLatLng([p.coords.latitude, p.coords.longitude]);
                    map.panTo([p.coords.latitude, p.coords.longitude]);
                }
            }, null, {enableHighAccuracy: true});
        }

        function toggleDrawer(id) { document.getElementById(id).classList.toggle('open'); }

        window.onload = init;
    </script>
</body>
</html>
