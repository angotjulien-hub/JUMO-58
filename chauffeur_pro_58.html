<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS Terminal Chauffeur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; height: 100vh; background: #000; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        .overlay { 
            position: absolute; bottom: 20px; left: 20px; right: 20px; 
            z-index: 10; background: rgba(0,0,0,0.85); 
            border: 2px solid #00f2ff; border-radius: 15px; padding: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

<div id="map"></div>

<div class="overlay">
    <div class="flex justify-between items-center text-white">
        <div>
            <div class="text-cyan-400 text-xs font-bold">PROCHAIN ARRÊT</div>
            <div class="text-2xl font-bold">MONTPARNASSE 2</div>
        </div>
        <div class="text-right">
            <div class="text-xs text-slate-400">ÉCART / IDFM</div>
            <div class="text-3xl font-bold text-green-400">-00:15</div>
        </div>
    </div>
    <div class="mt-4 flex gap-4">
        <button class="flex-1 bg-slate-800 text-white py-3 rounded-lg font-bold border border-white/10">RADIO PCC</button>
        <button class="flex-1 bg-red-600 text-white py-3 rounded-lg font-bold">ALARME DISCRÈTE</button>
    </div>
</div>

<script>
    // Initialisation
    var map = L.map('map', { zoomControl: false }).setView([48.838, 2.318], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OSM'
    }).addTo(map);

    // Marker de position propre (Le Bus)
    var busMarker = L.circleMarker([48.838, 2.318], {
        radius: 10, color: '#00f2ff', fillColor: '#00f2ff', fillOpacity: 1
    }).addTo(map);

    // Forcer le rafraîchissement visuel
    setTimeout(() => { map.invalidateSize(); }, 500);
</script>
</body>
</html>
