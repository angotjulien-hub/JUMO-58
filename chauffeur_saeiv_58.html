<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - SAEIV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #fff; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .hud { position: absolute; z-index: 1000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 2px solid #2563eb; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>
    <div class="hud top-0 left-0 right-0 p-4 flex justify-between items-center shadow-lg">
        <div>
            <div class="text-[10px] font-black text-zinc-400 uppercase tracking-widest">Prochain Arrêt</div>
            <div id="stop-name" class="text-xl font-black text-blue-700 uppercase leading-none">Localisation...</div>
        </div>
        <div class="text-right">
            <div id="clock" class="text-lg font-black orbitron">00:00</div>
            <div id="delay-box" class="text-xs font-bold text-green-600 uppercase">En Ligne</div>
        </div>
    </div>

    <div id="map"></div>

    <div id="msg-box" class="fixed inset-0 z-[5000] bg-red-600 hidden flex flex-col items-center justify-center p-10 text-white text-center">
        <div class="text-6xl mb-6">🔄</div>
        <h2 class="orbitron text-2xl font-black mb-4">RETOURNEMENT</h2>
        <p id="msg-text" class="text-xl font-bold uppercase mb-10 italic">Régulation d'intervalle requise</p>
        <button onclick="ack()" class="w-full py-6 bg-white text-red-600 font-black orbitron text-2xl rounded-3xl shadow-2xl">COMPRIS</button>
    </div>

    <script>
        const PARCOURS = ["Vanves - Lycée Michelet", "Carrefour Albert Legris", "Jean Jaurès - Jean Bleuzen", "Adolphe Pinard", "Pont de la Vallée", "Porte de Vanves", "Colonel Monteil", "Didot", "Hôpitaux Broussais Et Saint-Joseph", "Alésia - Didot", "Pernety", "Château", "Losserand - Maine", "Gaîté", "Gare Montparnasse", "Montparnasse - Rue du Départ", "Vavin", "Notre-Dame-Des-Champs", "Raspail - Fleurus", "Fleurus", "Musée du Luxembourg", "Sénat", "Théâtre de L'Odéon", "Saint-Germain - Odéon", "Saint-André Des Arts", "Pont Neuf - Q. Grands Augustins", "Châtelet"];
        
        const params = new URLSearchParams(window.location.search);
        const POL = params.get('police') || "0000";
        const AGENT_ID = `BUS-58-P${POL}`;
        let map, marker, peer, conn;

        function init() {
            map = L.map('map', {zoomControl:false}).setView([48.830, 2.310], 16);
            // CARTE CLAIRE POUR VISIBILITÉ PLEIN SOLEIL
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
            
            marker = L.marker([0,0], {icon: L.divIcon({html:'<div style="width:24px;height:24px;background:#2563eb;border:4px solid white;border-radius:50%;box-shadow:0 0 10px rgba(0,0,0,0.3);"></div>'})}).addTo(map);

            if (navigator.geolocation) navigator.geolocation.watchPosition(updateGPS, null, {enableHighAccuracy:true});
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
            
            initPeer();
        }

        function updateGPS(pos) {
            const lat = pos.coords.latitude; const lon = pos.coords.longitude;
            marker.setLatLng([lat, lon]);
            map.panTo([lat, lon]);
            if(conn && conn.open) conn.send({type:'position', pol:POL, lat, lon});
        }

        function initPeer() {
            peer = new Peer(AGENT_ID);
            peer.on('open', () => {
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                conn.on('data', (d) => {
                    if(d.type === 'RETOURNEMENT') {
                        document.getElementById('msg-box').classList.remove('hidden');
                        new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                    }
                });
            });
            peer.on('error', () => setTimeout(initPeer, 3000));
        }

        function ack() { document.getElementById('msg-box').classList.add('hidden'); }
        window.onload = init;
    </script>
</body>
</html>
