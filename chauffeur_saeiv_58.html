<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - TERMINAL SAEIV v2.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --iris-blue: #00f2ff; --iris-orange: #ffae00; --iris-bg: #050505; }
        body, html { margin: 0; background: var(--iris-bg); font-family: 'Orbitron', sans-serif; color: white; height: 100%; overflow: hidden; }
        #map-container { height: 100vh; width: 100vw; transition: transform 0.3s linear; }
        #map { height: 100%; width: 100%; filter: brightness(0.6) saturate(1.4); }
        .ui-panel { position: absolute; z-index: 1000; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.2); }
        .next-stop-panel { top: 15px; left: 15px; right: 15px; padding: 20px; border-left: 6px solid var(--iris-blue); }
        .interval-panel { top: 130px; right: 15px; width: 100px; padding: 12px; text-align: center; }
        .footer { bottom: 25px; left: 15px; right: 15px; padding: 20px; border-bottom: 4px solid var(--iris-blue); }
        .direction-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid var(--iris-blue); filter: drop-shadow(0 0 10px var(--iris-blue)); }
        #sub-menu { bottom: 0; left: 0; right: 0; height: 65%; z-index: 2000; padding: 25px; border-radius: 30px 30px 0 0; }
    </style>
</head>
<body>

    <div class="ui-panel next-stop-panel rounded-lg shadow-2xl">
        <div class="text-[10px] text-cyan-500 tracking-[3px] mb-1 uppercase">Prochain Arrêt</div>
        <div id="next-stop-name" class="text-2xl font-bold uppercase truncate">Localisation...</div>
        <div id="dist-stop" class="text-[10px] text-zinc-500 mt-1 italic">Distance : --- m</div>
    </div>

    <div class="ui-panel interval-panel rounded-lg flex flex-col gap-4">
        <div><div class="text-[8px] text-zinc-500 uppercase">Devant</div><div id="int-prev" class="text-sm font-bold text-green-400">-- min</div></div>
        <div class="border-t border-zinc-800 pt-2"><div class="text-[8px] text-zinc-500 uppercase">Derrière</div><div id="int-next" class="text-sm font-bold text-cyan-400">-- min</div></div>
    </div>

    <div id="map-container"><div id="map"></div></div>

    <button onclick="toggleMenu()" class="ui-panel shadow-2xl" style="bottom: 110px; left: 15px; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid var(--iris-blue);">
        <span class="text-2xl text-cyan-400">☰</span>
    </button>

    <div class="ui-panel footer rounded-xl flex justify-between items-center shadow-2xl">
        <div><div class="text-[9px] text-zinc-500 uppercase tracking-widest">IRIS 58 // UNIT S8</div><div id="status-label" class="text-lg font-bold text-green-400 uppercase">En Ligne</div></div>
        <button onclick="toggleMan()" id="btn-man" class="bg-blue-900/20 border border-cyan-500 px-6 py-3 text-[10px] font-bold uppercase tracking-widest transition-colors">🔄 Manoeuvre</button>
    </div>

    <div id="sub-menu" class="ui-panel transition-transform duration-500 translate-y-full shadow-[0_-20px_50px_rgba(0,0,0,0.8)]">
        <div class="w-12 h-1 bg-zinc-800 rounded-full mx-auto mb-6"></div>
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-bold text-white tracking-tighter uppercase">Menu <span class="text-cyan-400">IRIS 58</span></h2>
            <button onclick="toggleMenu()" class="text-zinc-500 text-sm">FERMER</button>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-zinc-900/50 p-6 rounded-2xl border border-zinc-800 text-center active:scale-95" onclick="setView('exploitation')">
                <div class="text-3xl mb-2">📋</div><div class="text-[10px] uppercase">Exploitation</div>
            </div>
            <div class="bg-zinc-900/50 p-6 rounded-2xl border border-zinc-800 text-center active:scale-95" onclick="setView('stats')">
                <div class="text-3xl mb-2">📊</div><div class="text-[10px] uppercase">Audit IDFM</div>
            </div>
            <div class="bg-zinc-900/50 p-6 rounded-2xl border border-zinc-800 text-center active:scale-95" onclick="setView('deviations')">
                <div class="text-3xl mb-2">🚧</div><div class="text-[10px] uppercase">Déviation</div>
            </div>
            <div class="bg-red-900/10 p-6 rounded-2xl border border-red-500/50 text-center active:scale-90" onclick="envoyerSOS()">
                <div class="text-3xl mb-2">🚨</div><div class="text-[10px] uppercase text-red-500 font-bold tracking-widest">SOS SOS</div>
            </div>
        </div>
    </div>

    <script>
        let map, marker, peer, conn, isManoeuvre = false;
        const AGENT_ID = 'BUS-58-' + Math.floor(Math.random()*9000);
        const stops = [{name:"Vanves Michelet",c:[48.821,2.290]},{name:"Mairie de Vanves",c:[48.823,2.295]},{name:"Alésia",c:[48.828,2.327]},{name:"Châtelet",c:[48.858,2.346]}];

        function init() {
            map = L.map('map', {zoomControl:false, attributionControl:false}).setView([48.828, 2.327], 17);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.marker([48.828, 2.327], {icon: L.divIcon({className:'', html:'<div class="direction-arrow"></div>', iconSize:[20,25]})}).addTo(map);
            if (navigator.geolocation) navigator.geolocation.watchPosition(updateGPS, null, {enableHighAccuracy:true});
            initPeer();
        }

        function toggleMenu() { document.getElementById('sub-menu').classList.toggle('translate-y-full'); }

        function updateGPS(pos) {
            const {latitude, longitude, heading} = pos.coords;
            if (heading !== null) document.getElementById('map-container').style.transform = `rotate(${-heading}deg)`;
            marker.setLatLng([latitude, longitude]);
            map.flyTo([latitude, longitude], isManoeuvre ? 18 : 17);
            
            // SAEIV Prochain Arrêt
            let closest = stops[0], minDist = Infinity;
            stops.forEach(s => { const d = map.distance([latitude, longitude], s.c); if(d < minDist && d > 20){minDist=d; closest=s;} });
            document.getElementById('next-stop-name').innerText = closest.name;
            document.getElementById('dist-stop').innerText = `Distance : ${Math.round(minDist)} m`;

            if (conn && conn.open) conn.send({type:'position', id:AGENT_ID, lat:latitude, lon:longitude, status:isManoeuvre});
        }

        function toggleMan() { 
            isManoeuvre = !isManoeuvre; 
            document.getElementById('btn-man').classList.toggle('bg-orange-600');
            document.getElementById('status-label').innerText = isManoeuvre ? "En Manoeuvre" : "En Ligne";
            document.getElementById('status-label').style.color = isManoeuvre ? "#ffae00" : "#00f2ff";
        }

        function envoyerSOS() {
            if (confirm("⚠️ ENVOYER SIGNAL D'URGENCE AU PCC ?")) {
                if (conn && conn.open) conn.send({type: 'SOS', id: AGENT_ID});
                alert("ALERTE SOS ENVOYÉE");
                toggleMenu();
            }
        }

        function initPeer() {
            peer = new Peer(AGENT_ID);
            peer.on('open', () => {
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                conn.on('data', (d) => {
                    if(d.type === 'intervals'){
                        document.getElementById('int-prev').innerText = d.prev + " min";
                        document.getElementById('int-next').innerText = d.next + " min";
                    }
                });
            });
        }
        window.onload = init;
    </script>
</body>
</html>
