<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - TERMINAL SAEIV v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --iris-blue: #00f2ff; --sae-blue: #2c5282; --sae-bg: #1a1a1a; }
        body, html { margin: 0; background: #000; font-family: 'Inter', sans-serif; color: white; height: 100%; overflow: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.4) saturate(1.2); }
        .ui-panel { position: absolute; z-index: 1000; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* SAE Style */
        #sub-menu { bottom: 0; left: 0; right: 0; height: 80%; z-index: 2000; background: var(--sae-bg); border-top: 4px solid var(--sae-blue); padding: 15px; border-radius: 20px 20px 0 0; }
        .sae-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .sae-btn { background: #e2e8f0; color: #1a202c; height: 85px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; text-align: center; padding: 5px; }
        .sae-btn label { font-size: 8px; font-weight: 900; line-height: 1.1; text-transform: uppercase; margin-top: 4px; }

        #chrono-bar { top: 70px; left: 0; right: 0; height: 45px; display: flex; items-center; justify-content: space-between; padding: 0 20px; border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 2px solid transparent; }
        .direction-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid var(--iris-blue); }
    </style>
</head>
<body>

    <div class="ui-panel top-0 left-0 right-0 p-4 border-none bg-black flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-green-600 px-3 py-1 rounded font-bold orbitron text-white text-sm">58</div>
            <div>
                <div id="next-stop-name" class="font-bold text-lg uppercase leading-none">Initialisation...</div>
                <div id="info-vacation" class="text-[9px] text-cyan-500 orbitron mt-1 tracking-widest">---</div>
            </div>
        </div>
        <div class="orbitron text-right text-xs font-bold" id="clock">00:00</div>
    </div>

    <div id="chrono-bar" class="ui-panel bg-zinc-900/90 items-center">
        <div class="flex flex-col">
            <span class="text-[7px] text-zinc-500 uppercase orbitron">État Tableau de Marche</span>
            <span id="tm-label" class="text-[10px] font-bold uppercase">CALCUL...</span>
        </div>
        <div id="delay-value" class="orbitron text-xl font-bold">00:00</div>
    </div>

    <div id="map"></div>

    <button onclick="toggleMenu()" class="ui-panel bottom-20 left-6 w-14 h-14 rounded-full flex items-center justify-center bg-blue-700 border-2 border-white shadow-2xl">
        <span class="font-bold text-[10px] text-white">MENU</span>
    </button>

    <div id="sub-menu" class="transition-transform duration-500 translate-y-full">
        <div class="sae-grid">
            <div class="sae-btn" onclick="actionSAE('Service')"><span>🗼</span><label>Service</label></div>
            <div class="sae-btn" style="background: #fbd38d;" onclick="actionSAE('Alarmes')"><span>⚠️</span><label>Alarmes</label></div>
            <div class="sae-btn"><span>📝</span><label>Signalement</label></div>
            <div class="sae-btn"><span>✉️</span><label>Messagerie</label></div>
            <div class="sae-btn"><span>📢</span><label>Diffusion</label></div>
            <div class="sae-btn"><span>👥</span><label>Relève</label></div>
            <div class="sae-btn"><span>👤</span><label>Prise Svc</label></div>
            <div class="sae-btn"><span>🚌</span><label>Test</label></div>
        </div>
        <div class="mt-6 grid grid-cols-2 gap-2">
            <button onclick="envoyerSOS()" class="bg-red-700 py-4 rounded font-bold text-[10px] uppercase">🚨 Appel Urgence</button>
            <button onclick="toggleMenu()" class="bg-zinc-800 py-4 rounded font-bold text-[10px] uppercase">✖ Fermer</button>
        </div>
    </div>

    <div id="msg-reception" class="ui-panel hidden" style="inset:0; z-index:4000; background:rgba(0,0,0,0.98);">
        <div class="p-8 h-full flex flex-col justify-center items-center text-center">
            <div class="text-cyan-400 text-6xl mb-6">✉️</div>
            <div id="msg-content" class="text-2xl font-bold uppercase mb-12 orbitron">--</div>
            <button onclick="acquitterMessage()" class="w-full max-w-sm bg-cyan-600 py-6 rounded-xl font-bold text-xl">REÇU</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const SVC = params.get('service') || "05801";
        const POLICE = params.get('police') || "0000";
        const AGENT_ID = `BUS-58-P${POLICE}`;

        // TABLEAU DE MARCHE (TM) - Minutes depuis minuit
        const TM_THEORIQUE = { "Vanves Michelet": 865, "Mairie de Vanves": 868, "Alésia": 880, "Châtelet": 900 };

        let map, marker, peer, conn, currentDelay = 0;
        const stops = [{name:"Vanves Michelet",c:[48.821,2.290]},{name:"Mairie de Vanves",c:[48.823,2.295]},{name:"Alésia",c:[48.828,2.327]},{name:"Châtelet",c:[48.858,2.346]}];

        function init() {
            document.getElementById('info-vacation').innerText = `SVC: ${SVC} | POL: ${POLICE}`;
            map = L.map('map', {zoomControl:false, attributionControl:false}).setView([48.828, 2.327], 17);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.marker([48.828, 2.327], {icon: L.divIcon({className:'', html:'<div class="direction-arrow"></div>', iconSize:[20,25]})}).addTo(map);
            if (navigator.geolocation) navigator.geolocation.watchPosition(updateGPS, null, {enableHighAccuracy:true});
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
            initPeer();
        }

        function updateGPS(pos) {
            const {latitude, longitude} = pos.coords;
            marker.setLatLng([latitude, longitude]);
            map.flyTo([latitude, longitude], 17);
            
            let closest = stops[0], minDist = Infinity;
            stops.forEach(s => { const d = map.distance([latitude, longitude], s.c); if(d < minDist){minDist=d; closest=s;} });
            
            document.getElementById('next-stop-name').innerText = closest.name;
            if(minDist < 60) calculerPonctualite(closest.name);

            if (conn && conn.open) conn.send({type:'position', id:AGENT_ID, police:POLICE, service:SVC, lat:latitude, lon:longitude, delay:currentDelay});
        }

        function calculerPonctualite(stopName) {
            if (!TM_THEORIQUE[stopName]) return;
            const now = new Date();
            const minNow = (now.getHours() * 60) + now.getMinutes();
            currentDelay = minNow - TM_THEORIQUE[stopName];

            const disp = document.getElementById('delay-value');
            const bar = document.getElementById('chrono-bar');
            const lbl = document.getElementById('tm-label');

            if (currentDelay > 0) { disp.innerText = `-${currentDelay}'`; disp.className = "text-red-500 orbitron text-xl font-bold"; bar.style.borderBottomColor = "#ef4444"; lbl.innerText = "Retard"; }
            else if (currentDelay < 0) { disp.innerText = `+${Math.abs(currentDelay)}'`; disp.className = "text-cyan-400 orbitron text-xl font-bold"; bar.style.borderBottomColor = "#00f2ff"; lbl.innerText = "Avance"; }
            else { disp.innerText = "00:00"; disp.className = "text-green-500 orbitron text-xl font-bold"; bar.style.borderBottomColor = "#22c55e"; lbl.innerText = "À l'heure"; }
        }

        function toggleMenu() { document.getElementById('sub-menu').classList.toggle('translate-y-full'); }
        function actionSAE(t) { if(t==='Alarmes') document.getElementById('page-alarmes').style.display='block'; else alert(t); }
        function acquitterMessage() { document.getElementById('msg-reception').classList.add('hidden'); if(conn) conn.send({type:'ack_message', police:POLICE}); }

        function initPeer() {
            peer = new Peer(AGENT_ID);
            peer.on('open', () => {
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                conn.on('data', (d) => {
                    if(d.type === 'message_pcc'){ document.getElementById('msg-content').innerText = d.texte; document.getElementById('msg-reception').classList.remove('hidden'); }
                    if(d.type === 'intervals'){ document.getElementById('int-prev').innerText = d.prev + "'"; document.getElementById('int-next').innerText = d.next + "'"; }
                });
            });
        }
        window.onload = init;
    </script>
</body>
</html>
