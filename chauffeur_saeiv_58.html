<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - SAEIV CONDUCTEUR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; font-family: 'Inter', sans-serif; color: white; height: 100vh; overflow: hidden; margin: 0; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.4); z-index: 1; }
        .ui-panel { position: absolute; z-index: 1000; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); }
        .sae-header { top: 0; left: 0; right: 0; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #222; }
        #sub-menu { position: fixed; bottom: 0; left: 0; right: 0; height: 65%; background: #111; border-top: 4px solid #2563eb; border-radius: 30px 30px 0 0; transform: translateY(100%); transition: transform 0.4s ease; z-index: 5000; padding: 20px; }
        #sub-menu.open { transform: translateY(0); }
        .sae-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .sae-btn { background: #e2e8f0; color: #000; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; font-weight: 900; font-size: 8px; text-transform: uppercase; }
        .direction-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid #00f2ff; filter: drop-shadow(0 0 5px #00f2ff); }
    </style>
</head>
<body>
    <div class="sae-header ui-panel">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 px-3 py-1 rounded font-black orbitron text-white text-lg">58</div>
            <div>
                <div id="next-stop-name" class="font-black text-sm uppercase text-white">RECHERCHE...</div>
                <div id="info-vacation" class="text-[8px] text-cyan-400 orbitron">SVC: -- | POL: --</div>
            </div>
        </div>
        <div id="clock" class="text-sm font-bold orbitron">00:00</div>
    </div>

    <div id="chrono-bar" class="fixed top-[70px] left-0 right-0 h-12 bg-black/80 z-[1000] flex items-center justify-between px-6 border-b border-zinc-800">
        <span class="text-[8px] uppercase text-zinc-500 font-bold">Tableau de Marche</span>
        <div id="delay-value" class="orbitron font-bold text-xl">00:00</div>
    </div>

    <div id="map"></div>

    <button onclick="toggleMenu()" class="fixed bottom-8 left-6 w-16 h-16 rounded-full bg-blue-600 z-[2000] border-4 border-white shadow-2xl font-black text-[10px] orbitron">MENU</button>

    <div id="sub-menu">
        <div class="w-12 h-1 bg-zinc-800 rounded-full mx-auto mb-6"></div>
        <div class="sae-grid mb-6">
            <button onclick="sendAlert('Trafic')" class="sae-btn" style="background:#fbbf24">🚗<span>Trafic</span></button>
            <button onclick="sendAlert('Incident')" class="sae-btn">👥<span>Incident</span></button>
            <button onclick="sendAlert('Déviation')" class="sae-btn">🚧<span>Déviation</span></button>
            <button onclick="sendAlert('Relève')" class="sae-btn">👤<span>Relève</span></button>
        </div>
        <button onclick="envoyerSOS()" class="w-full bg-red-700 py-5 rounded-xl font-black orbitron text-white mb-4">🚨 SOS URGENCE</button>
        <button onclick="toggleMenu()" class="w-full text-zinc-600 text-[10px] uppercase font-bold">Fermer</button>
    </div>

    <div id="msg-box" class="fixed inset-0 z-[9000] bg-black/fb backdrop-blur-xl hidden flex flex-col items-center justify-center p-6">
        <h2 class="text-zinc-500 text-[10px] uppercase tracking-widest mb-4">Message PCC</h2>
        <div id="msg-text" class="text-2xl font-black orbitron text-center mb-10 text-white uppercase italic">---</div>
        <button onclick="ackMsg()" class="w-full max-w-xs bg-cyan-600 py-6 rounded-2xl font-black text-black orbitron">REÇU</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const SVC = params.get('service') || "00000";
        const POLICE = params.get('police') || "0000";
        const AGENT_ID = `BUS-58-P${POLICE}`;
        const PCC_ID = 'IRIS-PCC-58-GLOBAL';

        const stops = [{name:"Vanves Michelet",c:[48.821,2.290]},{name:"Mairie de Vanves",c:[48.823,2.295]},{name:"Alésia",c:[48.828,2.327]},{name:"Châtelet",c:[48.858,2.346]}];
        let map, marker, peer, conn, currentDelay = 0;

        function init() {
            document.getElementById('info-vacation').innerText = `SVC: ${SVC} | POL: ${POLICE}`;
            map = L.map('map', {zoomControl:false, attributionControl:false}).setView([48.828, 2.327], 17);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.marker([48.828, 2.327], {icon: L.divIcon({className:'', html:'<div class="direction-arrow"></div>', iconSize:[20,25]})}).addTo(map);
            if (navigator.geolocation) navigator.geolocation.watchPosition(updateGPS, null, {enableHighAccuracy:true});
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
            initPeer();
        }

        function updateGPS(pos) {
            const {latitude, longitude} = pos.coords;
            marker.setLatLng([latitude, longitude]);
            map.flyTo([latitude, longitude], 17);
            if (conn && conn.open) conn.send({type:'position', id:AGENT_ID, police:POLICE, service:SVC, lat:latitude, lon:longitude, delay:currentDelay});
        }

        function initPeer() {
            peer = new Peer(AGENT_ID);
            peer.on('open', () => {
                conn = peer.connect(PCC_ID);
                conn.on('data', (d) => {
                    if(d.type === 'message_pcc'){
                        document.getElementById('msg-text').innerText = d.texte;
                        document.getElementById('msg-box').classList.remove('hidden');
                        new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                    }
                });
            });
        }

        function toggleMenu() { document.getElementById('sub-menu').classList.toggle('open'); }
        function sendAlert(l) { if(conn && conn.open) { conn.send({type:'signalement', police:POLICE, label:l}); toggleMenu(); } }
        function ackMsg() { document.getElementById('msg-box').classList.add('hidden'); if(conn) conn.send({type:'ack_message', police:POLICE}); }
        function envoyerSOS() { if(confirm("SOS ?") && conn) conn.send({type:'SOS', police:POLICE}); }

        window.onload = init;
    </script>
</body>
</html>
