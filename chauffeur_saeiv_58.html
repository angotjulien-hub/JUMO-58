<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRIS SAEIV v5.0 - Ligne 58</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .ui-card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 20px; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Styles de mission dynamiques */
        .mission-ctl { border-top: 6px solid #22d3ee; box-shadow: 0 -10px 30px rgba(34, 211, 238, 0.1); }
        .mission-van { border-top: 6px solid #fbbf24; box-shadow: 0 -10px 30px rgba(251, 191, 36, 0.1); }
        
        #map { height: 180px; width: 100%; border-radius: 15px; z-index: 1; filter: grayscale(1) invert(0.9) contrast(1.2); }
        
        /* Modales d'alerte PCC */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 9999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); padding: 20px; }
        .hidden { display: none !important; }
        .pop-in { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <header class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-3">
            <div id="line-badge" class="bg-[#FFD700] text-black px-4 py-1 text-3xl font-black rounded-lg orbitron">58</div>
            <div>
                <p class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Direction</p>
                <p id="mission-label" class="text-cyan-400 font-black uppercase text-xl tracking-tighter italic">VERS CHÂTELET</p>
            </div>
        </div>
        <div class="flex gap-2">
             <div id="sync-status" class="bg-zinc-900 border border-zinc-700 px-3 py-3 rounded-xl text-[9px] font-black uppercase text-zinc-500">CONNEXION...</div>
             <button onclick="basculerMission()" class="bg-zinc-900 border border-zinc-700 px-6 py-3 rounded-xl text-xs font-black uppercase active:scale-95 transition-all shadow-lg">🔄 Inverser</button>
        </div>
    </header>

    <main id="main-card" class="ui-card p-6 mb-4 flex flex-col items-center justify-center mission-ctl flex-1">
        <span class="text-zinc-600 text-[10px] uppercase tracking-[0.4em] mb-4 font-bold">Prochain Arrêt</span>
        <h1 id="display-station" class="text-4xl font-black text-center uppercase tracking-tighter leading-tight min-h-[120px] flex items-center italic cursor-pointer select-none">
            CHARGEMENT...
        </h1>
    </main>

    <div class="grid grid-cols-3 gap-4 mb-4">
        <div class="col-span-2 ui-card p-2">
            <div id="map"></div>
        </div>
        <div class="flex flex-col gap-3">
            <div class="ui-card flex-1 flex flex-col items-center justify-center p-2">
                <span class="text-zinc-600 text-[8px] uppercase font-bold italic">Vitesse</span>
                <div id="speed" class="text-4xl font-black italic orbitron text-white">00</div>
                <span class="text-[8px] text-zinc-700 font-bold tracking-widest">KM/H</span>
            </div>
            <div class="ui-card flex-1 flex flex-col items-center justify-center p-2">
                <div id="gps-status" class="w-4 h-4 rounded-full bg-red-600 shadow-[0_0_10px_red]"></div>
                <span class="text-[8px] text-zinc-700 font-bold mt-1 uppercase">Signal GPS</span>
            </div>
        </div>
    </div>

    <div id="modal-retournement" class="modal hidden">
        <div class="bg-zinc-900 border-t-8 border-red-600 p-10 rounded-[40px] text-center w-full max-w-md shadow-2xl pop-in">
            <div class="text-red-500 font-black orbitron text-xs mb-4 tracking-widest">⚠️ RÉGULATION IRIS</div>
            <h2 class="text-4xl font-black mb-4 italic uppercase">RETOURNEMENT</h2>
            <p class="text-zinc-400 mb-8 uppercase text-sm font-bold leading-relaxed">Le PCC demande un rebroussage immédiat à : <br><span class="text-white text-3xl font-black italic">ALÉSIA</span></p>
            <button onclick="ack('modal-retournement')" class="w-full bg-red-600 py-6 rounded-3xl font-black text-2xl uppercase shadow-lg shadow-red-900/40 active:scale-95 transition-all">Acquitter l'ordre</button>
        </div>
    </div>

    <div id="modal-msg" class="modal hidden">
        <div class="bg-zinc-900 border-t-8 border-cyan-500 p-10 rounded-[40px] text-center w-full max-w-md shadow-2xl pop-in">
            <div class="text-cyan-500 font-black orbitron text-xs mb-4 tracking-widest">💬 MESSAGE DU PCC</div>
            <div id="msg-content" class="text-2xl font-black mb-10 italic text-white uppercase leading-tight tracking-tighter">MESSAGE EN ATTENTE...</div>
            <button onclick="ack('modal-msg')" class="w-full bg-cyan-600 py-6 rounded-3xl font-black text-2xl uppercase shadow-lg shadow-cyan-900/40 active:scale-95 transition-all">Bien reçu</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const POL = params.get('police') || "0000";

        const DATA = {
            "V_CTL": [
                {name: "Vanves-Lycée Michelet"}, {name: "Carrefour Albert Legris"}, {name: "Jean Jaurès-Jean Bleuzen"},
                {name: "Adolphe Pinard"}, {name: "Pont de la Vallée"}, {name: "Porte de Vanves"},
                {name: "Colonel Monteil"}, {name: "Didot"}, {name: "Hôpitaux Broussais et St-Joseph"},
                {name: "Didot-Alésia"}, {name: "Pernety"}, {name: "Château-Mairie du 14ème"},
                {name: "Losserand-Maine"}, {name: "Gaîté"}, {name: "Gare Montparnasse"},
                {name: "18 Juin 1940"}, {name: "Vavin"}, {name: "Guynemer-Vavin"}, {name: "Fleurus"},
                {name: "Musée du Luxembourg"}, {name: "Sénat"}, {name: "Théâtre de l'Odéon"},
                {name: "Saint-Germain-Odéon"}, {name: "Saint-André des Arts"}, {name: "Pont Neuf-Quai des Grands Augustins"},
                {name: "Châtelet-Quai de Gesvres"}, {name: "Châtelet"}
            ],
            "V_VAN": [
                {name: "Châtelet"}, {name: "Cité-Palais de Justice"}, {name: "Saint-Michel"},
                {name: "Guénégaud"}, {name: "Mazarine"}, {name: "Saint-Germain-Odéon"},
                {name: "Sénat"}, {name: "Musée du Luxembourg"}, {name: "Guynemer-Vavin"},
                {name: "Bréa-Notre-Dame des Champs"}, {name: "Vavin"}, {name: "Montparnasse-Cinémas"},
                {name: "Gare Montparnasse"}, {name: "Gaîté"}, {name: "Losserand-Maine"},
                {name: "Château-Mairie du 14ème"}, {name: "Rue Bénard"}, {name: "Alésia-Les Plantes"},
                {name: "Hôpital N-D de Bon Secours"}, {name: "Jean Moulin"}, {name: "Porte de Châtillon"},
                {name: "Porte Didot-Lycée Raspail"}, {name: "Porte de Vanves"}, {name: "Pont de la Vallée"},
                {name: "Jean Jaurès-Jean Bleuzen"}, {name: "Carrefour Albert Legris"}, {name: "Vanves-Lycée Michelet"}
            ]
        };

        let currentMission = "V_CTL";
        let currentIndex = 0;
        let peer, conn;

        // --- SYSTEME DE COMMUNICATION IRIS ---
        function initPeer() {
            peer = new Peer(`BUS-58-P${POL}`);
            
            peer.on('open', (id) => {
                document.getElementById('sync-status').innerText = "LIVE SYNC";
                document.getElementById('sync-status').classList.replace('text-zinc-500', 'text-cyan-400');
                
                // Connexion au PCC
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                setupReception(conn);
            });

            peer.on('connection', setupReception);
        }

        function setupReception(c) {
            conn = c;
            conn.on('data', (data) => {
                if (data.type === 'RETOURNEMENT') {
                    document.getElementById('modal-retournement').classList.remove('hidden');
                    jouerSon();
                } else if (data.type === 'msg') {
                    document.getElementById('msg-content').innerText = data.content;
                    document.getElementById('modal-msg').classList.remove('hidden');
                    jouerSon();
                }
            });
        }

        function jouerSon() {
            if (window.navigator.vibrate) window.navigator.vibrate([300, 100, 300]);
            // Optionnel : new Audio('son.mp3').play();
        }

        function ack(id) { document.getElementById(id).classList.add('hidden'); }

        // --- LOGIQUE D'AFFICHAGE ---
        function basculerMission() {
            currentMission = (currentMission === "V_CTL") ? "V_VAN" : "V_CTL";
            currentIndex = 0;
            const label = document.getElementById('mission-label');
            const card = document.getElementById('main-card');
            
            if(currentMission === "V_CTL") {
                label.innerText = "VERS CHÂTELET";
                label.className = "text-cyan-400 font-black uppercase text-xl italic tracking-tighter";
                card.className = "ui-card p-6 mb-4 flex flex-col items-center justify-center mission-ctl flex-1";
            } else {
                label.innerText = "VERS VANVES";
                label.className = "text-yellow-400 font-black uppercase text-xl italic tracking-tighter";
                card.className = "ui-card p-6 mb-4 flex flex-col items-center justify-center mission-van flex-1";
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('display-station').innerText = DATA[currentMission][currentIndex].name;
        }

        document.getElementById('display-station').onclick = () => {
            currentIndex = (currentIndex + 1) % DATA[currentMission].length;
            updateDisplay();
        };

        // --- INITIALISATION MAP & GPS ---
        window.onload = () => {
            const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.835, 2.320], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            updateDisplay();
            initPeer();

            if ("geolocation" in navigator) {
