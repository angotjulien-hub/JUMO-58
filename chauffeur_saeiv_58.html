<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - TERMINAL SAEIV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --iris-blue: #00f2ff; --iris-orange: #ffae00; --iris-bg: #050505; }
        body, html { margin: 0; background: var(--iris-bg); font-family: 'Orbitron', sans-serif; color: white; height: 100%; overflow: hidden; }
        #map-container { height: 100vh; width: 100vw; transition: transform 0.3s linear; }
        #map { height: 100%; width: 100%; filter: brightness(0.6) saturate(1.4); }
        .ui-panel { position: absolute; z-index: 1000; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.2); }
        .next-stop-panel { top: 15px; left: 15px; right: 15px; padding: 20px; border-left: 6px solid var(--iris-blue); }
        .interval-panel { top: 130px; right: 15px; width: 100px; padding: 12px; text-align: center; }
        .footer { bottom: 25px; left: 15px; right: 15px; padding: 20px; border-bottom: 4px solid var(--iris-blue); }
        .direction-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid var(--iris-blue); filter: drop-shadow(0 0 10px var(--iris-blue)); }
    </style>
</head>
<body>
    <div class="ui-panel next-stop-panel rounded-lg">
        <div class="text-[10px] text-cyan-500 tracking-[3px] mb-1 uppercase">Prochain Arrêt</div>
        <div id="next-stop-name" class="text-2xl font-bold uppercase truncate">Localisation...</div>
        <div id="dist-stop" class="text-[10px] text-zinc-500 mt-1 italic">Distance : --- m</div>
    </div>

    <div class="ui-panel interval-panel rounded-lg flex flex-col gap-4">
        <div><div class="text-[8px] text-zinc-500 uppercase">Devant</div><div id="int-prev" class="text-sm font-bold text-green-400">-- min</div></div>
        <div class="border-t border-zinc-800 pt-2"><div class="text-[8px] text-zinc-500 uppercase">Derrière</div><div id="int-next" class="text-sm font-bold text-cyan-400">-- min</div></div>
    </div>

    <div id="map-container"><div id="map"></div></div>

    <div class="ui-panel footer rounded-xl flex justify-between items-center">
        <div><div class="text-[9px] text-zinc-500 uppercase">Statut Ligne 58</div><div id="delta-display" class="text-lg font-bold">DELTA <span class="text-green-400">+1.8m</span></div></div>
        <button id="btn-man" onclick="toggleMan()" class="bg-blue-900/20 border border-cyan-500 px-6 py-3 text-[10px] font-bold uppercase tracking-widest">🔄 Manœuvre</button>
    </div>

    <script>
        let map, marker, peer, conn, isManoeuvre = false;
        const AGENT_ID = 'BUS-58-' + Math.floor(Math.random()*900);
        const stops = [{name:"Vanves Lycée Michelet",c:[48.821,2.290]},{name:"Mairie de Vanves",c:[48.823,2.295]},{name:"Place du 18 Juin",c:[48.842,2.321]},{name:"Châtelet",c:[48.858,2.346]}];

        function init() {
            map = L.map('map', {zoomControl:false, attributionControl:false}).setView([48.838, 2.318], 17);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.marker([48.838, 2.318], {icon: L.divIcon({className:'', html:'<div class="direction-arrow"></div>', iconSize:[20,25]})}).addTo(map);
            if (navigator.geolocation) navigator.geolocation.watchPosition(update, null, {enableHighAccuracy:true});
            initPeer();
        }

        function update(pos) {
            const {latitude, longitude, heading} = pos.coords;
            if (heading !== null) document.getElementById('map-container').style.transform = `rotate(${-heading}deg)`;
            marker.setLatLng([latitude, longitude]);
            map.flyTo([latitude, longitude], isManoeuvre ? 18 : 17);
            
            let closest = stops[0], minDist = Infinity;
            stops.forEach(s => { const d = map.distance([latitude, longitude], s.c); if(d < minDist && d > 20){minDist=d; closest=s;} });
            document.getElementById('next-stop-name').innerText = closest.name;
            document.getElementById('dist-stop').innerText = `Distance : ${Math.round(minDist)} m`;

            if (conn && conn.open) conn.send({type:'position', id:AGENT_ID, lat:latitude, lon:longitude, status:isManoeuvre});
        }

        function toggleMan() { 
            isManoeuvre = !isManoeuvre; 
            document.getElementById('btn-man').classList.toggle('bg-orange-500'); 
        }

        function initPeer() {
            peer = new Peer(AGENT_ID);
            peer.on('open', () => {
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                conn.on('data', (d) => {
                    if(d.type === 'intervals'){
                        document.getElementById('int-prev').innerText = d.prev + " min";
                        document.getElementById('int-next').innerText = d.next + " min";
                    }
                });
            });
        }
        window.onload = init;
    </script>
</body>
</html>
