<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - TERMINAL CONDUCTEUR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; color: white; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .header-sae { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border-bottom: 2px solid #00f2ff; padding: 15px; }
        #sub-menu { position: fixed; bottom: 0; left: 0; right: 0; height: 65%; background: #0f172a; border-top: 4px solid #00f2ff; border-radius: 30px 30px 0 0; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 5000; padding: 25px; box-shadow: 0 -10px 50px rgba(0,0,0,0.8); }
        #sub-menu.open { transform: translateY(0); }
        .sae-btn { background: #1e293b; color: white; height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 18px; font-weight: 900; font-size: 9px; text-transform: uppercase; border: 1px solid #334155; }
        .direction-icon { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 28px solid #00f2ff; filter: drop-shadow(0 0 10px #00f2ff); }
    </style>
</head>
<body>
    <div class="header-sae flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-4">
            <div class="bg-cyan-500 text-black px-4 py-1 rounded-lg font-black orbitron text-2xl">58</div>
            <div>
                <div id="stop-name" class="text-[11px] text-cyan-400 font-bold uppercase tracking-widest italic leading-none">Localisation IRIS...</div>
                <div id="info-vacation" class="text-[9px] text-slate-500 font-mono mt-1">SVC: -- | POL: --</div>
            </div>
        </div>
        <div class="text-right">
            <div id="clock" class="text-xl font-black orbitron italic text-white">00:00:00</div>
            <div id="delay-status" class="text-sm font-bold text-green-400 uppercase tracking-tighter italic">En Ligne</div>
        </div>
    </div>

    <div id="map"></div>

    <button onclick="toggleMenu()" class="fixed bottom-10 left-8 w-20 h-20 rounded-full bg-cyan-600 z-[2000] border-4 border-white shadow-2xl font-black text-[11px] orbitron text-black active:scale-90 transition-transform">MENU</button>

    <div id="sub-menu">
        <div class="w-20 h-1.5 bg-slate-700 rounded-full mx-auto mb-10"></div>
        <div class="grid grid-cols-4 gap-4 mb-10">
            <button onclick="sendAlert('Trafic')" class="sae-btn" style="border-color:#fbbf24">🚗<span class="mt-2 text-slate-400">Trafic</span></button>
            <button onclick="sendAlert('Incident')" class="sae-btn">👥<span class="mt-2 text-slate-400">Incident</span></button>
            <button onclick="sendAlert('Déviation')" class="sae-btn">🚧<span class="mt-2 text-slate-400">Déviation</span></button>
            <button onclick="sendAlert('Relève')" class="sae-btn">👤<span class="mt-2 text-slate-400">Relève</span></button>
        </div>
        <button onclick="envoyerSOS()" class="w-full bg-red-600 py-6 rounded-2xl font-black orbitron text-2xl shadow-lg active:bg-red-700 transition-colors mb-8">🚨 SOS URGENCE</button>
        <p class="text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest" onclick="toggleMenu()">Fermer le menu</p>
    </div>

    <div id="msg-box" class="fixed inset-0 z-[9000] bg-red-800/95 backdrop-blur-2xl hidden flex flex-col items-center justify-center p-10 text-center">
        <div class="text-7xl mb-8 animate-bounce">🔄</div>
        <h2 class="orbitron text-3xl font-black mb-4 tracking-tighter text-white">RETOURNEMENT</h2>
        <p class="text-lg font-bold mb-12 text-red-200 uppercase italic">Régulation d'intervalle requise par l'IA IRIS</p>
        <button onclick="ackMsg()" class="w-full max-w-sm bg-white text-red-800 py-6 rounded-3xl font-black text-2xl shadow-2xl active:scale-95 transition-transform uppercase">Compris</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const SVC = params.get('service') || "0000";
        const POLICE = params.get('police') || "0000";
        const AGENT_ID = `BUS-58-P${POLICE}`;
        const PCC_ID = 'IRIS-PCC-58-GLOBAL';
        let map, marker, peer, conn;

        function init() {
            document.getElementById('info-vacation').innerText = `SVC: ${SVC} | POL: ${POLICE}`;
            
            // Carte Nuit Haute Visibilité (CartoDB Dark Matter)
            map = L.map('map', {zoomControl:false, attributionControl:false}).setView([48.830, 2.310], 16);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            marker = L.marker([0,0], {icon: L.divIcon({className:'', html:'<div class="direction-icon"></div>', iconSize:[24,28]})}).addTo(map);
            
            if (navigator.geolocation) navigator.geolocation.watchPosition(upGPS, null, {enableHighAccuracy:true});
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR'); }, 1000);
            initPeer();
        }

        function upGPS(pos) {
            const {latitude, longitude} = pos.coords;
            marker.setLatLng([latitude, longitude]);
            map.flyTo([latitude, longitude], 17, {animate:true, duration:1.5});
            if(conn && conn.open) conn.send({type:'position', police:POLICE, service:SVC, lat:latitude, lon:longitude});
        }

        function initPeer() {
            peer = new Peer(AGENT_ID);
            peer.on('open', () => {
                conn = peer.connect(PCC_ID);
                conn.on('data', (d) => { 
                    if(d.type === 'RETOURNEMENT') {
                        document.getElementById('msg-box').classList.remove('hidden');
                        try { new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play(); } catch(e){}
                    }
                });
            });
            peer.on('error', () => setTimeout(initPeer, 3000));
        }

        function toggleMenu() { document.getElementById('sub-menu').classList.toggle('open'); }
        function sendAlert(l) { if(conn && conn.open) { conn.send({type:'signalement', police:POLICE, label:l}); toggleMenu(); } }
        function ackMsg() { document.getElementById('msg-box').classList.add('hidden'); }
        function envoyerSOS() { if(confirm("🚨 CONFIRMER SOS ?")) conn.send({type:'SOS', police:POLICE}); }
        window.onload = init;
    </script>
</body>
</html>
