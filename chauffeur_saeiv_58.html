<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - TERMINAL CONDUCTEUR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --iris-cyan: #00f2ff; --iris-blue: #2563eb; }
        body { background: #000; font-family: 'Inter', sans-serif; color: white; height: 100vh; overflow: hidden; margin: 0; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Map Customization */
        #map { height: 100vh; width: 100vw; filter: brightness(0.4) saturate(1.2); z-index: 1; }
        
        /* UI Elements */
        .glass { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .sae-header { top: 0; left: 0; right: 0; height: 80px; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid var(--iris-cyan); }
        
        /* Menu Coulissant */
        #sub-menu { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 70%; 
            background: #0a0a0a; border-top: 4px solid var(--iris-blue); 
            border-radius: 40px 40px 0 0; transform: translateY(100%); 
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            z-index: 5000; padding: 30px; box-shadow: 0 -20px 60px rgba(0,0,0,0.9);
        }
        #sub-menu.open { transform: translateY(0); }
        
        /* Boutons Signalement */
        .grid-alerts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .btn-alert { 
            background: #1a1a1a; border: 1px solid #333; height: 90px; 
            border-radius: 20px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; transition: all 0.2s;
        }
        .btn-alert:active { transform: scale(0.95); background: var(--iris-blue); }

        /* Animation Connection Status */
        .status-pulse { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .offline { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

        /* HUD Arrow */
        .direction-arrow { 
            width: 0; height: 0; border-left: 12px solid transparent; 
            border-right: 12px solid transparent; border-bottom: 28px solid var(--iris-cyan); 
            filter: drop-shadow(0 0 8px var(--iris-cyan)); 
        }
    </style>
</head>
<body>

    <div class="sae-header glass">
        <div class="flex items-center gap-4">
            <div class="bg-white text-black px-4 py-1 rounded-lg font-black orbitron text-2xl shadow-[0_0_15px_rgba(255,255,255,0.3)]">58</div>
            <div>
                <div id="next-stop" class="text-xs text-zinc-500 uppercase font-black tracking-widest">PROCHAIN ARRÊT</div>
                <div id="stop-name" class="text-lg font-black uppercase leading-none text-white tracking-tighter">Localisation...</div>
            </div>
        </div>
        <div class="text-right">
            <div id="clock" class="text-xl font-black orbitron text-white">00:00</div>
            <div class="flex items-center justify-end">
                <span id="status-dot" class="status-pulse offline"></span>
                <span id="status-text" class="text-[8px] font-bold text-zinc-500 uppercase tracking-tighter">Connexion...</span>
            </div>
        </div>
    </div>

    <div class="fixed top-[80px] left-0 right-0 h-14 glass z-[900] flex items-center justify-between px-8 border-b border-white/5">
        <div class="flex flex-col">
            <span class="text-[8px] text-zinc-500 font-bold uppercase">Tableau de Marche</span>
            <span class="text-[10px] text-cyan-400 font-black orbitron uppercase" id="service-id">SVC: --</span>
        </div>
        <div id="delay-display" class="orbitron text-3xl font-black text-green-500">00:00</div>
    </div>

    <div id="map"></div>

    <button onclick="toggleMenu()" class="fixed bottom-10 left-1/2 -translate-x-1/2 w-24 h-24 rounded-full bg-blue-600 z-[2000] border-4 border-white shadow-[0_0_40px_rgba(37,99,235,0.6)] active:scale-90 transition-transform flex flex-col items-center justify-center">
        <span class="text-white font-black text-[12px] orbitron tracking-tighter">IRIS</span>
        <span class="text-white/70 text-[8px] font-bold uppercase">Menu</span>
    </button>

    <div id="sub-menu">
        <div class="w-16 h-1.5 bg-zinc-800 rounded-full mx-auto mb-10"></div>
        <h2 class="text-center orbitron text-zinc-500 text-[10px] tracking-[5px] mb-8 uppercase">Signalements Ligne 58</h2>
        
        <div class="grid-alerts mb-8">
            <button onclick="sendAlert('Trafic')" class="btn-alert" style="border-color: #fbbf24;">
                <span class="text-3xl">🚗</span>
                <span class="text-[10px] font-black uppercase mt-2 text-amber-400">Trafic Dense</span>
            </button>
            <button onclick="sendAlert('Incident')" class="btn-alert">
                <span class="text-3xl">👥</span>
                <span class="text-[10px] font-black uppercase mt-2">Incident</span>
            </button>
            <button onclick="sendAlert('Déviation')" class="btn-alert">
                <span class="text-3xl">🚧</span>
                <span class="text-[10px] font-black uppercase mt-2">Déviation</span>
            </button>
            <button onclick="location.reload()" class="btn-alert">
                <span class="text-3xl">🔄</span>
                <span class="text-[10px] font-black uppercase mt-2">Reset SAE</span>
            </button>
        </div>
        
        <button onclick="envoyerSOS()" class="w-full bg-red-600 py-6 rounded-2xl font-black orbitron text-xl shadow-xl active:bg-red-800 border-2 border-red-500 animate-pulse">🚨 APPEL SOS</button>
        
        <button onclick="toggleMenu()" class="w-full mt-8 text-zinc-700 font-bold uppercase text-xs tracking-widest">Retour au guidage</button>
    </div>

    <div id="msg-box" class="fixed inset-0 z-[9999] bg-black/95 backdrop-blur-2xl hidden flex flex-col items-center justify-center p-8">
        <div class="w-20 h-20 bg-cyan-500/20 rounded-full flex items-center justify-center mb-6 animate-ping">
            <span class="text-4xl">✉️</span>
        </div>
        <h3 class="text-cyan-400 orbitron text-xs tracking-[8px] mb-10 uppercase">Message Régulateur</h3>
        <div id="msg-text" class="text-3xl font-black orbitron text-center text-white mb-20 leading-tight italic uppercase tracking-tighter">---</div>
        <button onclick="ackMsg()" class="w-full max-w-sm bg-white text-black py-8 rounded-3xl font-black text-2xl orbitron shadow-2xl active:scale-95 transition-transform">LU / COMPRIS</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const SVC = params.get('service') || "TEST";
        const POLICE = params.get('police') || "0000";
        const AGENT_ID = `BUS-58-P${POLICE}`;
        const PCC_ID = 'IRIS-PCC-58-GLOBAL';

        let map, marker, peer, conn, currentDelay = 0;

        function init() {
            document.getElementById('service-id').innerText = `SVC: ${SVC} | POL: ${POLICE}`;
            
            // Map Setup
            map = L.map('map', {zoomControl:false, attributionControl:false}).setView([48.858, 2.346], 16);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            marker = L.marker([0,0], {
                icon: L.divIcon({className:'', html:'<div class="direction-arrow"></div>', iconSize:[24,28]})
            }).addTo(map);

            // Time
            setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
            }, 1000);

            // GPS
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(updateGPS, handleGPSError, {enableHighAccuracy:true});
            }

            initPeer();
        }

        function updateGPS(pos) {
            const {latitude, longitude} = pos.coords;
            const latlng = [latitude, longitude];
            
            marker.setLatLng(latlng);
            map.flyTo(latlng, 17, {animate: true, duration: 1});

            // Envoi au PCC
            if (conn && conn.open) {
                conn.send({
                    type: 'position',
                    id: AGENT_ID,
                    police: POLICE,
                    service: SVC,
                    lat: latitude,
                    lon: longitude,
                    delay: currentDelay
                });
            }
        }

        function handleGPSError(err) {
            console.warn("GPS Error: ", err.message);
        }

        // --- CONNECTION LOGIC (FROM CHAUFFEUR.HTML STRENGTHS) ---
        function initPeer() {
            peer = new Peer(AGENT_ID);

            peer.on('open', (id) => {
                console.log("Connecté au réseau sous l'ID:", id);
                connectToPCC();
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                setTimeout(initPeer, 5000); // Auto-restart Peer if crash
            });
        }

        function connectToPCC() {
            conn = peer.connect(PCC_ID);

            conn.on('open', () => {
                updateStatusUI(true);
                // First ping
                conn.send({type: 'position', id: AGENT_ID, police: POLICE, service: SVC, lat: 0, lon: 0, delay: 0});
            });

            conn.on('data', (d) => {
                if (d.type === 'message_pcc') {
                    document.getElementById('msg-text').innerText = d.texte;
                    document.getElementById('msg-box').classList.remove('hidden');
                    new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                }
            });

            conn.on('close', () => {
                updateStatusUI(false);
                setTimeout(connectToPCC, 3000); // RECONNEXION AUTO
            });
        }

        function updateStatusUI(isOnline) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            if(isOnline) {
                dot.className = "status-pulse online";
                txt.innerText = "Liaison PCC OK";
                txt.classList.replace('text-zinc-500', 'text-green-500');
            } else {
                dot.className = "status-pulse offline";
                txt.innerText = "Perte Signal...";
                txt.classList.replace('text-green-500', 'text-zinc-500');
            }
        }

        // --- UI ACTIONS ---
        function toggleMenu() { document.getElementById('sub-menu').classList.toggle('open'); }

        function sendAlert(label) {
            if (conn && conn.open) {
                conn.send({ type: 'signalement', police: POLICE, label: label });
                alert("Transmis : " + label);
                toggleMenu();
            }
        }

        function ackMsg() {
            document.getElementById('msg-box').classList.add('hidden');
            if(conn && conn.open) conn.send({type:'ack_message', police:POLICE});
        }

        function envoyerSOS() {
            if(confirm("🚨 CONFIRMER APPEL SOS ?")) {
                if(conn && conn.open) conn.send({type:'SOS', police:POLICE});
                toggleMenu();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
