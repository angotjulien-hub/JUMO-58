<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - SAEIV TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --iris-blue: #00f2ff; }
        body { background: #000; font-family: 'Inter', sans-serif; color: white; height: 100vh; overflow: hidden; margin: 0; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.4) saturate(1.2); z-index: 1; }
        .ui-panel { position: absolute; z-index: 1000; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Header SAE */
        .sae-header { top: 0; left: 0; right: 0; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: black; border-bottom: 1px solid #222; }
        
        /* Menu Coulissant */
        #sub-menu { position: fixed; bottom: 0; left: 0; right: 0; height: 70%; background: #111; border-top: 4px solid #2563eb; border-radius: 30px 30px 0 0; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1); z-index: 3000; padding: 20px; box-shadow: 0 -20px 50px rgba(0,0,0,0.8); }
        #sub-menu.open { transform: translateY(0); }
        
        .sae-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .sae-btn { background: #e2e8f0; color: #000; height: 85px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; font-weight: 900; font-size: 8px; text-transform: uppercase; }
        
        /* Chrono TM Bar */
        #chrono-bar { top: 70px; left: 0; right: 0; height: 50px; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 3px solid #333; }
        .direction-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid var(--iris-blue); filter: drop-shadow(0 0 5px var(--iris-blue)); }
    </style>
</head>
<body>

    <div class="sae-header ui-panel border-none">
        <div class="flex items-center gap-3">
            <div class="bg-green-600 px-3 py-1 rounded font-black orbitron text-white text-lg">58</div>
            <div>
                <div id="next-stop-name" class="font-black text-lg uppercase leading-none tracking-tighter text-white">RECHERCHE GPS...</div>
                <div id="info-vacation" class="text-[9px] text-cyan-400 orbitron mt-1 uppercase">SVC: -- | POL: --</div>
            </div>
        </div>
        <div class="text-right">
            <div id="dist-stop" class="text-[10px] text-zinc-500 orbitron">--- M</div>
            <div id="clock" class="text-sm font-bold orbitron text-white">00:00</div>
        </div>
    </div>

    <div id="chrono-bar" class="ui-panel">
        <div class="flex flex-col">
            <span class="text-[8px] text-zinc-500 uppercase font-black">Tableau de Marche</span>
            <span id="tm-label" class="text-[10px] font-bold uppercase tracking-widest text-zinc-300">Synchronisation...</span>
        </div>
        <div id="delay-value" class="orbitron text-2xl font-bold">00:00</div>
    </div>

    <div id="map"></div>

    <button onclick="toggleMenu()" class="ui-panel bottom-10 left-6 w-20 h-20 rounded-full flex items-center justify-center bg-blue-700 border-4 border-white shadow-2xl active:scale-90 transition-transform">
        <span class="font-black text-[12px] text-white orbitron">MENU</span>
    </button>

    <div id="sub-menu">
        <div class="w-16 h-2 bg-zinc-800 rounded-full mx-auto mb-8"></div>
        <div class="sae-grid mb-8">
            <button onclick="sendAlert('Service')" class="sae-btn"><span>🗼</span><label class="mt-1">Service</label></button>
            <button onclick="sendAlert('Trafic')" class="sae-btn" style="background:#fbbf24"><span>🚗</span><label class="mt-1">Trafic</label></button>
            <button onclick="sendAlert('Incident')" class="sae-btn"><span>👥</span><label class="mt-1">Incident</label></button>
            <button onclick="sendAlert('Déviation')" class="sae-btn"><span>🚧</span><label class="mt-1">Déviation</label></button>
            <button onclick="sendAlert('Sonore')" class="sae-btn"><span>📢</span><label class="mt-1">Sonore</label></button>
            <button onclick="sendAlert('Relève')" class="sae-btn"><span>👥</span><label class="mt-1">Relève</label></button>
            <button onclick="sendAlert('Prise Svc')" class="sae-btn"><span>👤
