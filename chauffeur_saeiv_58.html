<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - TERMINAL SAEIV v2.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --iris-blue: #00f2ff; --iris-orange: #ffae00; --iris-bg: #050505; --sae-blue: #4a90e2; }
        body, html { margin: 0; background: var(--iris-bg); font-family: 'Inter', sans-serif; color: white; height: 100%; overflow: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        #map-container { height: 100vh; width: 100vw; transition: transform 0.3s linear; }
        #map { height: 100%; width: 100%; filter: brightness(0.6) saturate(1.4); }
        .ui-panel { position: absolute; z-index: 1000; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.2); }
        
        /* Menu SAE Style */
        #sub-menu { bottom: 0; left: 0; right: 0; height: 85%; z-index: 2000; padding: 20px; border-radius: 20px 20px 0 0; background: #1a1a1a; border-top: 3px solid var(--sae-blue); }
        .sae-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 2px; background: #333; border: 2px solid #333; }
        .sae-btn { background: #f0f0f0; color: #333; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100px; }
        .sae-btn img, .sae-btn span.icon { font-size: 24px; margin-bottom: 5px; color: var(--sae-blue); }
        .sae-btn label { font-size: 10px; font-weight: bold; line-height: 1.1; cursor: pointer; }
        
        .footer-sae { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #000; }
        .f-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; background: #2c5282; color: white; }

        .direction-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid var(--iris-blue); filter: drop-shadow(0 0 10px var(--iris-blue)); }
    </style>
</head>
<body>

    <div class="ui-panel top-0 left-0 right-0 p-4 border-none bg-black/80 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-green-600 px-2 py-1 rounded font-bold text-xs orbitron">58</div>
            <div id="next-stop-name" class="font-bold text-lg uppercase tracking-tight">Chargement...</div>
        </div>
        <div class="text-right">
            <div id="dist-stop" class="text-[10px] text-zinc-400">--- m</div>
            <div class="text-xs font-bold orbitron">15:45</div>
        </div>
    </div>

    <div class="ui-panel top-24 right-4 w-20 p-2 rounded-lg flex flex-col gap-2 text-center orbitron">
        <div class="text-[8px] text-zinc-500">PREC</div>
        <div id="int-prev" class="text-green-400 font-bold text-sm">--</div>
        <div class="border-t border-zinc-800 my-1"></div>
        <div class="text-[8px] text-zinc-500">SUIV</div>
        <div id="int-next" class="text-cyan-400 font-bold text-sm">--</div>
    </div>

    <div id="map-container"><div id="map"></div></div>

    <button onclick="toggleMenu()" class="ui-panel bottom-24 left-6 w-14 h-14 rounded-full flex items-center justify-center border-2 border-white bg-blue-600 shadow-xl">
        <span class="text-white font-bold">MENU</span>
    </button>

    <div id="sub-menu" class="transition-transform duration-500 translate-y-full">
        <div class="flex justify-between items-center mb-4 px-2">
            <span class="text-xs font-bold text-zinc-400 orbitron">MENU SAE - IRIS v2.7</span>
            <button onclick="toggleMenu()" class="bg-red-600 px-4 py-1 rounded text-xs font-bold">FERMER</button>
        </div>

        <div class="sae-grid">
            <div class="sae-btn" onclick="actionSAE('Service')"><span class="icon">🗼</span><label>Service</label></div>
            <div class="sae-btn" onclick="actionSAE('Alarmes')"><span class="icon text-red-600">⚠️</span><label>Liste des alarmes</label></div>
            <div class="sae-btn" onclick="actionSAE('Signalement')"><span class="icon">📝</span><label>Signalement</label></div>
            <div class="sae-btn" onclick="actionSAE('Messagerie')"><span class="icon">✉️</span><label>Messagerie</label></div>
            
            <div class="sae-btn" onclick="actionSAE('Diffusion')"><span class="icon">📢</span><label>Diffusion sonore pré-enregistrée</label></div>
            <div class="sae-btn" onclick="actionSAE('Relève')"><span class="icon">👥</span><label>Relève</label></div>
            <div class="sae-btn" onclick="actionSAE('Prise Service')"><span class="icon text-green-600">👤</span><label>Prise de service complète</label></div>
            <div class="sae-btn" onclick="actionSAE('Test')"><span class="icon">🚌</span><label>Test d'exploitation</label></div>
        </div>

        <div class="footer-sae mt-4 rounded-lg overflow-hidden">
            <div class="f-btn bg-zinc-800" onclick="envoyerSOS()">📞 APPEL SUP</div>
            <div class="f-btn bg-blue-700">🚹</div>
            <div class="f-btn bg-blue-800">T+</div>
            <div class="f-btn bg-blue-900">📟</div>
            <div class="f-btn bg-zinc-800">📞 APPEL REG</div>
        </div>
    </div>

    <script>
        let map, marker, peer, conn, isManoeuvre = false;
        const AGENT_ID = 'BUS-58-NAV';
        const stops = [{name:"Vanves Michelet",c:[48.821,2.290]},{name:"Mairie de Vanves",c:[48.823,2.295]},{name:"Alésia",c:[48.828,2.327]},{name:"Châtelet",c:[48.858,2.346]}];

        function init() {
            map = L.map('map', {zoomControl:false, attributionControl:false}).setView([48.828, 2.327], 17);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.marker([48.828, 2.327], {icon: L.divIcon({className:'', html:'<div class="direction-arrow"></div>', iconSize:[20,25]})}).addTo(map);
            if (navigator.geolocation) navigator.geolocation.watchPosition(updateGPS, null, {enableHighAccuracy:true});
            initPeer();
        }

        function toggleMenu() { document.getElementById('sub-menu').classList.toggle('translate-y-full'); }
        
        function actionSAE(type) { alert("Accès " + type); toggleMenu(); }

        function updateGPS(pos) {
            const {latitude, longitude, heading} = pos.coords;
            if (heading !== null) document.getElementById('map-container').style.transform = `rotate(${-heading}deg)`;
            marker.setLatLng([latitude, longitude]);
            map.flyTo([latitude, longitude], 17);
            
            let closest = stops[0], minDist = Infinity;
            stops.forEach(s => { const d = map.distance([latitude, longitude], s.c); if(d < minDist && d > 10){minDist=d; closest=s;} });
            document.getElementById('next-stop-name').innerText = closest.name;
            document.getElementById('dist-stop').innerText = Math.round(minDist) + " m";

            if (conn && conn.open) conn.send({type:'position', id:AGENT_ID, lat:latitude, lon:longitude, status:isManoeuvre});
        }

        function envoyerSOS() {
            if (confirm("🚨 APPEL SUP : CONFIRMER URGENCE ?")) {
                if (conn && conn.open) conn.send({type: 'SOS', id: AGENT_ID});
                toggleMenu();
            }
        }

        function initPeer() {
            peer = new Peer(AGENT_ID);
            peer.on('open', () => {
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                conn.on('data', (d) => {
                    if(d.type === 'intervals'){
                        document.getElementById('int-prev').innerText = d.prev + "'";
                        document.getElementById('int-next').innerText = d.next + "'";
                    }
                });
            });
        }
        window.onload = init;
    </script>
</body>
</html>
