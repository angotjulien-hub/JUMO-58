<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - TERMINAL SAEIV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --iris-blue: #00f2ff; --iris-orange: #ffae00; --iris-bg: #050505; }
        body, html { margin: 0; padding: 0; background: var(--iris-bg); font-family: 'Orbitron', sans-serif; color: white; height: 100%; overflow: hidden; }
        #map-container { height: 100vh; width: 100vw; transition: transform 0.3s linear; z-index: 1; }
        #map { height: 100%; width: 100%; filter: brightness(0.6) saturate(1.4); }
        
        .ui-panel { position: absolute; z-index: 1000; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.2); }
        
        /* SAEIV Next Stop */
        .next-stop-panel { top: 15px; left: 15px; right: 15px; padding: 20px; border-left: 6px solid var(--iris-blue); }
        
        /* Radar Intervalles (Point fort) */
        .interval-panel { top: 120px; right: 15px; width: 100px; padding: 10px; text-align: center; }
        
        .footer { bottom: 25px; left: 15px; right: 15px; padding: 20px; border-bottom: 4px solid var(--iris-blue); }
        .btn-manoeuvre { background: rgba(0, 242, 255, 0.1); border: 1px solid var(--iris-blue); color: var(--iris-blue); padding: 12px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .btn-manoeuvre.active { background: var(--iris-orange); border-color: white; color: black; box-shadow: 0 0 25px var(--iris-orange); }
        
        .direction-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid var(--iris-blue); filter: drop-shadow(0 0 10px var(--iris-blue)); }
    </style>
</head>
<body>

    <div class="ui-panel next-stop-panel rounded-lg shadow-2xl">
        <div class="text-[10px] text-cyan-500 tracking-[3px] mb-1">PROCHAIN ARRÊT</div>
        <div id="next-stop-name" class="text-2xl font-bold uppercase truncate text-white">CHARGEMENT...</div>
        <div class="flex justify-between mt-2 items-center">
            <div id="dist-stop" class="text-[10px] text-zinc-400 italic">Distance : --- m</div>
            <div class="text-[10px] bg-blue-900/50 px-2 py-1 rounded">LIGNE 58</div>
        </div>
    </div>

    <div class="ui-panel interval-panel rounded-lg flex flex-col gap-3">
        <div class="border-b border-zinc-800 pb-1">
            <div class="text-[8px] text-zinc-500 uppercase">Précédent</div>
            <div id="int-prev" class="text-sm font-bold text-green-400">-- min</div>
        </div>
        <div>
            <div class="text-[8px] text-zinc-500 uppercase">Suivant</div>
            <div id="int-next" class="text-sm font-bold text-cyan-400">-- min</div>
        </div>
    </div>

    <div id="map-container"><div id="map"></div></div>

    <div class="ui-panel footer rounded-xl flex flex-col gap-4 shadow-2xl">
        <div class="flex justify-between items-center">
            <div class="w-1/2">
                <div class="text-[9px] text-zinc-500 uppercase tracking-widest">Temps de Trajet</div>
                <div id="delta-display" class="text-lg font-bold">DELTA <span class="text-green-400">+1.8 min</span></div>
            </div>
            <button id="btn-manoeuvre" class="btn-manoeuvre w-1/2 rounded" onclick="toggleManoeuvre()">🔄 Début Manœuvre</button>
        </div>
        <div class="w-full bg-zinc-900 h-1 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-cyan-500 h-full w-0 transition-all duration-1000"></div>
        </div>
    </div>

    <script>
        let map, marker, peer, conn, isManoeuvre = false;
        const AGENT_ID = 'BUS-58-75014';
        
        // Liste des arrêts pour le SAEIV (basée sur tes photos)
        const arrets58 = [
            { name: "Vanves Lycée Michelet", coords: [48.8212, 2.2901] },
            { name: "Av Victor Hugo", coords: [48.8235, 2.2950] },
            { name: "Carrefour Albert Legris", coords: [48.8258, 2.2990] },
            { name: "Rue Jean Jaurès", coords: [48.8280, 2.3020] },
            { name: "Place du 18 Juin 1940", coords: [48.8421, 2.3219] },
            { name: "Châtelet", coords: [48.8582, 2.3465] }
        ];

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.840, 2.318], 17);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.marker([48.840, 2.318], { icon: L.divIcon({ className: '', html: `<div class="direction-arrow"></div>`, iconSize: [20, 25] }) }).addTo(map);
            
            if (navigator.geolocation) navigator.geolocation.watchPosition(handleGPS, null, { enableHighAccuracy: true });
            initPeer();
        }

        function handleGPS(pos) {
            const { latitude, longitude, heading } = pos.coords;
            const latlng = [latitude, longitude];

            // Rotation et Suivi
            if (heading !== null) document.getElementById('map-container').style.transform = `rotate(${-heading}deg)`;
            marker.setLatLng(latlng);
            map.flyTo(latlng, isManoeuvre ? 18 : 17, { animate: true, duration: 1.5 });

            // Mise à jour SAEIV (Prochain arrêt)
            updateSAEIV(latlng);

            // Transmission
            if (conn && conn.open) {
                conn.send({ type: 'position', id: AGENT_ID, lat: latitude, lon: longitude, heading: heading, status: isManoeuvre });
            }
        }

        function updateSAEIV(currentPos) {
            let closest = null;
            let minDist = Infinity;

            arrets58.forEach(stop => {
                const d = map.distance(currentPos, stop.coords);
                // On cherche l'arrêt le plus proche devant nous (simplifié ici)
                if (d < minDist && d > 30) { minDist = d; closest = stop; }
            });

            if (closest) {
                document.getElementById('next-stop-name').innerText = closest.name;
                document.getElementById('dist-stop').innerText = `Distance : ${Math.round(minDist)} m`;
            }
        }

        function toggleManoeuvre() {
            isManoeuvre = !isManoeuvre;
            const btn = document.getElementById('btn-manoeuvre');
            btn.innerText = isManoeuvre ? "🏁 FIN MANŒUVRE" : "🔄 DÉBUT MANŒUVRE";
            btn.classList.toggle('active');
            document.getElementById('progress-bar').style.width = isManoeuvre ? "100%" : "0%";
        }

        // Réception des intervalles depuis le PCC
        function initPeer() {
            peer = new Peer(AGENT_ID);
            peer.on('open', () => {
                conn = peer.connect('IRIS-PCC-58-GLOBAL');
                conn.on('data', (data) => {
                    if(data.type === 'intervals') {
                        document.getElementById('int-prev').innerText = data.prev + " min";
                        document.getElementById('int-next').innerText = data.next + " min";
                    }
                });
            });
        }

        window.onload = initMap;
    </script>
</body>
</html>
