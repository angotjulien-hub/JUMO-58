<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - HUB CENTRAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); }
        .orbitron { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="text-white flex items-center justify-center h-screen overflow-hidden">
    
    <div class="p-8 bg-zinc-900/50 backdrop-blur-xl border border-white/10 rounded-[40px] shadow-2xl w-[400px] text-center">
        <div class="mb-10">
            <h1 class="text-5xl font-black orbitron tracking-widest text-cyan-400 drop-shadow-[0_0_15px_rgba(34,211,238,0.5)]">IRIS 58</h1>
            <p class="text-[9px] text-zinc-500 uppercase font-black mt-2 tracking-[0.3em]">Système de Régulation IA & SAEIV</p>
        </div>

        <div class="space-y-6">
            <div class="bg-black/40 p-5 rounded-3xl border border-zinc-800 space-y-4">
                <span class="text-[10px] text-cyan-500 font-black uppercase tracking-widest">Espace Conducteur</span>
                
                <input type="number" id="mat" placeholder="MATRICULE (ex: 123456)" 
                    class="w-full p-4 bg-zinc-900 border border-zinc-700 rounded-2xl text-white text-center font-bold outline-none focus:border-cyan-500 transition-all">
                
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="svc" placeholder="SERVICE" 
                        class="w-full p-4 bg-zinc-900 border border-zinc-700 rounded-2xl text-white text-center font-bold outline-none focus:border-cyan-500 transition-all text-sm">
                    <input type="number" id="pol" placeholder="POLICE" 
                        class="w-full p-4 bg-zinc-900 border border-zinc-700 rounded-2xl text-white text-center font-bold outline-none focus:border-cyan-500 transition-all text-sm">
                </div>

                <button onclick="goChauffeur()" 
                    class="w-full py-5 bg-cyan-500 text-black font-black orbitron rounded-2xl hover:scale-[1.02] active:scale-95 transition-all shadow-lg shadow-cyan-500/20">
                    DÉMARRER VACATION
                </button>
            </div>

            <div class="flex items-center gap-4 text-zinc-700">
                <div class="h-[1px] bg-zinc-800 flex-1"></div>
                <span class="text-[8px] font-bold uppercase">OU</span>
                <div class="h-[1px] bg-zinc-800 flex-1"></div>
            </div>

            <button onclick="goPCC()" 
                class="w-full py-4 bg-transparent border border-zinc-700 text-zinc-400 hover:text-white hover:border-white font-bold text-xs uppercase tracking-widest rounded-2xl transition-all active:scale-95">
                Accès Régulation (PCC)
            </button>
        </div>
    </div>

    <script>
        function goChauffeur() {
            const m = document.getElementById('mat').value;
            const s = document.getElementById('svc').value;
            const p = document.getElementById('pol').value;
            
            if(!m || !s || !p) {
                alert("⚠️ Informations incomplètes pour la vacation.");
                return;
            }
            
            // On ajoute le matricule dans l'URL pour qu'il soit récupéré par chauffeur_saeiv_58.html
            window.location.href = `chauffeur_saeiv_58.html?service=${s}&police=${p}&matricule=${m}`;
        }

        function goPCC() {
            window.location.href = `pcc_controle.html`;
        }
    </script>
</body>
</html>
