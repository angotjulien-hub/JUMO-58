<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center h-screen">
    <div class="p-10 bg-zinc-900 border border-zinc-800 rounded-[40px] shadow-2xl w-96">
        <h1 class="text-3xl font-black orbitron text-center mb-10 tracking-widest text-cyan-400">IRIS 58</h1>
        <div class="space-y-6">
            <div>
                <label class="text-[10px] uppercase font-bold text-zinc-500 ml-2">Numéro de Service</label>
                <input type="number" id="svc" placeholder="05801" class="w-full p-4 bg-black border border-zinc-700 rounded-2xl text-white outline-none focus:border-cyan-500 transition-all">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-zinc-500 ml-2">Numéro de Police</label>
                <input type="number" id="pol" placeholder="8520" class="w-full p-4 bg-black border border-zinc-700 rounded-2xl text-white outline-none focus:border-cyan-500 transition-all">
            </div>
            <button onclick="go()" class="w-full py-5 bg-cyan-500 text-black font-black orbitron rounded-2xl hover:bg-white transition-all shadow-lg shadow-cyan-500/20">LANCER SAEIV</button>
        </div>
    </div>
    <script>
        function go() {
            const s = document.getElementById('svc').value;
            const p = document.getElementById('pol').value;
            if(!s || !p) return alert("Saisie incomplète");
            window.location.href = `chauffeur_saeiv_58.html?service=${s}&police=${p}`;
        }
    </script>
</body>
</html>
