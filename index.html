<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JUMO PERF - LIGNE 58 APEX V3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --jumo-cyan: #00f2ff; --jumo-alert: #ff004c; --jumo-bg: #05070a; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--jumo-bg); color: #e2e8f0; margin: 0; overflow: hidden; }
        #map { height: 100vh; width: 100vw; filter: grayscale(0.6) brightness(0.6) contrast(1.2) sepia(0.2) hue-rotate(160deg); }

        .jumo-panel {
            background: rgba(10, 15, 25, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* Marqueur avec transition fluide */
        .leaflet-marker-icon { transition: all 3s linear; }

        .bus-marker {
            background: #000; border: 2px solid var(--jumo-cyan); color: var(--jumo-cyan);
            padding: 4px 12px; font-weight: 800; font-size: 11px; 
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0% 100%);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); text-align: center; white-space: nowrap;
        }

        .alert-active {
            border-color: var(--jumo-alert) !important;
            color: white !important;
            background: var(--jumo-alert) !important;
            box-shadow: 0 0 25px var(--jumo-alert);
            animation: master-blink 0.5s infinite alternate ease-in-out;
        }

        @keyframes master-blink { from { opacity: 1; transform: scale(1); } to { opacity: 0.7; transform: scale(1.15); } }
        .stat-pill { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Custom Scrollbar */
        #telemetry-list::-webkit-scrollbar { width: 4px; }
        #telemetry-list::-webkit-scrollbar-thumb { background: var(--jumo-cyan); opacity: 0.3; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="fixed top-6 left-6 z-[1000] w-80 pointer-events-none">
        <div class="jumo-panel p-6 border-l-4 border-[#00f2ff] pointer-events-auto rounded-r-lg">
            <div class="flex items-center justify-between mb-2">
                <h1 class="text-2xl font-[Orbitron] font-black italic tracking-tighter text-[#00f2ff]">JUMO PERF</h1>
                <span class="text-[8px] bg-white/10 px-2 py-1 rounded font-bold">V3.1_STABLE</span>
            </div>
            <p class="text-[9px] text-slate-500 uppercase tracking-[0.4em] mb-4 font-bold">Ligne 58 • Régulation Temps Réel</p>
            <div class="grid grid-cols-2 gap-2">
                <div class="stat-pill p-3 rounded">
                    <p class="text-[7px] text-slate-500 uppercase mb-1">Flux Latency</p>
                    <p id="net-latency" class="text-sm font-bold text-white font-mono">-- MS</p>
                </div>
                <div class="stat-pill p-3 rounded">
                    <p class="text-[7px] text-slate-500 uppercase mb-1">Status GPS</p>
                    <p class="text-sm font-bold text-green-400">ACTIVE</p>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 left-6 z-[1000] w-80 pointer-events-none">
        <div class="jumo-panel p-6 pointer-events-auto rounded-lg">
            <h3 class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-4 border-b border-white/5 pb-2">Indicateurs Contractuels</h3>
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between text-[10px] mb-2 uppercase font-bold">
                        <span>Offre Réalisée</span>
                        <span id="prod-text" class="text-[#00f2ff]">0%</span>
                    </div>
                    <div class="w-full bg-white/5 h-1 rounded-full overflow-hidden">
                        <div id="prod-bar" class="bg-[#00f2ff] h-full transition-all duration-1000 shadow-[0_0_10px_#00f2ff]" style="width: 0%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-[10px] mb-2 uppercase font-bold">
                        <span>Ponctualité</span>
                        <span id="ponct-text" class="text-green-400">0%</span>
                    </div>
                    <div class="w-full bg-white/5 h-1 rounded-full overflow-hidden">
                        <div id="ponct-bar" class="bg-green-500 h-full transition-all duration-1000" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed top-6 right-6 z-[1000] w-96 jumo-panel flex flex-col max-h-[92vh] pointer-events-auto rounded-lg overflow-hidden border-r-4 border-white/5">
        <div class="p-5 border-b border-white/10 flex justify-between items-center bg-white/5">
            <h2 class="text-xs font-[Orbitron] font-bold tracking-widest text-white uppercase">Unités en Service</h2>
            <span id="unit-count" class="text-[10px] font-black bg-[#00f2ff] text-black px-3 py-1 rounded-sm">0 UNIT</span>
        </div>

        <div id="telemetry-list" class="flex-1 overflow-y-auto p-4 space-y-2">
            </div>

        <div class="p-6 bg-black/60 border-t border-white/10">
            <h3 class="text-[9px] font-black text-[#00f2ff] uppercase mb-4 tracking-widest italic">// Liaison de Commande</h3>
            <div class="space-y-3">
                <select id="msg-target" class="w-full bg-slate-900 border border-white/10 rounded-sm p-3 text-[10px] text-white outline-none focus:border-[#00f2ff] appearance-none">
                    <option value="ALL">DIFFUSION GÉNÉRALE (ALL)</option>
                    <optgroup label="UNITÉS SPÉCIFIQUES" id="target-list"></optgroup>
                </select>

                <input type="text" id="msg-input" placeholder="ORDRE DE MISSION..." class="w-full bg-white/5 border-b border-white/20 p-3 text-xs text-white outline-none focus:border-[#00f2ff] uppercase font-bold placeholder:text-slate-600">

                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="fastCmd('TR')" class="bg-white/5 border border-white/10 text-amber-500 text-[9px] font-black py-3 hover:bg-amber-600 hover:text-white transition-all">RÉGUL. (TR)</button>
                    <button onclick="fastCmd('DEP')" class="bg-white/5 border border-white/10 text-cyan-400 text-[9px] font-black py-3 hover:bg-cyan-600 hover:text-white transition-all">DÉPART IMMÉD.</button>
                </div>
                <button onclick="transmit()" class="w-full bg-[#00f2ff] text-black text-[10px] font-black py-4 hover:bg-white transition-all uppercase tracking-widest mt-2">Transmettre l'ordre</button>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://angot.pythonanywhere.com";
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.8400, 2.3250], 14);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        const pathA = [[48.827584,2.305412],[48.825589,2.301909],[48.823501,2.288277],[48.825031,2.291878],[48.823801,2.297645],[48.825194,2.301046],[48.824968,2.304202],[48.827332,2.305058],[48.826447,2.310447],[48.8263,2.313094],[48.827878,2.315378],[48.830723,2.319505],[48.832371,2.32058],[48.833978,2.321797],[48.836477,2.32272],[48.838083,2.322873],[48.840945,2.321701],[48.842874,2.323921],[48.842263,2.32865],[48.844761,2.328975],[48.846788,2.328543],[48.847022,2.330718],[48.848763,2.333345],[48.849223,2.33698],[48.849633,2.339064],[48.851626,2.338738],[48.854053,2.338817],[48.855886,2.340346],[48.858221,2.343151],[48.856914,2.347984],[48.857723,2.348081]];
        L.polyline(pathA, {color: '#00f2ff', weight: 3, opacity: 0.4, dashArray: '10, 10'}).addTo(map);

        let markers = {};

        async function runJumoPerf() {
            const t0 = Date.now();
            try {
                const res = await fetch(`${SERVER_URL}/get_buses`);
                const busesObj = await res.json();
                const busArray = Object.values(busesObj);

                document.getElementById('net-latency').innerText = (Date.now() - t0) + " MS";
                document.getElementById('unit-count').innerText = `${busArray.length} UNITS`;

                // Calcul des couplages et enrichissement des données
                let alerts = 0;
                const enrichedBuses = busArray.map((bus, i) => {
                    const lat = parseFloat(bus.lat);
                    const lon = parseFloat(bus.lon);
                    let isCoupled = false;

                    busArray.forEach((b2, j) => {
                        if (i !== j) {
                            const dist = map.distance([lat, lon], [parseFloat(b2.lat), parseFloat(b2.lon)]);
                            if (dist < 300) { isCoupled = true; alerts++; }
                        }
                    });
                    return { ...bus, isCoupled, lat, lon };
                });

                // Tri : Les bus couplés en premier pour la liste
                enrichedBuses.sort((a, b) => b.isCoupled - a.isCoupled);

                const list = document.getElementById('telemetry-list');
                const targetSelect = document.getElementById('target-list');
                
                let listHtml = ""; 
                let selectHtml = "";

                enrichedBuses.forEach(bus => {
                    const pol = bus.pol || "N/A";

                    // 1. Update Map Markers
                    if (!markers[pol]) {
                        markers[pol] = L.marker([bus.lat, bus.lon], {
                            icon: L.divIcon({
                                className:'custom-icon', 
                                html:`<div class="bus-marker" id="m-${pol}">${pol}</div>`,
                                iconSize: [40, 20]
                            })
                        }).addTo(map);
                    } else {
                        markers[pol].setLatLng([bus.lat, bus.lon]);
                    }

                    // Toggle alerte visuelle sur la carte
                    const markerDom = document.getElementById(`m-${pol}`);
                    if(markerDom) {
                        bus.isCoupled ? markerDom.classList.add('alert-active') : markerDom.classList.remove('alert-active');
                    }

                    // 2. Build Telemetry List
                    listHtml += `
                        <div class="p-4 rounded border transition-all ${bus.isCoupled ? 'bg-red-500/10 border-red-500/50' : 'bg-white/5 border-white/5'}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-[10px] font-black ${bus.isCoupled ? 'text-red-500' : 'text-[#00f2ff]'}">UNITÉ_P${pol}</p>
                                    <p class="text-[9px] font-bold text-white mt-1">${bus.speed || 0} KM/H</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[7px] text-slate-500 uppercase tracking-tighter">${bus.status || 'EN LIGNE'}</p>
                                    <span class="text-[8px] font-black ${bus.isCoupled ? 'text-red-500' : 'text-green-500'}">
                                        ${bus.isCoupled ? '!! COUPLAGE !!' : 'STABLE'}
                                    </span>
                                </div>
                            </div>
                        </div>`;
                    
                    selectHtml += `<option value="${pol}">UNITÉ P${pol}</option>`;
                });

                list.innerHTML = listHtml;
                targetSelect.innerHTML = selectHtml;

                // 3. Update KPIs
                const prod = Math.min(100, (busArray.length / 8) * 100); // Seuil à 8 bus
                document.getElementById('prod-text').innerText = Math.round(prod) + "%";
                document.getElementById('prod-bar').style.width = prod + "%";

                const ponct = Math.max(0, 100 - (alerts * 10));
                document.getElementById('ponct-text').innerText = ponct + "%";
                document.getElementById('ponct-bar').style.width = ponct + "%";

            } catch (e) { 
                console.error("Échec synchronisation flux");
            }
        }

        // Fonctions de commande
        function fastCmd(type) {
            const target = document.getElementById('msg-target').value;
            const msg = type === 'TR' ? "REGULATION : MARQUER L'ARRET (TR)" : "DEPART IMMEDIAT";
            execute(target, msg);
        }

        function transmit() {
            const target = document.getElementById('msg-target').value;
            const msg = document.getElementById('msg-input').value;
            if(msg) execute(target, msg.toUpperCase());
        }

        async function execute(target, msg) {
            try {
                const response = await fetch(`${SERVER_URL}/send_order`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ instruction: msg, pol: target })
                });
                if(response.ok) {
                    // Feedback visuel au lieu d'une alert bloquante
                    console.log(`ORDRE ENVOYÉ À ${target}`);
                    document.getElementById('msg-input').value = "";
                }
            } catch (e) { console.error("ERREUR TRANSMISSION"); }
        }

        setInterval(runJumoPerf, 3000);
        runJumoPerf();
    </script>
</body>
</html>
