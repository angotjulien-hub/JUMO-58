<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRIS 58 - NEXUS HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; overflow: hidden; }
        .bg-glow { position: absolute; width: 150%; height: 150%; background: radial-gradient(circle at center, #083344 0%, #020617 70%); top: -25%; left: -25%; z-index: -1; animation: pulse-bg 10s infinite alternate; }
        @keyframes pulse-bg { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 0.8; } }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-primary { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); transition: all 0.3s ease; }
    </style>
</head>
<body class="text-white flex items-center justify-center h-screen">
    <div class="bg-glow"></div>
    <div class="glass-panel p-10 rounded-[50px] w-full max-w-[440px] m-4 text-center">
        <header class="mb-10">
            <h1 class="text-6xl font-black orbitron tracking-tighter">IRIS 58</h1>
            <p class="text-slate-400 text-sm mt-2 uppercase tracking-widest">Nexus Cloud Access</p>
        </header>
        <div class="space-y-4 text-left">
            <input type="text" id="username" class="w-full bg-slate-900/50 border border-white/5 rounded-2xl px-6 py-4" placeholder="Identifiant Agent">
            <input type="password" id="password" class="w-full bg-slate-900/50 border border-white/5 rounded-2xl px-6 py-4" placeholder="Clé d'accès">
            <button onclick="handleLogin()" class="btn-primary w-full py-5 rounded-2xl font-bold orbitron uppercase tracking-widest mt-4">Initialiser Connexion</button>
        </div>
        <div id="status" class="mt-6 text-xs orbitron text-cyan-500/50">Système prêt</div>
    </div>

    <script>
        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const status = document.getElementById('status');
            
            try {
                const response = await fetch('https://angot.pythonanywhere.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                if (response.ok) {
                    window.location.href = 'pcc_controle.html';
                } else {
                    status.innerText = "Accès Refusé";
                }
            } catch (e) { status.innerText = "Serveur Hors-Ligne"; }
        }
    </script>
</body>
</html>
