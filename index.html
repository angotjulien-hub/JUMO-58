<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS 58 - Hub d'Identification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; font-family: 'Orbitron', sans-serif; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #111; border: 1px solid #333; transition: all 0.3s; }
        .card:hover { border-color: #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        input { background: #000; border: 1px solid #333; color: #00f2ff; padding: 10px; text-align: center; font-size: 14px; width: 100%; border-radius: 4px; }
        input:focus { outline: none; border-color: #00f2ff; }
        label { font-size: 9px; color: #666; text-transform: uppercase; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>
    <div class="max-w-4xl w-full px-6">
        <header class="text-center mb-12">
            <h1 class="text-3xl font-bold tracking-[8px] mb-2">IRIS <span class="text-cyan-400">58</span></h1>
            <p class="text-[9px] text-zinc-500 uppercase tracking-[3px]">Authentification Système</p>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="card p-8 rounded-xl">
                <div class="text-3xl mb-4 text-center">🚌</div>
                <h2 class="text-sm font-bold mb-6 text-center uppercase tracking-widest">Conducteur</h2>
                <div class="space-y-4 mb-6">
                    <div><label>Numéro de Service</label><input type="number" id="service_num" placeholder="Ex: 05801"></div>
                    <div><label>Numéro de Police (Voiture)</label><input type="number" id="police_num" placeholder="Ex: 8500"></div>
                </div>
                <button onclick="connexionChauffeur()" class="w-full bg-cyan-900/30 border border-cyan-500 py-3 text-[10px] font-bold uppercase hover:bg-cyan-500 hover:text-black transition-all">Ouvrir la vacation</button>
            </div>

            <div class="card p-8 rounded-xl">
                <div class="text-3xl mb-4 text-center">🖥️</div>
                <h2 class="text-sm font-bold mb-6 text-center uppercase tracking-widest">Régulation</h2>
                <div class="space-y-4 mb-6">
                    <div><label>Matricule Agent</label><input type="password" id="agent_id" placeholder="******"></div>
                </div>
                <button onclick="connexionPCC()" class="w-full bg-zinc-800 border border-zinc-600 py-3 text-[10px] font-bold uppercase hover:bg-white hover:text-black transition-all">Accès Poste Central</button>
            </div>
        </div>
    </div>

    <script>
        function connexionChauffeur() {
            const s = document.getElementById('service_num').value;
            const p = document.getElementById('police_num').value;
            if(!s || !p) return alert("Saisie incomplète");
            window.location.href = `chauffeur_saeiv_58.html?service=${s}&police=${p}`;
        }
        function connexionPCC() {
            const m = document.getElementById('agent_id').value;
            if(!m) return alert("Matricule requis");
            window.location.href = `pcc_controle.html?agent=${m}`;
        }
    </script>
</body>
</html>
