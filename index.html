        :root {
            --iris-cyan: #00f2ff;
            --iris-purple: #8b5cf6;
            --iris-magenta: #ff44cc;
            --iris-dark: #05070a;
            --iris-slate: #0a0c15;
            --success: #22c55e;
            --warning: #f97316;
            --danger: #ef4444;
            --glass: rgba(10, 15, 20, 0.95);
            --glass-light: rgba(20, 25, 40, 0.85);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--iris-dark); color: white; font-family: 'JetBrains Mono', monospace; overflow: hidden; }
        
        .header {
            height: 52px;
            background: linear-gradient(135deg, #0a0c15 0%, #0d1117 100%);
            border-bottom: 2px solid var(--iris-cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }
        .logo {
            font-family: 'Orbitron';
            font-size: 1.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, var(--iris-cyan), var(--iris-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span { background: none; color: var(--iris-cyan); }
        .badge { padding: 4px 12px; border-radius: 20px; background: rgba(0,242,255,0.1); border: 1px solid var(--iris-cyan); font-size: 0.7rem; }
        .mic-btn {
            background: var(--iris-purple);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s;
        }
        .mic-btn.listening { background: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .main { display: flex; height: calc(100vh - 52px); width: 100%; position: relative; }
        
        /* PANELS DRAGGABLE */
        .panel {
            position: absolute;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,242,255,0.3);
            border-radius: 12px;
            overflow: hidden;
            transition: box-shadow 0.2s;
            z-index: 20;
        }
        .panel:hover { box-shadow: 0 0 20px rgba(0,242,255,0.2); }
        .panel-header {
            padding: 8px 12px;
            background: rgba(0,0,0,0.5);
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,242,255,0.2);
            font-size: 0.8rem;
            font-weight: bold;
        }
        .panel-content { padding: 10px; overflow-y: auto; max-height: calc(100% - 40px); }
        .panel.minimized .panel-content { display: none; }
        .panel.minimized { height: auto !important; }
        
        /* LAYOUT PAR DÉFAUT */
        .panel-timeline { top: 10px; left: 10px; width: 380px; height: 140px; }
        .panel-tm { top: 160px; left: 10px; width: 480px; height: 380px; }
        .panel-fleet { top: 550px; left: 10px; width: 480px; height: 180px; }
        .panel-stats { top: 10px; right: 10px; width: 320px; height: 280px; }
        .panel-ai { top: 300px; right: 10px; width: 320px; height: 200px; }
        .panel-chat { top: 510px; right: 10px; width: 320px; height: 160px; }
        
        #map { width: 100%; height: 100%; background: #05070a; z-index: 1; }
        
        /* TABLEAU DE MARCHE - AMÉLIORÉ */
        .tm-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 320px;
        }
        .tm-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .tm-table th {
            background: #1e293b;
            color: var(--iris-cyan);
            padding: 6px 4px;
            position: sticky;
            top: 0;
            font-weight: bold;
            text-align: center;
            font-size: 0.65rem;
            border-bottom: 1px solid #00f2ff33;
        }
        .tm-table td {
            padding: 5px 4px;
            text-align: center;
            border-bottom: 1px solid #1a1a2e;
            color: #ccc;
        }
        .tm-table tr.current td {
            background: rgba(0,242,255,0.15);
            border-left: 2px solid var(--iris-cyan);
        }
        .tm-table tr.delayed td {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
        }
        .tm-table .police-cell { font-weight: bold; color: var(--iris-cyan); }
        
        .timeline-track {
            position: relative;
            height: 50px;
            background: #1e293b;
            border-radius: 25px;
            margin: 8px 0;
        }
        .timeline-bus {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            top: 20px;
            transform: translateX(-50%);
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 5;
        }
        .timeline-bus:hover { transform: translateX(-50%) scale(1.3); }
        .timeline-now {
            position: absolute;
            width: 2px;
            height: 40px;
            background: var(--iris-cyan);
            top: 5px;
            transform: translateX(-50%);
            box-shadow: 0 0 10px var(--iris-cyan);
            z-index: 10;
        }
        .timeline-prediction {
            position: absolute;
            width: 3px;
            height: 40px;
            background: var(--warning);
            top: 5px;
            transform: translateX(-50%);
            opacity: 0.7;
            z-index: 8;
        }
        
        .fleet-card {
            background: rgba(0,0,0,0.4);
            border-radius: 6px;
            padding: 6px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-left: 3px solid;
            font-size: 0.6rem;
        }
        .fleet-card .prediction-badge { font-size: 0.5rem; background: rgba(0,0,0,0.5); padding: 2px 5px; border-radius: 10px; }
        
        .chat-message {
            background: #1e293b;
            border-radius: 6px;
            padding: 5px;
            margin: 4px 0;
            font-size: 0.5rem;
        }
        .chat-input {
            display: flex;
            gap: 5px;
            margin-top: 6px;
        }
        .chat-input input {
            flex: 1;
            padding: 5px;
            background: #0f172a;
            border: 1px solid #1a1a2e;
            border-radius: 5px;
            color: white;
            font-size: 0.5rem;
        }
        
        .widget-controls {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: var(--glass);
            border-radius: 20px;
            padding: 5px 10px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        .widget-btn {
            background: #1e293b;
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.6rem;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--iris-slate);
            border-left: 3px solid var(--iris-cyan);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: var(--iris-cyan); border-radius: 5px; }
        
        .stat-item {
            display: flex;
            justify-content: space-between;

            font-size: 0.65rem;
            border-bottom: 1px solid #1a1a2e;
        }
        .stat-value { color: var(--iris-cyan); font-weight: bold; }

            background: rgba(139,92,246,0.2);
            border-radius: 8px;
            padding: 8px;
            margin: 5px 0;
            font-size: 0.6rem;
        }

            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        .confidence-fill { height: 100%; background: var(--iris-cyan); border-radius: 2px; }

        body.offline .offline-badge { display: block; }

        // FONCTIONS UTILES
        // ============================================================================
        function timeToMinutes(t) { if (!t) return 0; const p = t.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); }
        function getCurrentTimeMinutes() { const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
        
        function getBusDelay(bus) {
            const course = currentTM.find(c => c.tv === bus.currentTv);
            if (!course) return 0;
            const theoStr = currentDirection === 'aller' ? course.ctl : course.vm;
            const realStr = realTimes.get(bus.currentTv) || theoStr;
            return Math.max(0, timeToMinutes(realStr) - timeToMinutes(theoStr));
        }
        
        function predictDelay(bus, minutesAhead = 30) {
            const currentDelay = getBusDelay(bus);
            const history = JSON.parse(localStorage.getItem(`history_${bus.id}`) || '[]');
            let trend = 0;
            if (history.length > 0) {
                const recent = history.slice(-5);
                trend = (currentDelay - recent[0]) / Math.min(5, recent.length);
            }
            let predicted = currentDelay + (trend * (minutesAhead / 15));
            predicted = Math.max(0, Math.min(45, predicted));
            const confidence = Math.min(95, Math.max(50, 80 - Math.abs(trend) * 5));
            return { delay: Math.round(predicted), confidence: Math.round(confidence) };
        }
        
        function updateHistory(bus) {
            let history = JSON.parse(localStorage.getItem(`history_${bus.id}`) || '[]');
            history.push(getBusDelay(bus));
            if (history.length > 30) history.shift();
            localStorage.setItem(`history_${bus.id}`, JSON.stringify(history));
        }
        
        function getDelayClass(delay) {
            if (delay >= 20) return { class: 'danger', text: `🔴 ${delay}min`, color: '#ef4444' };
            if (delay >= 10) return { class: 'warning', text: `🟠 ${delay}min`, color: '#f97316' };
            return { class: 'ok', text: `🟢 ${delay}min`, color: '#22c55e' };
        }
        
        // ============================================================================
        // INITIALISATION FLOTTE
        // ============================================================================
        function initFleet() {
            const positions = [
                { lat: 48.8584, lng: 2.3476 }, { lat: 48.8575, lng: 2.3518 }, { lat: 48.8550, lng: 2.3605 },
                { lat: 48.8530, lng: 2.3690 }, { lat: 48.8446, lng: 2.3735 }, { lat: 48.8420, lng: 2.3180 },
                { lat: 48.8300, lng: 2.3130 }, { lat: 48.8220, lng: 2.3050 }, { lat: 48.8140, lng: 2.2970 },
                { lat: 48.8380, lng: 2.3250 }, { lat: 48.8450, lng: 2.3080 }, { lat: 48.8500, lng: 2.3360 }
            ];
            for (let i = 0; i < TM_ALLER.length; i++) {
                const course = TM_ALLER[i];
                fleetData.set(`POLICE ${course.police}`, {
                    id: `POLICE ${course.police}`,
                    police: course.police,
                    currentAgent: course.agent,
                    currentTv: course.tv,
                    ctl: course.ctl,
                    lat: positions[i % positions.length].lat + (Math.random() - 0.5) * 0.008,
                    lng: positions[i % positions.length].lng + (Math.random() - 0.5) * 0.008,
                    vitesse: 18 + Math.random() * 22
                });
            }
        }
        initFleet();
        
        // ============================================================================
        // RENDU TABLEAU DE MARCHE (AMÉLIORÉ)
        // ============================================================================
        function renderTM() {
            const container = document.getElementById('tm-container');
            const currentTime = getCurrentTimeMinutes();
            
            let html = `<table class="tm-table">
                <thead>
                    <tr>
                        <th>POLICE</th><th>AGENT</th><th>TV</th>`;
            
            if (currentDirection === 'aller') {
                html += `<th>CTL</th><th>GA</th><th>LUX</th><th>18J</th><th>AL</th><th>CHN</th><th>VM</th>`;
            } else {
                html += `<th>VM</th><th>CHI</th><th>AL</th><th>LM</th><th>18J</th><th>LUX</th><th>SG</th><th>GA</th><th>CTL</th>`;
            }
            html += `</tr></thead><tbody>`;
            
            currentTM.forEach(course => {
                const theoStr = currentDirection === 'aller' ? course.ctl : course.vm;
                const theoTime = timeToMinutes(theoStr);
                const isCurrent = Math.abs(currentTime - theoTime) <= 15;
                const realStr = realTimes.get(course.tv);
                const rowClass = isCurrent ? 'current' : (realStr ? 'delayed' : '');
                
                html += `<tr class="${rowClass}">
                    <td class="police-cell">${course.police}</td>
                    <td>${course.agent}</td>
                    <td>${course.tv}</td>`;
                
                if (currentDirection === 'aller') {
                    html += `<td>${course.ctl}</td><td>${course.ga}</td><td>${course.lux}</td>`;
                    html += `<td>${course.j18}</td><td>${course.al}</td><td>${course.chn}</td><td>${course.vm}</td>`;
                } else {
                    html += `<td>${course.vm}</td><td>${course.chi}</td><td>${course.al}</td>`;
                    html += `<td>${course.lm}</td><td>${course.j18}</td><td>${course.lux}</td>`;
                    html += `<td>${course.sg}</td><td>${course.ga}</td><td>${course.ctl}</td>`;
                }
                html += `</tr>`;
            });
            
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
        
        function renderTimeline() {
            const track = document.getElementById('timeline-track');
            const hoursDiv = document.getElementById('timeline-hours');
            const now = getCurrentTimeMinutes();
            
            let hoursHtml = '';
            for (let h = 6; h <= 23; h++) hoursHtml += `<span>${h.toString().padStart(2,'0')}:00</span>`;
            hoursDiv.innerHTML = hoursHtml;
            
            track.innerHTML = '';
            const minTime = 360, maxTime = 1380, range = maxTime - minTime;
            const nowPos = ((now - minTime) / range) * 100;
            const nowLine = document.createElement('div');
            nowLine.className = 'timeline-now';
            nowLine.style.left = `${Math.max(0, Math.min(100, nowPos))}%`;
            track.appendChild(nowLine);
            
            for (const bus of fleetData.values()) {
                const course = currentTM.find(c => c.tv === bus.currentTv);
                if (course) {
                    const theoTime = timeToMinutes(currentDirection === 'aller' ? course.ctl : course.vm);
                    const pos = ((theoTime - minTime) / range) * 100;
                    if (pos >= 0 && pos <= 100) {
                        const delay = getBusDelay(bus);
                        const dc = getDelayClass(delay);
                        const prediction = predictDelay(bus);
                        
                        const busDot = document.createElement('div');
                        busDot.className = 'timeline-bus';
                        busDot.style.backgroundColor = dc.color;
                        busDot.style.left = `${pos}%`;
                        busDot.title = `${bus.id} - Retard: ${delay}min | Prédiction 30min: +${prediction.delay}min`;
                        busDot.onclick = () => focusOnBus(bus.lat, bus.lng, bus.id);
                        track.appendChild(busDot);
                        
                        if (prediction.delay > delay) {
                            const predPos = ((theoTime + prediction.delay - minTime) / range) * 100;
                            if (predPos >= 0 && predPos <= 100) {
                                const predLine = document.createElement('div');
                                predLine.className = 'timeline-prediction';
                                predLine.style.left = `${predPos}%`;
                                predLine.title = `Prédiction: +${prediction.delay}min (confiance ${prediction.confidence}%)`;
                                track.appendChild(predLine);
                            }
                        }
                    }
                }
            }
        }
        
        function renderFleet() {
            const container = document.getElementById('fleet-container');
            let html = '';
            let totalDelay = 0;
            
            for (const bus of fleetData.values()) {
                const delay = getBusDelay(bus);
                totalDelay += delay;
                const dc = getDelayClass(delay);
                const prediction = predictDelay(bus);
                updateHistory(bus);
                
                html += `<div class="fleet-card ${dc.class}" onclick="focusOnBus(${bus.lat}, ${bus.lng}, '${bus.id}')">
                            <div>
                                <span style="color:var(--iris-cyan); font-weight:bold;">🚍 ${bus.id}</span>
                                <div style="font-size:0.5rem; color:#888;">Agent ${bus.currentAgent} | TV:${bus.currentTv}</div>
                            </div>
                            <div style="text-align:right;">
                                <div>${dc.text}</div>
                                <div class="prediction-badge">🔮 +${prediction.delay}min (${prediction.confidence}%)</div>
                            </div>
                         </div>`;
            }
            container.innerHTML = html;
            document.getElementById('bus-count').innerHTML = fleetData.size;
            const avgDelay = totalDelay / fleetData.size;
            document.getElementById('avg-delay').innerHTML = avgDelay.toFixed(1) + 'min';
            const reg = Math.max(85, 100 - avgDelay);
            document.getElementById('regularite-moy').innerHTML = reg.toFixed(1) + '%';
            document.getElementById('kmc-realises').innerHTML = Math.floor(fleetData.size * 12 + Math.random() * 30);
            
            if (kpiChart) {
                kpiChart.data.datasets[0].data = [reg, 100 - reg];
                kpiChart.update();
            }
        }
        
        function renderAI() {
            const container = document.getElementById('ai-container');
            const delays = [];
            for (const bus of fleetData.values()) delays.push(getBusDelay(bus));
            const avgDelay = delays.reduce((a,b)=>a+b,0)/delays.length;
            const maxDelay = Math.max(...delays);
            const maxBus = Array.from(fleetData.values()).find(b => getBusDelay(b) === maxDelay);
            
            let predictions = [];
            for (const bus of fleetData.values()) {
                const pred = predictDelay(bus, 60);
                predictions.push(pred.delay);
            }
            const avgPrediction = predictions.reduce((a,b)=>a+b,0)/predictions.length;
            
            container.innerHTML = `
                <div class="prediction-card">
                    <div><i class="fas fa-chart-line"></i> TENDANCE GLOBALE</div>
                    <div>Retard moyen actuel: ${avgDelay.toFixed(1)}min</div>
                    <div>Prédiction 1h: ${avgPrediction.toFixed(1)}min</div>
                    <div class="confidence-bar"><div class="confidence-fill" style="width: ${Math.min(100, Math.max(0, 85 - avgDelay))}%"></div></div>
                    <div>Confiance IA: ${Math.min(95, Math.max(50, 85 - avgDelay))}%</div>
                </div>
                ${maxDelay > 15 ? `<div class="prediction-card" style="border-left-color:var(--danger);">
                    <i class="fas fa-exclamation-triangle"></i> ALERTE: ${maxBus?.id} retard critique (${maxDelay}min)
                    <div>Prédiction propagation: +${Math.min(15, maxDelay/2)}min dans 30min</div>
                    <button class="widget-btn" onclick="suggestAction('${maxBus?.id}')" style="margin-top:5px;">Proposer régulation</button>
                </div>` : ''}
                <div class="prediction-card">
                    <i class="fas fa-lightbulb"></i> RECOMMANDATION IRIS
                    <div>${avgDelay > 10 ? '⚡ Activer régulation préventive sur les prochaines courses' : '✅ Régulation nominale, surveillance active'}</div>
                </div>
            `;
        }
        
        function suggestAction(busId) {
            if (busId) {
                showToast(`💡 Suggestion IRIS: Régulation sur ${busId}`, 'info');
            }
        }
        
        function renderChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = chatMessages.slice(-6).map(m => `
                <div class="chat-message ${m.type}">
                    <span style="color:var(--iris-cyan);">[${m.time}]</span> 
                    <span style="color:var(--warning);">${m.to}:</span> ${m.message}
                </div>
            `).join('');
        }
        
        // ============================================================================
        // CARTE
        // ============================================================================
        function initMap() {
            map = L.map('map').setView([48.842, 2.318], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB | JUMBO PCC L58' }).addTo(map);
            
            routeAller = L.polyline(gpsAller, { color: 'var(--iris-cyan)', weight: 5, opacity: 0.8 }).addTo(map);
            routeRetour = L.polyline(gpsRetour, { color: 'var(--iris-purple)', weight: 5, opacity: 0.8, dashArray: '5, 10' }).addTo(map);
            if (currentDirection === 'aller') routeRetour.setStyle({ opacity: 0.3 });
            else routeAller.setStyle({ opacity: 0.3 });
            
            for (const [k, s] of Object.entries(STOPS)) {
                L.marker([s.lat, s.lng], {
                    icon: L.divIcon({ html: `<div style="background:#1e293b; border:1px solid var(--iris-cyan); padding:2px 5px; border-radius:12px; font-size:7px; color:var(--iris-cyan);">${s.nom.substring(0,4)}</div>`, iconSize: [45, 16] })
                }).addTo(map);
            }
            updateMapMarkers();
        }
        
        function updateMapMarkers() {
            const currentGps = currentDirection === 'aller' ? gpsAller : gpsRetour;
            for (const bus of fleetData.values()) {
                const delay = getBusDelay(bus);
                const dc = getDelayClass(delay);
                const course = currentTM.find(c => c.tv === bus.currentTv);
                if (course) {
                    const theoTime = timeToMinutes(currentDirection === 'aller' ? course.ctl : course.vm);
                    const minTime = 360, maxTime = 1380;
                    const progress = (theoTime - minTime) / (maxTime - minTime);
                    const index = Math.floor(progress * (currentGps.length - 1));
                    const pos = currentGps[Math.min(Math.max(0, index), currentGps.length - 1)];
                    bus.lat = pos[0];
                    bus.lng = pos[1];
                }
                
                if (markers.has(bus.id)) markers.get(bus.id).setLatLng([bus.lat, bus.lng]);
                else {
                    const m = L.marker([bus.lat, bus.lng], {
                        icon: L.divIcon({ html: `<div style="background:${dc.color}; width:8px; height:8px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px ${dc.color};"></div>`, iconSize: [8, 8] })
                    }).addTo(map);
                    m.bindPopup(`<b>${bus.id}</b><br>Agent: ${bus.currentAgent}<br>TV:${bus.currentTv}<br>Retard:${delay}min`);
                    markers.set(bus.id, m);
                }
            }
        }
        
        function toggleDirection() {
            currentDirection = currentDirection === 'aller' ? 'retour' : 'aller';
            currentTM = currentDirection === 'aller' ? TM_ALLER : TM_RETOUR;
            
            if (currentDirection === 'aller') {
                routeAller.setStyle({ opacity: 0.8 });
                routeRetour.setStyle({ opacity: 0.3 });
            } else {
                routeAller.setStyle({ opacity: 0.3 });
                routeRetour.setStyle({ opacity: 0.8 });
            }
            
            renderTM();
            renderTimeline();
            renderFleet();
            updateMapMarkers();
            showToast(`Direction: ${currentDirection === 'aller' ? 'Châtelet → Vanves' : 'Vanves → Châtelet'}`, 'info');
        }
        
        // ============================================================================
        // COMMANDES VOCALES
        // ============================================================================
        function toggleVoiceRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                showToast("Reconnaissance vocale non supportée", 'error');
                return;
            }
            const micBtn = document.getElementById('micBtn');
            if (recognition && recognition.listening) {
                recognition.stop();
                micBtn.classList.remove('listening');
                micBtn.innerHTML = '<i class="fas fa-microphone"></i> COMMANDE VOCALE';
                recognition.listening = false;
                return;
            }
            
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                micBtn.classList.add('listening');
                micBtn.innerHTML = '<i class="fas fa-microphone-slash"></i> ÉCOUTE...';
                recognition.listening = true;
            };
            
            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript.toLowerCase();
                showToast(`🎤 Commande: "${command}"`, 'info');
                
                if (command.includes('bus') && command.match(/\d+/)) {
                    const num = command.match(/\d+/)[0];
                    const busId = `POLICE ${num.padStart(2,'0')}`;
                    if (fleetData.has(busId)) {
                        const bus = fleetData.get(busId);
                        focusOnBus(bus.lat, bus.lng, busId);
                        showToast(`📍 Focus sur ${busId}`, 'success');
                    }
                } else if (command.includes('aller')) {
                    if (currentDirection !== 'aller') toggleDirection();
                    showToast(`⬆️ Direction ALLER activée`, 'success');
                } else if (command.includes('retour')) {
                    if (currentDirection !== 'retour') toggleDirection();
                    showToast(`⬇️ Direction RETOUR activée`, 'success');
                } else if (command.includes('régulation')) {
                    suggestAction(Array.from(fleetData.keys())[0]);
                } else if (command.includes('retard')) {
                    const delays = [];
                    for (const bus of fleetData.values()) delays.push(getBusDelay(bus));
                    const avg = delays.reduce((a,b)=>a+b,0)/delays.length;
                    showToast(`📊 Retard moyen: ${avg.toFixed(1)} minutes`, 'info');
                } else {
                    showToast(`❓ Commande non reconnue. Essayez: "bus 5", "aller", "retour", "retard"`, 'warning');
                }
            };
            
            recognition.onerror = (event) => {
                showToast(`Erreur reconnaissance: ${event.error}`, 'error');
                micBtn.classList.remove('listening');
                micBtn.innerHTML = '<i class="fas fa-microphone"></i> COMMANDE VOCALE';
            };
            
            recognition.onend = () => {
                micBtn.classList.remove('listening');
                micBtn.innerHTML = '<i class="fas fa-microphone"></i> COMMANDE VOCALE';
                recognition.listening = false;
            };
            
            recognition.start();
        }
        
        // ============================================================================
        // DRAG & DROP PANELS
        // ============================================================================
        function startDrag(panel) {
            dragTarget = panel;
            const rect = panel.getBoundingClientRect();
            dragOffsetX = event.clientX - rect.left;
            dragOffsetY = event.clientY - rect.top;
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        }
        
        function onDrag(e) {
            if (!dragTarget) return;
            let left = e.clientX - dragOffsetX;
            let top = e.clientY - dragOffsetY;
            left = Math.max(0, Math.min(window.innerWidth - dragTarget.offsetWidth, left));
            top = Math.max(0, Math.min(window.innerHeight - dragTarget.offsetHeight, top));
            dragTarget.style.left = left + 'px';
            dragTarget.style.top = top + 'px';
            dragTarget.style.position = 'fixed';
            dragTarget.style.right = 'auto';
        }
        
        function stopDrag() {
            dragTarget = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }
        
        function togglePanel(btn) {
            const panel = btn.closest('.panel');
            panel.classList.toggle('minimized');
            btn.innerHTML = panel.classList.contains('minimized') ? '<i class="fas fa-plus"></i>' : '<i class="fas fa-minus"></i>';
        }
        
        function resetLayout() {
            const panels = document.querySelectorAll('.panel');
            panels.forEach(p => {
                p.style.position = '';
                p.style.left = '';
                p.style.top = '';
                p.style.right = '';
                p.style.bottom = '';
                p.classList.remove('minimized');
            });
            location.reload();
        }
        
        function exportData() {
            let csv = "Police,Agent,TV,Théorique,Retard (min),Prédiction 30min\n";
            for (const bus of fleetData.values()) {
                const delay = getBusDelay(bus);
                const pred = predictDelay(bus);
                csv += `${bus.police},${bus.currentAgent},${bus.currentTv},${bus.ctl},${delay},${pred.delay}\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `TM_L58_${new Date().toISOString().slice(0,19)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("📁 Export CSV effectué", 'success');
        }
        
        function testOfflineMode() {
            offlineMode = !offlineMode;
            if (offlineMode) document.body.classList.add('offline');
            else document.body.classList.remove('offline');
            showToast(offlineMode ? "🔌 MODE DÉGRADÉ ACTIVÉ (données locales)" : "🌐 MODE NORMAL", 'info');
        }
        
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            chatMessages.push({ from: "PCC", to: "TOUS", message: msg, time: new Date().toLocaleTimeString(), type: 'sent' });
            input.value = '';
            renderChat();
            showToast(`📨 Message envoyé à tous les agents`, 'success');
        }
        
        function focusOnBus(lat, lng, id) { map.setView([lat, lng], 15); showToast(`📍 ${id} centré`, 'info'); }
        function showToast(msg, type) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
        function updateClock() { document.getElementById('clock').innerHTML = new Date().toLocaleTimeString('fr-FR'); }
        
        // ============================================================================
        // GRAPHIQUE KPI
        // ============================================================================
        function initChart() {
            const ctx = document.getElementById('kpiChart').getContext('2d');
            kpiChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Régularité', 'Écart'],
                    datasets: [{ data: [98.5, 1.5], backgroundColor: ['var(--iris-cyan)', '#333'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { color: 'white', font: { size: 8 } } } } }
            });
        }
        
        // ============================================================================
        // SIMULATION & RAFRAÎCHISSEMENT
        // ============================================================================
        function simulateMovement() {
            setInterval(() => {
                for (const bus of fleetData.values()) {
                    const delay = getBusDelay(bus);
                    if (delay > 0 && Math.random() < 0.3) {
                        const newDelay = Math.max(0, delay + (Math.random() - 0.5) * 2);
                        const course = currentTM.find(c => c.tv === bus.currentTv);
                        if (course) {
                            const theoStr = currentDirection === 'aller' ? course.ctl : course.vm;
                            const newTime = timeToMinutes(theoStr) + newDelay;
                            const newTimeStr = `${Math.floor(newTime/60).toString().padStart(2,'0')}:${(newTime%60).toString().padStart(2,'0')}`;
                            realTimes.set(bus.currentTv, newTimeStr);
                        }
                    }
                }
                renderFleet();
                renderTimeline();
                renderAI();
                updateMapMarkers();
            }, 5000);
        }
        
        // ============================================================================
        // INIT
        // ============================================================================
        initMap();
        initChart();
        renderTM();
        renderTimeline();
        renderFleet();
        renderAI();
        setInterval(updateClock, 1000);
        simulateMovement();
        
        window.toggleDirection = toggleDirection;
        window.resetLayout = resetLayout;
        window.exportData = exportData;
        window.testOfflineMode = testOfflineMode;
        window.sendMessage = sendMessage;
        window.focusOnBus = focusOnBus;
        window.toggleVoiceRecognition = toggleVoiceRecognition;
        window.suggestAction = suggestAction;
        
        console.log(`✅ JUMBO PCC L58 - IRIS AI v4.0`);
        console.log(`⬆️ ALLER: Châtelet → Vanves (cyan) | ⬇️ RETOUR: Vanves → Châtelet (violet)`);
        console.log(`🎤 Commandes vocales: "bus 5", "aller", "retour", "retard"`);
    </script>
</body>
