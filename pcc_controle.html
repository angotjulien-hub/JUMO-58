<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - MASTER PCC & IDFM STRATEGIST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; margin: 0; }
        #map { flex: 1; height: 100%; filter: grayscale(1) invert(0.92) contrast(1.2) brightness(0.9); }
        .sidebar { width: 450px; background: #050505; border-left: 2px solid #1e293b; display: flex; flex-direction: column; z-index: 1001; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Alertes IRIS Proactives */
        .iris-suggestion {
            border: 2px solid #06b6d4;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
            animation: alert-pulse 1.5s infinite;
        }
        @keyframes alert-pulse {
            0%, 100% { border-color: #06b6d4; transform: scale(1); }
            50% { border-color: #ef4444; transform: scale(1.02); }
        }

        .bus-marker { 
            width: 20px; height: 20px; background: #06b6d4; border: 2px solid white; 
            border-radius: 3px; transform: rotate(45deg); box-shadow: 0 0 15px #06b6d4;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <div class="relative flex-1 flex flex-col">
        <div id="map"></div>
        
        <div class="absolute top-6 left-6 z-[1000]">
            <div class="glass p-5 rounded-2xl shadow-2xl w-80">
                <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-2">
                    <h3 class="text-[10px] font-black text-cyan-400 uppercase tracking-widest italic">Analyseur d'Intervalle</h3>
                    <div class="flex items-center gap-2">
                        <span id="bus-online-count" class="text-xs font-bold text-white">0</span>
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    </div>
                </div>
                <table class="text-[11px] w-full mono">
                    <thead>
                        <tr class="text-slate-500 text-[9px] uppercase">
                            <th class="text-left pb-2">Unité</th>
                            <th class="text-center pb-2">Statut</th>
                            <th class="text-right pb-2">EID</th>
                        </tr>
                    </thead>
                    <tbody id="tm-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="iris-alert-zone" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-[1000] w-[550px] pointer-events-none space-y-3"></div>
    </div>

    <div class="sidebar">
        <div class="p-8 bg-slate-900/40 border-b border-white/5">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-black text-white italic orbitron tracking-tighter">IRIS <span class="text-cyan-400">58</span></h1>
                    <p class="text-[8px] font-bold text-slate-500 uppercase tracking-[0.3em] mt-1">SAEIV MASTER PCC</p>
                </div>
                <div class="text-right">
                    <div id="clock" class="text-xl font-bold mono text-white">00:00:00</div>
                    <span class="text-[8px] font-bold text-green-500 uppercase tracking-widest">Link: Operational</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-px bg-white/5 border-b border-white/5">
            <div class="p-6 bg-[#050505]">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">Production (KM)</p>
                <p id="km-total" class="text-2xl font-black orbitron text-cyan-400">0.00</p>
            </div>
            <div class="p-6 bg-[#050505]">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">Pertes / Sanctions</p>
                <p id="km-lost" class="text-2xl font-black orbitron text-red-500">0.00</p>
            </div>
        </div>

        <div class="p-6 border-b border-white/5 bg-slate-900/10">
            <div class="space-y-4">
                <select id="target-bus" class="w-full bg-slate-900 border border-white/10 p-3 rounded-xl text-xs font-bold outline-none focus:border-cyan-500 transition-all text-white">
                    <option value="ALL">BROADCAST : TOUS LES BUS</option>
                </select>
                
                <textarea id="msg-text" placeholder="Saisir ordre ou consigne..." class="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-xs mono h-24 outline-none focus:border-cyan-500 transition-all resize-none text-cyan-100"></textarea>

                <div class="flex gap-2">
                    <button onclick="executeOrder('RETOURNEMENT')" class="flex-1 bg-red-600/10 text-red-500 border border-red-500/20 py-4 rounded-xl font-black text-[10px] uppercase hover:bg-red-600 hover:text-white transition-all shadow-xl shadow-red-600/5">Rebrousser</button>
                    <button onclick="sendFreeMsg()" class="flex-1 bg-cyan-600 py-4 rounded-xl font-black text-[10px] uppercase shadow-lg shadow-cyan-600/30 hover:bg-cyan-400 transition-all text-black">Envoyer Message</button>
                </div>
            </div>
        </div>

        <div id="bus-list" class="flex-1 overflow-y-auto p-4 space-y-2 bg-[#030303]"></div>

        <div class="p-4 bg-black border-t border-white/5">
            <button onclick="downloadIDFMReport()" class="w-full bg-transparent border border-white/10 text-slate-400 py-3 rounded-lg font-bold text-[9px] uppercase hover:border-cyan-500 hover:text-cyan-400 transition-all mb-4">
                📊 Extraction Rapport d'Exploitation (CSV)
            </button>
            <div class="font-mono text-[9px] text-slate-700 h-24 overflow-y-auto" id="logs">
                <div>[SYSTEM] IRIS v6 READY.</div>
            </div>
        </div>
    </div>

    <script>
        let map, fleet = {};
        let kmTotal = 0, kmPerdus = 0;
        const KM_PENALITE_BASE = 4.2; 

        function init() {
            // Horloge Temps Réel
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR'); }, 1000);

            // Initialisation Carte (Style Nuit)
            map = L.map('map', {zoomControl:false}).setView([48.840, 2.320], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            // Serveur de Communication PeerJS
            const peer = new Peer('IRIS-PCC-58-GLOBAL');
            peer.on('connection', conn => {
                conn.on('data', d => { if(d.type === 'pos') updateBus(d, conn); });
            });

            // Moteur d'Analyse IRIS (Fréquence : 5s)
            setInterval(irisAIEngine, 5000);
        }

        function updateBus(d, conn) {
            const id = d.pol;
            if(!fleet[id]) {
                addLog(`TRACKING ACQUISITION : UNIT ${id}`, 'text-cyan-400');
                fleet[id] = {
                    marker: L.marker([d.lat, d.lon], { icon: L.divIcon({html:'<div class="bus-marker"></div>', className:''}) }).addTo(map),
                    lastPos: [d.lat, d.lon],
                    pol: id
                };
                updateSelect();
            }

            // Calcul Production KM (IDFM)
            let dist = map.distance(fleet[id].lastPos, [d.lat, d.lon]) / 1000;
            if(dist > 0.005) {
                kmTotal += dist;
                document.getElementById('km-total').innerText = kmTotal.toFixed(2);
            }

            fleet[id].marker.setLatLng([d.lat, d.lon]);
            fleet[id].lastPos = [d.lat, d.lon];
            fleet[id].conn = conn;
            fleet[id].lastSeen = Date.now();

            refreshUI(id);
        }

        function refreshUI(id) {
            document.getElementById('bus-online-count').innerText = Object.keys(fleet).length;

            // Update Tableau EID
            let row = document.getElementById(`tm-${id}`);
            if(!row) {
                row = document.createElement('tr'); row.id = `tm-${id}`;
                row.className = "border-b border-white/5 hover:bg-white/5 transition";
                document.getElementById('tm-body').appendChild(row);
            }
            row.innerHTML = `<td class="py-2 font-bold text-white italic underline">P${id}</td>
                             <td class="text-center text-slate-500 font-bold uppercase text-[9px]">En Ligne</td>
                             <td class="text-right text-cyan-400 font-bold">+01'30"</td>`;

            // Update Sidebar Strip
            let strip = document.getElementById(`strip-${id}`);
            if(!strip) {
                strip = document.createElement('div'); strip.id = `strip-${id}`;
                strip.className = "bg-white/5 border border-white/5 p-4 rounded-xl flex justify-between items-center";
                document.getElementById('bus-list').appendChild(strip);
            }
            strip.innerHTML = `<div>
                                 <div class="text-[9px] text-slate-500 font-black uppercase">Unit Trace</div>
                                 <div class="text-lg font-black orbitron text-white italic">BUS-${id}</div>
                               </div>
                               <div class="text-right">
                                 <div class="text-[8px] text-green-500 font-bold uppercase mb-1">Signal Active</div>
                                 <div class="w-16 h-1 bg-slate-800 rounded-full overflow-hidden">
                                     <div class="h-full bg-cyan-400" style="width: 100%"></div>
                                 </div>
                               </div>`;
        }

        function irisAIEngine() {
            const ids = Object.keys(fleet);
            for(let i=0; i<ids.length; i++) {
                for(let j=i+1; j<ids.length; j++) {
                    const b1 = fleet[ids[i]], b2 = fleet[ids[j]];
                    const dist = map.distance(b1.lastPos, b2.lastPos);
                    if(dist < 400) triggerIrisAlert(ids[i], ids[j], "Risque de Couplage");
                }
            }
        }

        function triggerIrisAlert(p1, p2, reason) {
            const zone = document.getElementById('iris-alert-zone');
            if(document.getElementById(`alert-${p1}-${p2}`)) return;

            const div = document.createElement('div');
            div.id = `alert-${p1}-${p2}`;
            div.className = "iris-suggestion glass p-6 rounded-2xl pointer-events-auto flex items-center justify-between";
            div.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="bg-red-600 p-3 rounded-lg text-white font-black animate-pulse uppercase text-xs">IRIS</div>
                    <div>
                        <h4 class="text-[10px] font-black text-white uppercase">${reason} : ${p1} / ${p2}</h4>
                        <p class="text-[9px] text-slate-400 font-mono italic">Action suggérée : Rebrousser l'unité ${p2} pour protéger l'EID.</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="this.parentElement.parentElement.remove()" class="text-slate-500 text-[10px] uppercase font-bold px-3">Ignorer</button>
                    <button onclick="applyIrisOrder('${p2}', '${p1}-${p2}')" class="bg-cyan-500 text-black px-4 py-2 rounded-lg font-black text-[10px] uppercase shadow-lg shadow-cyan-500/20">Appliquer</button>
                </div>`;
            zone.appendChild(div);
        }

        function applyIrisOrder(busId, alertId) {
            executeOrder('RETOURNEMENT', busId);
            document.getElementById(`alert-${alertId}`).remove();
        }

        function executeOrder(type, forcedId = null) {
            const target = forcedId || document.getElementById('target-bus').value;
            if(target === "ALL") return alert("Cible spécifique requise pour cet ordre.");

            if(fleet[target]?.conn) {
                fleet[target].conn.send({type: type});
                kmPerdus += KM_PENALITE_BASE;
                document.getElementById('km-lost').innerText = kmPerdus.toFixed(2);
                addLog(`ORDER SENT : ${type} to P${target} (-${KM_PENALITE_BASE}km)`, 'text-red-500');
            }
        }

        function sendFreeMsg() {
            const txt = document.getElementById('msg-text').value;
            const target = document.getElementById('target-bus').value;
            if(!txt) return;

            const payload = {type:'msg', content: txt};
            if(target === "ALL") {
                Object.values(fleet).forEach(b => b.conn.send(payload));
                addLog(`BROADCAST : "${txt}"`, 'text-cyan-400');
            } else {
                fleet[target].conn.send(payload);
                addLog(`MSG to P${target} : "${txt}"`);
            }
            document.getElementById('msg-text').value = '';
        }

        function downloadIDFMReport() {
            let csv = "DATE;HEURE;EVENT;TARGET;KM_PROD;KM_LOSS\n";
            const d = new Date().toLocaleDateString();
            const t = new Date().toLocaleTimeString();
            csv += `${d};${t};FINAL_REPORT;GLOBAL;${kmTotal.toFixed(2)};${kmPerdus.toFixed(2)}`;
            
            const link = document.createElement("a");
            link.href = 'data:text/csv;charset=utf-8,' + encodeURI(csv);
            link.target = '_blank';
            link.download = `IRIS_REPORT_L58_${d}.csv`;
            link.click();
            addLog("REPORT EXPORTED TO DISK.", "text-green-500");
        }

        function updateSelect() {
            const sel = document.getElementById('target-bus');
            sel.innerHTML = '<option value="ALL">BROADCAST : TOUS LES BUS</option>';
            Object.keys(fleet).forEach(id => {
                const o = document.createElement('option'); o.value = id; o.innerText = `UNITÉ POLICE ${id}`;
                sel.appendChild(o);
            });
        }

        function addLog(m, c='') {
            const l = document.getElementById('logs');
            l.innerHTML = `<div class="${c}">[${new Date().toLocaleTimeString()}] ${m}</div>` + l.innerHTML;
        }

        window.onload = init;
    </script>
</body>
</html>
