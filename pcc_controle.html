<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC RADAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; background: #010208; }
        .bus-label { 
            background: #06b6d4; color: black; font-weight: bold; 
            padding: 2px 8px; border-radius: 10px; border: 2px solid white;
            font-family: sans-serif; font-size: 11px;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body class="bg-black text-white overflow-hidden">

    <div id="map"></div>

    <div class="fixed top-5 left-5 z-[1000] bg-black/80 p-4 rounded-2xl border border-cyan-500/30">
        <h1 class="text-cyan-400 font-bold tracking-tighter">PCC LIGNE 58</h1>
        <p id="bus-count" class="text-[10px] text-slate-400 italic">CHARGEMENT DU SYSTÈME...</p>
        <p id="debug-coords" class="text-[9px] text-cyan-500/50 mt-1"></p>
    </div>

    <script>
        const map = L.map('map', {zoomControl: false}).setView([48.8566, 2.3522], 13);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markers = {}; 
        let firstBusFound = false;

        async function refreshRadar() {
            try {
                const response = await fetch('https://angot.pythonanywhere.com/get_stats');
                const data = await response.json();
                const buses = data.bus_positions || [];

                document.getElementById('bus-count').innerText = `${buses.length} BUS EN LIGNE`;

                buses.forEach(bus => {
                    // FORCE LA CONVERSION EN NOMBRE (Crucial)
                    const latitude = parseFloat(bus.lat);
                    const longitude = parseFloat(bus.lng || bus.lon);

                    // On vérifie que les coordonnées existent et ne sont pas à 0
                    if (!isNaN(latitude) && !isNaN(longitude) && latitude !== 0) {
                        const pos = [latitude, longitude];
                        
                        // Debug visuel pour toi
                        document.getElementById('debug-coords').innerText = `Dernier point : ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;

                        if (markers[bus.id]) {
                            markers[bus.id].setLatLng(pos);
                        } else {
                            const icon = L.divIcon({
                                className: 'custom-div-icon',
                                html: `<div class="bus-label">🚍 P${bus.id}</div>`,
                                iconSize: [60, 25],
                                iconAnchor: [30, 12]
                            });
                            markers[bus.id] = L.marker(pos, {icon: icon}).addTo(map);
                            
                            // Zoom automatique sur le bus au premier chargement
                            if (!firstBusFound) {
                                map.flyTo(pos, 16);
                                firstBusFound = true;
                            }
                        }
                    }
                });
            } catch (e) {
                console.error("Erreur Radar:", e);
                document.getElementById('bus-count').innerText = "ERREUR LIAISON SERVEUR";
            }
        }

        setInterval(refreshRadar, 2000);
        refreshRadar();
    </script>
</body>
</html>
