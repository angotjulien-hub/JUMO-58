<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC CENTRAL v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #050505; font-family: 'Orbitron', sans-serif; color: white; overflow: hidden; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.3); }
        .pcc-panel { position: absolute; top: 20px; left: 20px; z-index: 1000; width: 320px; background: rgba(0,0,0,0.9); border-left: 4px solid #00f2ff; padding: 15px; }
        .bus-hex { width: 22px; height: 14px; background: #00f2ff; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); border: 1px solid white; transition: background 0.5s; }
        @keyframes panic { 0%, 100% { background: #050505; } 50% { background: #600; } }
    </style>
</head>
<body>
    <div class="pcc-panel shadow-2xl">
        <h1 class="text-[10px] font-bold border-b border-zinc-800 pb-2 mb-4 tracking-widest text-cyan-400">PCC LIGNE 58 - REGULATION TM</h1>
        <div id="console" class="text-[8px] text-cyan-600 h-48 overflow-y-auto font-mono flex flex-col-reverse mb-4 bg-black/50 p-2 border border-zinc-900"><div>> Système prêt.</div></div>
        
        <select id="select-bus" class="w-full bg-zinc-900 border border-zinc-800 text-[10px] p-2 mb-2 rounded text-cyan-400 outline-none">
            <option value="all">📢 TOUTE LA LIGNE 58</option>
        </select>

        <div class="grid grid-cols-2 gap-1 mb-4">
            <button onclick="setMsg('TENIR L\'ARRÊT POUR RECALAGE TM')" class="bg-zinc-800 hover:bg-orange-900 border border-zinc-700 p-2 text-[7px] uppercase font-bold">⏳ Recalage TM</button>
            <button onclick="setMsg('REPRENDRE LA MARCHE NORMALE')" class="bg-zinc-800 hover:bg-green-900 border border-zinc-700 p-2 text-[7px] uppercase font-bold">🟢 Marche Normale</button>
            <button onclick="setMsg('DANGER : PIÉTONS SUR VOIE')" class="bg-zinc-800 hover:bg-red-900 border border-zinc-700 p-2 text-[7px] uppercase font-bold">⚠️ Danger</button>
            <button onclick="setMsg('APPEL RADIO IMMÉDIAT')" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 p-2 text-[7px] uppercase font-bold">📞 Appel Radio</button>
        </div>

        <div class="flex gap-1">
            <input type="text" id="input-msg" placeholder="Message..." class="flex-1 bg-black border border-zinc-800 text-[10px] p-2 rounded outline-none focus:border-cyan-500">
            <button onclick="envoyerMessage()" class="bg-cyan-600 px-3 rounded text-black font-bold">></button>
        </div>
    </div>

    <div id="map"></div>

    <script>
        let map, fleet = {};
        const PCC_ID = 'IRIS-PCC-58-GLOBAL';

        function init() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.840, 2.318], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            const peer = new Peer(PCC_ID);
            peer.on('connection', (conn) => {
                conn.on('data', (d) => {
                    if (d.type === 'position') {
                        fleet[d.id] = { ...d, connection: conn };
                        updateMap(d);
                    }
                    if (d.type === 'ack_message') log(`✓ REÇU PAR POLICE ${d.police}`, "text-green-500");
                    if (d.type === 'SOS') triggerSOS(d.police);
                });
            });
        }

        function updateMap(d) {
            const delayTxt = d.delay > 0 ? ` [-${d.delay}']` : (d.delay < 0 ? ` [+${Math.abs(d.delay)}']` : "");
            const label = `POL ${d.police}${delayTxt}`;
            if (!fleet[d.id].marker) {
                fleet[d.id].marker = L.marker([d.lat, d.lon], { icon: L.divIcon({ className:'', html:'<div class="bus-hex"></div>' }) }).addTo(map)
                .bindTooltip(label, {permanent:true, direction:'right', className:'bg-black/90 border-0 text-white text-[9px] px-2'});
                const opt = document.createElement('option'); opt.value = d.id; opt.text = `POLICE ${d.police}`; document.getElementById('select-bus').add(opt);
            } else {
                fleet[d.id].marker.setLatLng([d.lat, d.lon]).setTooltipContent(label);
                fleet[d.id].marker._icon.querySelector('.bus-hex').style.background = d.delay > 3 ? "#ef4444" : (d.delay < -1 ? "#00f2ff" : "#22c55e");
            }
        }

        function setMsg(t) { document.getElementById('input-msg').value = t; }
        function envoyerMessage() {
            const target = document.getElementById('select-bus').value;
            const txt = document.getElementById('input-msg').value;
            if(!txt) return;
            if(target === "all") Object.values(fleet).forEach(b => b.connection.send({type:'message_pcc', texte:txt}));
            else fleet[target].connection.send({type:'message_pcc', texte:txt});
            log(`✉️ ENVOI : ${txt}`);
            document.getElementById('input-msg').value = "";
        }

        function log(m, cls="text-cyan-600") { const c = document.getElementById('console'); c.innerHTML += `<div class="${cls}">> ${m}</div>`; }
        function triggerSOS(p) { document.body.style.animation = "panic 0.5s infinite"; log(`🚨 SOS POLICE ${p}`, "text-red-500 font-bold"); }
        window.onload = init;
    </script>
</body>
</html>
