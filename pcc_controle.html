<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>IRIS T-PCC | LIGNE 58</title>
    <style>
        /* DESIGN GLOBAL IRIS */
        body { background-color: #050505; color: #e0e0e0; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; overflow: hidden; }
        
        /* BARRE DE STATUT SUPÉRIEURE */
        .header { background: #111; padding: 10px 20px; border-bottom: 2px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .status-on { color: #4cd964; font-weight: bold; text-shadow: 0 0 5px #4cd964; }
        #clock { font-family: monospace; font-size: 18px; color: #007aff; }
        
        /* AFFICHAGE CENTRAL */
        #main-display { display: flex; height: calc(100vh - 60px); }
        
        /* CARTE ET RADAR */
        #map-container { flex: 3; position: relative; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); border-right: 2px solid #333; overflow: hidden; }
        .line-58 { position: absolute; width: 80%; height: 4px; background: #444; top: 50%; left: 10%; border-radius: 2px; }
        .station { position: absolute; width: 12px; height: 12px; background: #fff; border-radius: 50%; top: calc(50% - 4px); border: 2px solid #007aff; }
        .station-label { position: absolute; font-size: 10px; color: #888; top: calc(50% + 15px); transform: translateX(-50%); font-weight: bold; }

        /* BUS ANIMÉS */
        .bus-marker { 
            position: absolute; width: 32px; height: 32px; 
            background: #007aff; border: 2px solid #fff; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; color: white;
            transition: left 2s ease-in-out, top 2s ease-in-out; 
            z-index: 10; box-shadow: 0 0 15px rgba(0, 122, 255, 0.6);
        }

        /* PANNEAU DE CONTRÔLE LATÉRAL */
        .side-panel { flex: 1; background: #0a0a0a; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #1c1c1e; border: 1px solid #333; padding: 15px; border-radius: 8px; }
        .alert-box { 
            background: #4a0000; border: 2px solid #ff3b30; color: #ff3b30; 
            padding: 15px; border-radius: 8px; display: none; 
            text-align: center; font-weight: bold; animation: blink 0.8s infinite; 
        }
        
        .bus-item { padding: 12px; border-bottom: 1px solid #222; margin-bottom: 5px; border-radius: 4px; }
        .eid-tag { color: #ff9500; font-weight: bold; font-size: 13px; display: block; margin-top: 4px; }

        @keyframes blink { 50% { border-color: transparent; background: #220000; } }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <span style="font-size: 22px; font-weight: bold; letter-spacing: 1px;">IRIS T-PCC</span> 
            <span style="margin-left: 15px; color: #666;">GESTION LIGNE 58</span>
        </div>
        <div id="clock">--:--:--</div>
        <div>SYSTÈME : <span class="status-on">ACTIF</span></div>
    </div>

    <div id="main-display">
        <div id="map-container">
            <div class="line-58"></div>
            <div class="station" style="left: 10%;"></div><div class="station-label" style="left: 10%;">VANVES</div>
            <div class="station" style="left: 50%;"></div><div class="station-label" style="left: 50%;">MONTPARNASSE</div>
            <div class="station" style="left: 90%;"></div><div class="station-label" style="left: 90%;">CHÂTELET</div>
            
            <div id="radar-layer"></div>
        </div>

        <div class="side-panel">
            <div id="couplage-alert" class="alert-box">⚠️ ALERTE : COUPLAGE IMMINENT<br><small>ÉCART < 3 MIN</small></div>
            
            <div class="card">
                <h3 style="margin: 0 0 10px 0; font-size: 14px; color: #007aff; text-transform: uppercase;">📡 Bus Détectés</h3>
                <div id="bus-list">Initialisation du flux...</div>
            </div>

            <div class="card">
                <h3 style="margin: 0 0 10px 0; font-size: 14px; color: #ff9500; text-transform: uppercase;">📊 Régulation</h3>
                <p style="font-size: 13px; margin: 5px 0;">Référentiel : 6 min</p>
                <p style="font-size: 13px; margin: 5px 0;">Mode : Temps Réel</p>
            </div>
        </div>
    </div>

    <script>
        async function refreshIRIS() {
            try {
                // APPEL AU SERVEUR PYTHON
                const response = await fetch('http://127.0.0.1:5000/get_stats');
                const data = await response.json();
                
                const layer = document.getElementById('radar-layer');
                const list = document.getElementById('bus-list');
                const alertUI = document.getElementById('couplage-alert');
                
                document.getElementById('clock').innerText = new Date().toLocaleTimeString();
                
                // Tri des bus par longitude (pour calculer l'EID logiquement)
                const sortedBus = data.bus_positions.sort((a, b) => a.lng - b.lng);
                
                list.innerHTML = '';
                let isCoupling = false;

                if (sortedBus.length === 0) {
                    list.innerHTML = "<span style='color:#666'>Aucun bus en ligne.</span>";
                    layer.innerHTML = '';
                    alertUI.style.display = 'none';
                    return;
                }

                sortedBus.forEach((bus, index) => {
                    // CALCUL POSITION CARTE (Mapping Longitude -> % Écran)
                    // Vanves (2.288) à gauche, Châtelet (2.345) à droite
                    let xPercent = ((bus.lng - 2.288) / (2.345 - 2.288)) * 80 + 10;
                    xPercent = Math.max(8, Math.min(92, xPercent)); 

                    // MISE À JOUR DU MARQUEUR (POINT BLEU)
                    let marker = document.getElementById('marker-' + bus.id);
                    if (!marker) {
                        marker = document.createElement('div');
                        marker.id = 'marker-' + bus.id;
                        marker.className = 'bus-marker';
                        layer.appendChild(marker);
                    }
                    marker.style.left = xPercent + '%';
                    marker.style.top = 'calc(50% - 16px)';
                    marker.innerText = bus.id.slice(-4);

                    // CALCUL DE L'EID (Intervalle avec le bus précédent)
                    let eidInfo = "Tête de ligne";
                    let itemColor = "transparent";

                    if (index > 0) {
                        const prevBus = sortedBus[index - 1];
                        const gap = Math.abs(bus.lng - prevBus.lng);
                        // Ratio : 0.01 de longitude = ~4 minutes
                        const minutes = Math.round(gap * 400); 
                        eidInfo = `EID : ${minutes} min`;
                        
                        // Déclenchement alerte si intervalle trop court
                        if (minutes < 3) {
                            isCoupling = true;
                            itemColor = "rgba(255, 59, 48, 0.2)"; // Fond rouge léger
                        }
                    }

                    // AJOUT DANS LA LISTE LATÉRALE
                    list.innerHTML += `
                        <div class="bus-item" style="background: ${itemColor}">
                            <strong style="color:#007aff;">BUS ${bus.id}</strong>
                            <span class="eid-tag">${eidInfo}</span>
                        </div>`;
                });

                // Affichage de l'alerte globale
                alertUI.style.display = isCoupling ? 'block' : 'none';

            } catch (err) {
                document.getElementById('bus-list').innerHTML = "<span style='color:#ff3b30'>ERREUR LIAISON SERVEUR</span>";
            }
        }

        // Rafraîchissement automatique toutes les 2 secondes
        setInterval(refreshIRIS, 2000);
        refreshIRIS();
    </script>
</body>
</html>
