<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC RADAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; background: #010208; }
        .bus-label { 
            background: #06b6d4; color: black; font-weight: bold; 
            padding: 2px 8px; border-radius: 10px; border: 2px solid white;
            font-family: sans-serif; font-size: 11px;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body class="bg-black text-white overflow-hidden">

    <div id="map"></div>

    <div class="fixed top-5 left-5 z-[1000] bg-black/80 p-4 rounded-2xl border border-cyan-500/30">
        <h1 class="text-cyan-400 font-bold tracking-tighter">PCC LIGNE 58</h1>
        <p id="bus-count" class="text-[10px] text-slate-400 italic">CHARGEMENT DU SYSTÈME...</p>
    </div>

    <script>
        // On initialise la carte sur Paris par défaut
        const map = L.map('map', {zoomControl: false}).setView([48.8566, 2.3522], 13);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markers = {}; 
        let firstBusFound = false;

        async function refreshRadar() {
            try {
                const response = await fetch('https://angot.pythonanywhere.com/get_stats');
                const data = await response.json();
                
                // On vérifie si bus_positions existe dans la réponse
                const buses = data.bus_positions || [];

                document.getElementById('bus-count').innerText = `${buses.length} BUS EN LIGNE`;

                buses.forEach(bus => {
                    // SÉCURITÉ : On vérifie si c'est 'lng' ou 'lon' qui arrive du serveur
                    const longitude = bus.lng || bus.lon;
                    const latitude = bus.lat;

                    if (latitude && longitude) {
                        const pos = [latitude, longitude];

                        if (markers[bus.id]) {
                            // Mise à jour position fluide
                            markers[bus.id].setLatLng(pos);
                        } else {
                            // Création du bus avec icône stylisée
                            const icon = L.divIcon({
                                className: 'custom-div-icon',
                                html: `<div class="bus-label">🚍 P${bus.id}</div>`,
                                iconSize: [60, 25],
                                iconAnchor: [30, 12]
                            });
                            markers[bus.id] = L.marker(pos, {icon: icon}).addTo(map);
                            
                            // Si c'est le premier bus qu'on voit, on centre la carte dessus
                            if (!firstBusFound) {
                                map.setView(pos, 16);
                                firstBusFound = true;
                            }
                        }
                    }
                });
            } catch (e) {
                console.error("Erreur Radar:", e);
                document.getElementById('bus-count').innerText = "ERREUR SERVEUR";
            }
        }

        // Rafraîchir toutes les 2 secondes pour un mouvement fluide
        setInterval(refreshRadar, 2000);
        refreshRadar(); // Premier lancement immédiat
    </script>
</body>
</html>
