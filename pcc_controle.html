<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC STRATÉGIQUE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --iris-blue: #00f2ff; --iris-orange: #ffae00; --iris-alert: #ff3e3e; --iris-bg: #050505; }
        body { margin: 0; background: var(--iris-bg); font-family: 'Orbitron', sans-serif; color: white; overflow: hidden; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.4) contrast(1.2); }
        
        /* Panneaux */
        .glass-panel { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 255, 0.1); }
        .sidebar { position: absolute; top: 20px; left: 20px; z-index: 1000; width: 380px; bottom: 20px; display: flex; flex-direction: column; }
        .tech-panel { position: absolute; top: 20px; right: 20px; z-index: 1000; width: 400px; }

        /* KPI IDFM */
        .kpi-card { background: rgba(20,20,20,0.8); border-top: 2px solid var(--iris-blue); padding: 10px; }
        .kpi-value { font-size: 18px; font-weight: bold; color: var(--iris-blue); }
        
        .bus-hex { width: 20px; height: 12px; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
    </style>
</head>
<body>

    <div class="sidebar glass-panel p-4 overflow-y-auto">
        <h1 class="text-xl font-bold border-b border-cyan-900 pb-2 mb-4">IRIS PRIME 58</h1>
        
        <div class="mb-6">
            <h2 class="text-[10px] text-zinc-500 mb-2 tracking-widest uppercase">Actions de Régulation</h2>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="agir('COUPLE')" class="bg-blue-900/30 border border-blue-500 text-[9px] py-2 hover:bg-blue-500">COUPLER UNITÉS</button>
                <button onclick="agir('SUPPR')" class="bg-red-900/30 border border-red-500 text-[9px] py-2 hover:bg-red-500 text-red-200">SUPPRESSION TR</button>
            </div>
        </div>

        <div class="mb-6">
            <h2 class="text-[10px] text-zinc-500 mb-2 tracking-widest uppercase">Bilan Manœuvres (Temps Réel)</h2>
            <div id="manoeuvre-list" class="space-y-2 text-[10px]">
                </div>
        </div>

        <div id="console" class="mt-auto h-32 bg-black text-[9px] p-2 font-mono text-cyan-400 overflow-y-auto"></div>
    </div>

    <div class="tech-panel space-y-4">
        <div class="glass-panel p-4">
            <h2 class="text-xs font-bold mb-3 text-center border-b border-zinc-800 pb-2 uppercase tracking-tighter">Tableau de Bord IDFM</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="kpi-card text-center">
                    <div class="text-[8px] text-zinc-400">KM THÉORIQUES</div>
                    <div id="km-theo" class="kpi-value">412.4 km</div>
                </div>
                <div class="kpi-card text-center">
                    <div class="text-[8px] text-zinc-400">KM EFFECTUÉS</div>
                    <div id="km-reel" class="kpi-value text-green-400">0.0 km</div>
                </div>
                <div class="kpi-card text-center">
                    <div class="text-[8px] text-zinc-400">KM PERDUS (MAN.)</div>
                    <div id="km-perdu" class="text-red-400 font-bold">0.0 km</div>
                </div>
                <div class="kpi-card text-center">
                    <div class="text-[8px] text-zinc-400">RESPECT CONTRAT</div>
                    <div id="idfm-percent" class="kpi-value">--%</div>
                </div>
            </div>
            <div class="mt-4 p-2 bg-zinc-900 text-[9px]">
                <div class="flex justify-between"><span>TM MOYEN :</span><span id="tm-val">12.4 km/h</span></div>
                <div class="flex justify-between"><span>DÉPARTS RÉALISÉS :</span><span id="departs-val">0 / 84</span></div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        let map, fleet = {}, logs = [];
        const PCC_ID = 'IRIS-PCC-58-GLOBAL';
        
        // Tracé théorique de la ligne 58 (Simplifié pour l'exemple)
        const traceLigne58 = [
            [48.8212, 2.2901], [48.8250, 2.3000], [48.8350, 2.3150], [48.8450, 2.3300], [48.8582, 2.3465]
        ];

        function init() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.838, 2.318], 13);
            
            // Carte Sombre
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            // Dessin du parcours de la 58
            L.polyline(traceLigne58, {color: '#00f2ff', weight: 3, opacity: 0.5, dashArray: '10, 10'}).addTo(map);

            const peer = new Peer(PCC_ID);
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    updateBus(data);
                    calculerKPI(data);
                });
            });
        }

        function updateBus(d) {
            const color = d.status ? '#ffae00' : '#00f2ff';
            if (!fleet[d.id]) {
                fleet[d.id] = L.marker([d.lat, d.lon], { icon: L.divIcon({ className: '', html: `<div class="bus-hex" style="background:${color}"></div>` }) }).addTo(map);
                log(`Unité ${d.id} en ligne.`);
            } else {
                fleet[d.id].setLatLng([d.lat, d.lon]);
            }
        }

        let kmCumules = 0;
        let kmPerdus = 0;

        function calculerKPI(d) {
            // Simulation simplifiée du calcul kilométrique
            kmCumules += 0.1;
            if(d.status) kmPerdus += 0.05; // Simulation km perdus pendant manoeuvre
            
            document.getElementById('km-reel').innerText = kmCumules.toFixed(1) + " km";
            document.getElementById('km-perdu').innerText = kmPerdus.toFixed(1) + " km";
            
            let respect = (kmCumules / 412.4) * 100;
            document.getElementById('idfm-percent').innerText = respect.toFixed(1) + "%";
        }

        function agir(type) {
            alert("IRIS : Action de régulation envoyée aux terminaux : " + type);
            log("ACTION : " + type + " envoyée.");
        }

        function log(m) {
            const c = document.getElementById('console');
            c.innerHTML = `<div>> ${m}</div>` + c.innerHTML;
        }

        window.onload = init;
    </script>
</body>
</html>
