<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - FULL TACTICAL PCC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { background: #010208; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; margin: 0; }
        #map { flex: 1; filter: grayscale(1) invert(0.95) contrast(1.1) brightness(0.8) hue-rotate(195deg); }
        .sidebar { width: 420px; background: #05070a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 1001; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Fenêtre TM Modale */
        #tm-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
        .tm-container { background: #0f172a; border: 1px solid #06b6d4; padding: 30px; border-radius: 20px; width: 80%; max-width: 900px; }

        /* Animation Collision */
        .collision-flash { animation: bg-red 0.5s infinite alternate; }
        @keyframes bg-red { from { background: rgba(239, 68, 68, 0.1); } to { background: rgba(239, 68, 68, 0.4); } }
    </style>
</head>
<body class="flex">

    <div id="tm-modal">
        <div class="tm-container">
            <div class="flex justify-between items-center mb-6">
                <h2 class="orbitron text-xl text-cyan-400 italic">ÉDITION MANUELLE DU TABLEAU DE MARCHE</h2>
                <button onclick="closeTM()" class="text-slate-500 hover:text-white">✕ FERMER</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-[10px] mono text-left">
                    <thead class="text-cyan-500 border-b border-white/10 uppercase">
                        <tr><th class="p-2">TV ID</th><th class="p-2">AGENT</th><th class="p-2">CTL</th><th class="p-2">VM</th><th class="p-2">ACTION</th></tr>
                    </thead>
                    <tbody id="tm-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="relative flex-1 flex flex-col">
        <div id="map"></div>
        
        <div id="collision-alert" class="hidden absolute top-6 left-1/2 -translate-x-1/2 z-[1000] bg-red-600 px-8 py-3 rounded-full orbitron font-black animate-bounce shadow-[0_0_30px_rgba(239,68,68,0.8)]">
            ⚠️ ATTENTION COLLISION : INTERVALLE < 2MIN
        </div>

        <div class="absolute bottom-6 left-6 z-[1000] flex gap-3">
            <button onclick="openTM()" class="px-6 py-3 bg-cyan-600/90 rounded-xl orbitron text-[10px] font-black shadow-lg hover:bg-cyan-500">
                📂 OUVRIR FENÊTRE TM
            </button>
        </div>
    </div>

    <div class="sidebar">
        <div class="p-6 border-b border-white/5 bg-slate-900/20">
            <h1 class="text-2xl font-black orbitron italic italic">IRIS <span class="text-cyan-500">T-PCC</span></h1>
            <p class="text-[8px] text-slate-500 uppercase mt-2 tracking-widest">Ligne 58 - Radar & Communication</p>
        </div>

        <div class="p-4 border-b border-white/5 bg-black/40">
            <p class="text-[9px] text-cyan-500 font-black uppercase mb-3 tracking-widest italic">📟 Canal de Communication Direct</p>
            <div class="space-y-2">
                <input type="text" id="msg-input" placeholder="Message au conducteur..." class="w-full bg-slate-900 border border-white/10 p-3 rounded-lg text-xs outline-none focus:border-cyan-500">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="sendMessage('Ralentissez')" class="bg-orange-500/20 text-orange-400 border border-orange-500/30 py-2 rounded text-[9px] font-bold">ORDRE RALENTIR</button>
                    <button onclick="sendMessage('Accélérez')" class="bg-green-500/20 text-green-400 border border-green-500/30 py-2 rounded text-[9px] font-bold">ORDRE ACCÉLÉRER</button>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="fleet-list">
            <p class="text-[9px] text-slate-600 font-black uppercase tracking-widest">Radar Flotte Active</p>
            </div>
    </div>

    <script>
        const map = L.map('map', {zoomControl: false}).setView([48.825, 2.325], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // 1. LOCALISATION DES CHAUFFEURS (Markers)
        let busMarkers = {};

        async function syncRadar() {
            try {
                const res = await fetch('web_stats.json'); // Ton moteur envoie les positions ici
                const data = await res.json();
                
                // Simulation de mise à jour des positions
                data.bus_positions.forEach(bus => {
                    if (busMarkers[bus.id]) {
                        busMarkers[bus.id].setLatLng([bus.lat, bus.lng]);
                    } else {
                        busMarkers[bus.id] = L.marker([bus.lat, bus.lng], {
                            icon: L.divIcon({className: 'bg-cyan-500 w-3 h-3 rounded-full border-2 border-white shadow-[0_0_10px_cyan]'})
                        }).addTo(map).bindTooltip(`TV ${bus.id} : ${bus.eid}m`, {permanent: true, direction: 'top', className: 'bus-label'});
                    }
                });
                
                checkCollision(data.bus_positions);
            } catch (e) { console.log("Radar en attente..."); }
        }

        // 2. FENÊTRE TM (Accès manuel)
        function openTM() { document.getElementById('tm-modal').style.display = 'flex'; loadTMData(); }
        function closeTM() { document.getElementById('tm-modal').style.display = 'none'; }

        async function loadTMData() {
            const res = await fetch('iris_master_data.json');
            const data = await res.json();
            const body = document.getElementById('tm-table-body');
            body.innerHTML = "";
            
            // On affiche les missions de la journée
            Object.keys(data.Semaine).slice(0, 10).forEach(tv => {
                const m = data.Semaine[tv];
                body.innerHTML += `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition-all">
                        <td class="p-2 font-bold text-cyan-400 italic">${tv}</td>
                        <td class="p-2 text-slate-400">${m.agent}</td>
                        <td class="p-2 text-white">${m.stops.CTL}</td>
                        <td class="p-2 text-white">${m.stops.VM}</td>
                        <td class="p-2"><button class="text-orange-500 underline uppercase text-[8px]">Éditer</button></td>
                    </tr>
                `;
            });
        }

        // 3. COMMUNICATION
        function sendMessage(type) {
            const msg = document.getElementById('msg-input').value || type;
            alert(`MESSAGE ENVOYÉ AU TERMINAL EMBARQUÉ : "${msg}"`);
            // Ici, tu peux lier à une base de données Firebase ou Supabase pour le chauffeur
        }

        // 4. ATTENTION COLLISION
        function checkCollision(positions) {
            const alertBox = document.getElementById('collision-alert');
            // Logique : si distance entre deux bus < X mètres ou Y minutes
            // On active l'alerte
            // alertBox.classList.remove('hidden');
        }

        setInterval(syncRadar, 3000); // Radar toutes les 3 secondes
        new L.GPX("moteur/95 VM CTL.gpx", { async: true, polyline_options: { color: '#06b6d4', opacity: 0.3 } }).addTo(map);
    </script>
</body>
</html>
