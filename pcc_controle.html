<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC RADAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; background: #010208; }
        .bus-label { 
            background: #06b6d4; color: black; font-weight: bold; 
            padding: 2px 8px; border-radius: 10px; border: 2px solid white;
            font-family: 'Orbitron', sans-serif; font-size: 10px;
        }
    </style>
</head>
<body class="bg-black text-white overflow-hidden">

    <div id="map"></div>

    <div class="fixed top-5 left-5 z-[1000] bg-black/80 p-4 rounded-2xl border border-cyan-500/30">
        <h1 class="text-cyan-400 font-bold tracking-tighter">PCC LIGNE 58</h1>
        <p id="bus-count" class="text-[10px] text-slate-400">0 BUS EN LIGNE</p>
    </div>

    <script>
        const map = L.map('map', {zoomControl: false}).setView([48.84, 2.32], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let markers = {}; // Stockage des marqueurs de bus

        async function refreshRadar() {
            try {
                const response = await fetch('https://angot.pythonanywhere.com/get_stats');
                const data = await response.json();
                const buses = data.bus_positions;

                document.getElementById('bus-count').innerText = `${buses.length} BUS EN LIGNE`;

                buses.forEach(bus => {
                    const pos = [bus.lat, bus.lng];

                    if (markers[bus.id]) {
                        // Mise à jour position
                        markers[bus.id].setLatLng(pos);
                    } else {
                        // Création du bus
                        const icon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div class="bus-label">P${bus.id}</div>`,
                            iconSize: [40, 20]
                        });
                        markers[bus.id] = L.marker(pos, {icon: icon}).addTo(map);
                    }
                });
            } catch (e) {
                console.error("Radar déconnecté");
            }
        }

        // Rafraîchir toutes les 2 secondes
        setInterval(refreshRadar, 2000);
    </script>
</body>
</html>
