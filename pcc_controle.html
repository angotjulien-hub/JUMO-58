<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC SMART REGULATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains+Mono', monospace; background: #020617; margin: 0; overflow: hidden; }
        #map { height: 100vh; width: 100vw; filter: saturate(0.8) brightness(0.8); }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(6, 182, 212, 0.2); color: white; }
        .bus-marker { background: #0ea5e9; color: white; border: 2px solid #fff; padding: 2px 6px; border-radius: 4px; font-weight: 800; font-size: 10px; box-shadow: 0 0 10px rgba(14, 165, 233, 0.5); }
        .status-advance { color: #ef4444; text-shadow: 0 0 5px rgba(239, 68, 68, 0.5); } /* Rouge: Avance (Danger) */
        .status-delay { color: #f59e0b; } /* Orange: Retard */
        .status-ontime { color: #22c55e; } /* Vert: À l'heure */
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="fixed top-6 left-6 z-[1000] pointer-events-none">
        <div class="glass p-6 rounded-2xl border-l-4 border-cyan-500 w-80 shadow-2xl">
            <h1 class="text-xl font-bold font-[Orbitron] tracking-tighter text-cyan-400">IRIS COMMAND</h1>
            <p class="text-[9px] text-slate-400 uppercase tracking-[0.3em] mb-4">Ligne 58 | Monitoring Flux</p>
            <div id="global-metrics" class="grid grid-cols-2 gap-4 border-t border-slate-700 pt-4">
                <div>
                    <p class="text-[8px] text-slate-500 uppercase">Bus en ligne</p>
                    <p id="total-bus" class="text-lg font-bold text-white">0</p>
                </div>
                <div>
                    <p class="text-[8px] text-slate-500 uppercase">Alertes</p>
                    <p id="total-alerts" class="text-lg font-bold text-red-500">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed top-6 right-6 z-[1000] glass p-4 rounded-2xl border-t-2 border-cyan-500 w-96 pointer-events-auto shadow-2xl max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
            <h2 class="text-xs font-[Orbitron] text-cyan-400">TABLEAU DE RÉGULATION</h2>
            <span class="text-[8px] bg-cyan-900/50 px-2 py-1 rounded border border-cyan-500/30">LIVE GPS</span>
        </div>
        <div id="tr-console" class="space-y-4 overflow-y-auto pr-2">
            </div>
    </div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([48.8400, 2.3200], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // Données théoriques (Temps de parcours total estimé : 40 min)
        const TOTAL_TRAVEL_TIME_MIN = 40; 

        let markers = {};

        // Fonction pour calculer l'écart théorique
        function calculateGap(speed, pos) {
            // Simulation d'écart basée sur la vitesse et la position
            // Dans une version finale, on comparerait à l'heure de passage du PDF
            if (speed > 40) return { min: -3, label: "AVANCE", class: "status-advance" };
            if (speed < 10) return { min: 5, label: "RETARD", class: "status-delay" };
            return { min: 0, label: "À L'HEURE", class: "status-ontime" };
        }

        async function refresh() {
            try {
                const res = await fetch('https://angot.pythonanywhere.com/get_stats');
                const data = await res.json();
                const buses = data.bus_positions || [];
                
                document.getElementById('total-bus').innerText = buses.length;
                const consoleEl = document.getElementById('tr-console');
                consoleEl.innerHTML = "";
                let alerts = 0;

                buses.forEach(bus => {
                    const speed = bus.speed || 0;
                    const pos = [parseFloat(bus.lat), parseFloat(bus.lng || bus.lon)];
                    const gap = calculateGap(speed, pos);
                    if (gap.min !== 0) alerts++;

                    // Mise à jour Marker
                    if (!markers[bus.id]) {
                        markers[bus.id] = L.marker(pos, {
                            icon: L.divIcon({className:'custom', html:`<div class="bus-marker">P${bus.id}</div>`})
                        }).addTo(map);
                    } else {
                        markers[bus.id].setLatLng(pos);
                    }

                    // Carte de Régulation
                    consoleEl.innerHTML += `
                        <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-800 hover:border-cyan-500/50 transition-all">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="text-sm font-bold text-white">UNITÉ P${bus.id}</h3>
                                    <p class="text-[9px] text-slate-500 font-mono italic">ID_DEV: ${bus.id}0058</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] font-black ${gap.class}">${gap.label}</p>
                                    <p class="text-[9px] text-slate-400">${gap.min === 0 ? '--' : Math.abs(gap.min) + ' MIN'}</p>
                                </div>
                            </div>
                            
                            <div class="flex gap-2 mt-4">
                                <button onclick="sendMsg('STOP', ${bus.id})" class="flex-1 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-500 py-2 rounded-lg text-[9px] font-black uppercase">Réguler</button>
                                <button onclick="sendMsg('GO', ${bus.id})" class="flex-1 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 py-2 rounded-lg text-[9px] font-black uppercase">Relancer</button>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('total-alerts').innerText = alerts;
            } catch (e) {}
        }

        async function sendMsg(type, id) {
            console.log(`Commande ${type} envoyée au bus ${id}`);
            // Intégration API send_msg ici
        }

        setInterval(refresh, 2000);
        refresh();
    </script>
</body>
</html>
