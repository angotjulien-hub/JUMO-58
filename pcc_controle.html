<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC MASTER & IDFM DATA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; }
        #map { flex: 1; height: 100%; filter: grayscale(1) invert(0.92) contrast(1.2) brightness(0.9); }
        .sidebar { width: 450px; background: #050505; border-left: 2px solid #1e293b; display: flex; flex-direction: column; z-index: 1001; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Animation pour les suggestions IRIS */
        .iris-suggestion {
            border: 2px solid #06b6d4;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #06b6d4; }
            50% { border-color: #ef4444; }
            100% { border-color: #06b6d4; }
        }

        .bus-marker { 
            width: 22px; height: 22px; background: #06b6d4; border: 3px solid white; 
            border-radius: 4px; transform: rotate(45deg); box-shadow: 0 0 15px #06b6d4;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="flex">

    <div class="relative flex-1 flex flex-col">
        <div id="map"></div>
        
        <div class="absolute top-6 left-6 z-[1000]">
            <div class="glass p-5 rounded-2xl shadow-2xl w-80">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[10px] font-black text-cyan-400 uppercase tracking-widest italic">Analyseur d'Intervalle (EID)</h3>
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                </div>
                <table class="text-[11px] w-full mono">
                    <thead>
                        <tr class="text-slate-500 border-b border-slate-800">
                            <th class="text-left pb-2">UNIT</th>
                            <th class="text-center pb-2">STATUT</th>
                            <th class="text-right pb-2">GAP</th>
                        </tr>
                    </thead>
                    <tbody id="tm-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="iris-alert-zone" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-[1000] w-[500px] pointer-events-none">
            </div>
    </div>

    <div class="sidebar">
        <div class="p-8 bg-slate-900/40 border-b border-white/5">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-black text-white italic orbitron tracking-tighter">IRIS <span class="text-cyan-400">58</span></h1>
                <div class="text-right">
                    <div id="clock" class="text-lg font-bold mono">00:00:00</div>
                    <span class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Secteur: Montparnasse / Vanves</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-px bg-white/5 border-b border-white/5">
            <div class="p-6 bg-[#050505]">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">KM Produits (IDFM)</p>
                <p id="km-total" class="text-2xl font-black orbitron text-cyan-400">0.00</p>
            </div>
            <div class="p-6 bg-[#050505]">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">KM Perdus (Sanction)</p>
                <p id="km-lost" class="text-2xl font-black orbitron text-red-500">0.00</p>
            </div>
        </div>

        <div class="p-6 border-b border-white/5 bg-slate-900/20">
            <div class="space-y-4">
                <select id="target-bus" class="w-full bg-slate-800/50 border border-white/10 p-3 rounded-xl text-xs font-bold outline-none focus:border-cyan-500 transition-all text-white">
                    <option value="ALL">DIFFUSION GÉNÉRALE (TOUS)</option>
                </select>
                
                <div class="relative">
                    <textarea id="msg-text" placeholder="Saisir ordre de mission..." class="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-xs mono h-24 outline-none focus:border-cyan-500 transition-all resize-none text-cyan-100"></textarea>
                    <div class="absolute bottom-2 right-3 text-[8px] text-slate-600 font-bold uppercase">IRIS Link Active</div>
                </div>

                <div class="flex gap-2">
                    <button onclick="executeOrder('RETOURNEMENT')" class="flex-1 bg-red-600/10 text-red-500 border border-red-500/20 py-4 rounded-xl font-black text-[10px] uppercase hover:bg-red-600 hover:text-white transition-all shadow-lg shadow-red-600/5">Forcer Rebroussement</button>
                    <button onclick="sendFreeMsg()" class="flex-1 bg-cyan-600 py-4 rounded-xl font-black text-[10px] uppercase shadow-lg shadow-cyan-600/30 hover:bg-cyan-500 transition-all">Transmettre Message</button>
                </div>
            </div>
        </div>

        <div id="bus-list" class="flex-1 overflow-y-auto p-4 space-y-2 bg-[#030303]">
            </div>

        <div class="p-4 bg-black border-t border-white/5 font-mono text-[9px] text-slate-600 h-32 overflow-y-auto" id="logs">
            <div>> IRIS_V6_CORE BOOT SEQUENCE COMPLETED.</div>
            <div>> IDFM_CONTRACT_DATA_LINKED.</div>
        </div>
    </div>

    <script>
        let map, fleet = {};
        let kmTotal = 0, kmPerdus = 0;
        const KM_PENALITE = 4.2; // Km moyen d'un demi-tour ligne 58

        function init() {
            // Horloge
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR'); }, 1000);

            // Carte
            map = L.map('map', {zoomControl:false}).setView([48.840, 2.320], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            // PeerJS
            const peer = new Peer('IRIS-PCC-58-GLOBAL');
            peer.on('connection', conn => {
                conn.on('data', d => { if(d.type === 'pos') updateBus(d, conn); });
            });

            // Analyse IA IRIS toutes les 5 secondes
            setInterval(irisAIEngine, 5000);
        }

        function updateBus(d, conn) {
            const id = d.pol;
            if(!fleet[id]) {
                addLog(`NOUVEAU CONTACT : POLICE ${id}`, 'text-cyan-400');
                fleet[id] = {
                    marker: L.marker([d.lat, d.lon], { icon: L.divIcon({html:'<div class="bus-marker"></div>', className:''}) }).addTo(map),
                    lastPos: [d.lat, d.lon],
                    pol: id
                };
                updateSelect();
            }

            // Calcul KM IDFM
            let dist = map.distance(fleet[id].lastPos, [d.lat, d.lon]) / 1000;
            if(dist > 0.005) {
                kmTotal += dist;
                document.getElementById('km-total').innerText = kmTotal.toFixed(2);
            }

            fleet[id].marker.setLatLng([d.lat, d.lon]);
            fleet[id].lastPos = [d.lat, d.lon];
            fleet[id].conn = conn;
            fleet[id].lastUpdate = Date.now();

            refreshUI(id);
        }

        function refreshUI(id) {
            // Mise à jour Tableau de Marche
            let row = document.getElementById(`tm-${id}`);
            if(!row) {
                row = document.createElement('tr'); row.id = `tm-${id}`;
                row.className = "border-b border-white/5";
                document.getElementById('tm-body').appendChild(row);
            }
            row.innerHTML = `<td class="py-2 font-bold text-white uppercase italic">P${id}</td>
                             <td class="text-center text-slate-500 font-bold">NORMAL</td>
                             <td class="text-right text-cyan-400 font-bold">+01'</td>`;

            // Mise à jour Sidebar Strip
            let strip = document.getElementById(`strip-${id}`);
            if(!strip) {
                strip = document.createElement('div'); strip.id = `strip-${id}`;
                strip.className = "bg-white/5 border border-white/5 p-4 rounded-xl flex justify-between items-center transition-all";
                document.getElementById('bus-list').appendChild(strip);
            }
            strip.innerHTML = `<div>
                                 <div class="text-[10px] text-slate-500 font-black uppercase">Unit ID</div>
                                 <div class="text-lg font-black orbitron italic text-white">${id}</div>
                               </div>
                               <div class="text-right">
                                 <div class="text-[8px] text-cyan-500 font-bold uppercase mb-1">Signal Stable</div>
                                 <div class="w-12 h-1 bg-cyan-900 rounded-full overflow-hidden">
                                     <div class="h-full bg-cyan-400" style="width: 80%"></div>
                                 </div>
                               </div>`;
        }

        // L'IA DE RÉGULATION (CORE)
        function irisAIEngine() {
            const ids = Object.keys(fleet);
            if(ids.length < 2) return;

            for(let i=0; i<ids.length; i++) {
                for(let j=i+1; j<ids.length; j++) {
                    const b1 = fleet[ids[i]], b2 = fleet[ids[j]];
                    const dist = map.distance(b1.lastPos, b2.lastPos);

                    if(dist < 350) { // Risque de couplage
                        showIrisSuggestion(ids[i], ids[j], "COUPLAGE IMMINENT");
                    }
                }
            }
        }

        function showIrisSuggestion(p1, p2, motif) {
            const zone = document.getElementById('iris-alert-zone');
            if(document.getElementById(`suggest-${p1}`)) return;

            const div = document.createElement('div');
            div.id = `suggest-${p1}`;
            div.className = "iris-suggestion glass p-6 rounded-2xl mb-4 pointer-events-auto cursor-pointer translate-y-0 opacity-100 transition-all";
            div.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="bg-red-600 p-3 rounded-lg animate-pulse">⚠️</div>
                    <div class="flex-1">
                        <h4 class="text-xs font-black text-white uppercase">${motif} : P${p1} / P${p2}</h4>
                        <p class="text-[10px] text-slate-400 font-mono mt-1">L'IA préconise un rebroussage du bus P${p1} pour restaurer l'EID.</p>
                    </div>
                    <button onclick="applyIrisOrder('${p1}')" class="bg-cyan-500 text-black px-4 py-2 rounded-lg font-black text-[10px] hover:bg-white transition-all">APPLIQUER</button>
                </div>
            `;
            zone.appendChild(div);
        }

        function applyIrisOrder(id) {
            executeOrder('RETOURNEMENT', id);
            document.getElementById(`suggest-${id}`).remove();
        }

        function executeOrder(type, forcedId = null) {
            const target = forcedId || document.getElementById('target-bus').value;
            if(target === "ALL") return alert("Cible spécifique requise.");

            fleet[target].conn.send({type: type});
            kmPerdus += KM_PENALITE;
            document.getElementById('km-lost').innerText = kmPerdus.toFixed(2);
            addLog(`ORDRE EXÉCUTÉ : ${type} -> P${target} (-${KM_PENALITE}km IDFM)`, 'text-red-500 font-bold');
        }

        function sendFreeMsg() {
            const txt = document.getElementById('msg-text').value;
            const target = document.getElementById('target-bus').value;
            if(!txt) return;

            if(target === "ALL") {
                Object.values(fleet).forEach(b => b.conn.send({type:'msg', content: txt}));
                addLog(`BROADCAST : "${txt}"`, 'text-cyan-500');
            } else {
                fleet[target].conn.send({type:'msg', content: txt});
                addLog(`MESSAGE PRIVÉ P${target} : "${txt}"`);
            }
            document.getElementById('msg-text').value = '';
        }

        function updateSelect() {
            const sel = document.getElementById('target-bus');
            sel.innerHTML = '<option value="ALL">DIFFUSION GÉNÉRALE (TOUS)</option>';
            Object.keys(fleet).forEach(id => {
                const o = document.createElement('option'); o.value = id; o.innerText = `BUS POLICE ${id}`;
                sel.appendChild(o);
            });
        }

        function addLog(m, c='') {
            const l = document.getElementById('logs');
            l.innerHTML = `<div class="${c}">[${new Date().toLocaleTimeString()}] ${m}</div>` + l.innerHTML;
        }

        window.onload = init;
    </script>
</body>
</html>
