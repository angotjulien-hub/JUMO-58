<!DOCTYPE html>
<html>
<head>
    <title>JUMO PERF - PCC Ligne 58</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-black text-[#00f2ff] font-mono p-5">
    <div class="grid grid-cols-4 gap-4">
        <div class="col-span-1 border border-[#00f2ff] p-4 bg-slate-900">
            <h1 class="text-xl font-black mb-4 underline">JUMO PERF v3.5</h1>
            
            <button onclick="downloadLogs()" class="w-full mb-4 bg-slate-800 border border-slate-700 text-[#00f2ff] text-xs font-black py-3 hover:bg-[#00f2ff] hover:text-black transition-all uppercase tracking-tighter">
                <i class="fas fa-file-download mr-2"></i> Extraire Logs Performance
            </button>

            <div id="bus-list" class="space-y-2 text-[10px]">
                </div>
        </div>

        <div class="col-span-3 border border-[#00f2ff] h-[80vh] relative overflow-hidden bg-[url('https://cartocdn-gusc.global.ssl.fastly.net/base-dark/{z}/{x}/{y}.png')]">
            <div id="map-container" class="absolute inset-0"></div>
        </div>
    </div>

    <script>
        const checkpoints = {
            "VANVES": { lat: 48.8212, lng: 2.2870, time: "05:30" },
            "MONTPARNASSE": { lat: 48.8380, lng: 2.3182, time: "05:52" },
            "CHATELET": { lat: 48.8580, lng: 2.3475, time: "06:18" }
        };

        let lastLogged = {};

        async function refreshPCC() {
            try {
                const res = await fetch('https://votre-pseudo.pythonanywhere.com/get_stats');
                const data = await res.json();
                const container = document.getElementById('bus-list');
                container.innerHTML = "";

                data.bus_positions.forEach(bus => {
                    let status = "NOMINAL";
                    let color = "text-[#00f2ff]";
                    
                    // Calcul de la performance
                    for (let p in checkpoints) {
                        let dist = Math.hypot(bus.lat - checkpoints[p].lat, bus.lng - checkpoints[p].lng);
                        if (dist < 0.002) { // Proche d'un arrêt
                            let now = new Date();
                            let [thH, thM] = checkpoints[p].time.split(':').map(Number);
                            let diff = (now.getHours()*60 + now.getMinutes()) - (thH*60 + thM);
                            
                            if (diff > 2) { status = `RETARD +${diff}m`; color = "text-red-500"; }
                            if (diff < -1) { status = `AVANCE ${diff}m`; color = "text-yellow-500"; }
                            
                            // Log automatique vers le serveur
                            if (!lastLogged[`${bus.id}-${p}`]) {
                                fetch('https://votre-pseudo.pythonanywhere.com/log_perf', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({ bus_id: bus.id, point: p, delay: diff })
                                });
                                lastLogged[`${bus.id}-${p}`] = true;
                            }
                        }
                    }

                    container.innerHTML += `
                        <div class="p-2 border border-slate-700 bg-slate-800 ${color}">
                            BUS ${bus.id} | ${status} | ${bus.speed}km/h
                        </div>`;
                });
            } catch(e) {}
        }

        async function downloadLogs() {
            const res = await fetch('https://votre-pseudo.pythonanywhere.com/get_logs');
            const logs = await res.json();
            let csv = "Date,Bus,Point,Ecart\n" + logs.map(l => `${l.timestamp},${l.bus_id},${l.point},${l.delay}`).join("\n");
            window.open("data:text/csv;charset=utf-8," + encodeURI(csv));
        }

        setInterval(refreshPCC, 2000);
    </script>
</body>
</html>
