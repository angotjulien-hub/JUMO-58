<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRIS PRO V6.1 - Ligne 58</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { background: #000; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(20, 20, 20, 0.98); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Carte en arrière-plan absolu */
        #map { position: absolute; inset: 0; z-index: 1; background: #111; filter: grayscale(1) invert(0.92) contrast(1.1); }
        
        /* Layer UI : Toujours visible et cliquable */
        .ui-layer { position: absolute; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; padding: 20px; }
        .interactive { pointer-events: auto !important; }

        /* Menus tiroirs : Priorité Maximale */
        .drawer { position: fixed; inset: 0; background: rgba(0,0,0,0.98); transform: translateY(100%); transition: transform 0.4s ease-out; z-index: 9999; }
        .drawer.open { transform: translateY(0); }
        
        .btn-sig { @apply glass p-6 rounded-[30px] border-white/5 active:scale-95 transition-all flex flex-col items-center justify-center; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-layer">
        
        <div class="flex justify-between items-start">
            <div class="flex flex-col gap-3 interactive">
                <div class="flex gap-3">
                    <div class="bg-[#FFD700] text-black px-6 py-2 text-4xl font-black rounded-2xl orbitron">58</div>
                    <div class="flex flex-col">
                        <span id="mission-id" class="text-xl font-black italic uppercase text-cyan-400">Marche --</span>
                        <span class="text-[8px] font-bold text-zinc-500 tracking-widest uppercase">Système IRIS Actif</span>
                    </div>
                </div>
                <button onclick="toggleDrawer('mission-picker')" class="bg-cyan-500 text-black font-black text-[9px] py-2 px-4 rounded-xl uppercase tracking-widest shadow-lg shadow-cyan-500/20">
                    SÉLECTIONNER MARCHE
                </button>
            </div>

            <button onclick="toggleDrawer('tm-menu')" class="glass px-6 py-4 rounded-[25px] border-b-4 border-cyan-500 interactive">
                <p class="orbitron text-[10px] font-black text-cyan-400">TABLEAU DE MARCHE</p>
                <p id="clock" class="text-xs font-bold text-white mt-1 text-center">--:--:--</p>
            </button>
        </div>

        <div class="flex-1 flex items-center justify-center">
            <div onclick="nextStation()" class="glass w-full max-w-xl p-10 rounded-[50px] border-t-4 border-cyan-500 text-center interactive shadow-2xl active:scale-95 transition-all">
                <div class="flex justify-between items-center mb-6">
                    <p id="radar-id-display" class="orbitron text-xl text-zinc-500">RADAR</p>
                    <div class="text-right">
                        <p class="text-[8px] text-cyan-500 font-black uppercase">Départ Théorique</p>
                        <p id="theoretical-time" class="orbitron text-3xl text-white font-black">--:--</p>
                    </div>
                </div>
                <h1 id="stop-name" class="text-3xl font-black italic uppercase leading-tight mb-8">EN ATTENTE DE MISSION...</h1>
                <div class="w-full h-2 bg-white/5 rounded-full overflow-hidden">
                    <div id="progress" class="h-full bg-cyan-400 shadow-[0_0_15px_#22d3ee] transition-all" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end">
            <button onclick="toggleDrawer('sig-menu')" class="bg-red-600 text-white font-black text-xs py-5 px-8 rounded-3xl shadow-lg shadow-red-600/20 uppercase interactive active:scale-95">
                ⚠️ SIGNALER
            </button>
            
            <div class="glass p-8 rounded-[45px] text-center min-w-[150px] interactive">
                <span id="speed" class="text-6xl font-black orbitron italic">00</span>
                <p class="text-[10px] text-zinc-500 font-black uppercase mt-2">km/h</p>
            </div>
        </div>
    </div>

    <div id="mission-picker" class="drawer flex flex-col p-8">
        <div class="w-20 h-2 bg-zinc-800 rounded-full mx-auto mb-10 interactive" onclick="toggleDrawer('mission-picker')"></div>
        <h2 class="text-3xl font-black orbitron text-center mb-10">CHOIX DE LA MARCHE</h2>
        <div class="space-y-4 overflow-y-auto interactive">
            <button onclick="selectMission('44454788', '1')" class="w-full glass p-6 rounded-3xl text-left border-cyan-500/20">
                <p class="orbitron text-cyan-400 font-bold">MARCHE 44454788 (Agent 1)</p>
                <p class="text-xs text-zinc-500 mt-1">Départ CTL : 07:00 | Châtelet -> Vanves</p>
            </button>
            <button onclick="selectMission('44454752', '9')" class="w-full glass p-6 rounded-3xl text-left border-zinc-500/20">
                <p class="orbitron text-cyan-400 font-bold">MARCHE 44454752 (Agent 9)</p>
                <p class="text-xs text-zinc-500 mt-1">Départ CTL : 22:15 | Châtelet -> Vanves</p>
            </button>
            <button onclick="toggleDrawer('mission-picker')" class="w-full p-6 text-zinc-500 font-bold uppercase">Fermer</button>
        </div>
    </div>

    <div id="sig-menu" class="drawer flex flex-col p-8">
        <div class="w-20 h-2 bg-zinc-800 rounded-full mx-auto mb-10 interactive" onclick="toggleDrawer('sig-menu')"></div>
        <h2 class="text-3xl font-black orbitron text-red-500 text-center mb-10 italic">SIGNALISATION</h2>
        <div class="grid grid-cols-2 gap-4 interactive pb-10">
            <button onclick="sendSig('MALAISE')" class="btn-sig border-red-500/30 text-red-500"><span class="text-3xl mb-2">🚨</span>MALAISE</button>
            <button onclick="sendSig('TRAFIC')" class="btn-sig border-yellow-500/30 text-yellow-500"><span class="text-3xl mb-2">🚧</span>TRAFIC</button>
            <button onclick="sendSig('ACCIDENT')" class="btn-sig border-orange-500/30 text-orange-500"><span class="text-3xl mb-2">🚗</span>ACCIDENT</button>
            <button onclick="toggleDrawer('sig-menu')" class="btn-sig border-white/10 text-white">RETOUR</button>
        </div>
    </div>

    <div id="tm-menu" class="drawer flex flex-col p-8">
        <div class="w-20 h-2 bg-zinc-800 rounded-full mx-auto mb-10 interactive" onclick="toggleDrawer('tm-menu')"></div>
        <div id="tm-list" class="space-y-4 overflow-y-auto interactive pr-2"></div>
    </div>

    <script>
        // Données horaires issues de tes fichiers RATP
        const DATA = {
            "44454788": [
                { id: "CTL", name: "CHÂTELET", time: "07:00", lat: 48.858, lon: 2.347 },
                { id: "GA", name: "QUAI DES GRANDS AUGUSTINS", time: "07:00", lat: 48.854, lon: 2.342 },
                { id: "LUX", name: "LUXEMBOURG", time: "07:04", lat: 48.846, lon: 2.337 },
                { id: "18J", name: "18 JUIN 1940", time: "07:09", lat: 48.842, lon: 2.323 },
                { id: "AL", name: "ALÉSIA", time: "07:14", lat: 48.828, lon: 2.327 },
                { id: "CHN", name: "CHÂTILLON-MONTROUGE", time: "07:23", lat: 48.811, lon: 2.301 },
                { id: "VM", name: "VANVES-MICHELET", time: "07:33", lat: 48.821, lon: 2.290 }
            ]
        };

        let map, userMarker, currentMission = null, currentIndex = 0;

        function init() {
            // Initialisation de la carte avec sécurité si Leaflet échoue
            try {
                map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.84, 2.32], 13);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
                userMarker = L.circleMarker([0,0], {radius: 8, color: '#fff', fillColor: '#22d3ee', fillOpacity: 1, weight: 3}).addTo(map);
            } catch(e) { console.error("Carte non chargée"); }
            
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR'); }, 1000);
            updateGeo();
        }

        function toggleDrawer(id) { document.getElementById(id).classList.toggle('open'); }

        function selectMission(tv, agent) {
            currentMission = DATA[tv] || DATA["44454788"];
            currentIndex = 0;
            document.getElementById('mission-id').innerText = `TV ${tv} / Agent ${agent}`;
            toggleDrawer('mission-picker');
            updateDisplay();
        }

        function updateDisplay() {
            if(!currentMission) return;
            const r = currentMission[currentIndex];
            document.getElementById('stop-name').innerText = r.name;
            document.getElementById('radar-id-display').innerText = r.id;
            document.getElementById('theoretical-time').innerText = r.time;
            document.getElementById('progress').style.width = (currentIndex / (currentMission.length - 1)) * 100 + "%";
            
            const list = document.getElementById('tm-list');
            list.innerHTML = currentMission.map((s, i) => `
                <div class="flex justify-between items-center py-5 border-b border-white/5 ${i < currentIndex ? 'opacity-20' : ''}">
                    <div><p class="text-xs text-cyan-500 orbitron">${s.id}</p><p class="text-xl font-bold uppercase italic ${i === currentIndex ? 'text-cyan-400' : ''}">${s.name}</p></div>
                    <p class="orbitron font-bold text-xl">${s.time}</p>
                </div>
            `).join('');
        }

        function nextStation() {
            if(currentMission && currentIndex < currentMission.length - 1) { currentIndex++; updateDisplay(); }
        }

        function updateGeo() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    document.getElementById('speed').innerText = Math.round((pos.coords.speed || 0) * 3.6).toString().padStart(2, '0');
                    if(map && userMarker) {
                        userMarker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
                        map.panTo([pos.coords.latitude, pos.coords.longitude]);
                    }
                }, null, { enableHighAccuracy: true });
            }
        }

        function sendSig(t) { alert("SIGNALEMENT ENVOYÉ : " + t); toggleDrawer('sig-menu'); }

        window.onload = init;
    </script>
</body>
</html>
