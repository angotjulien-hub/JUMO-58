<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC STRATÉGIQUE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --iris-blue: #00f2ff; --iris-orange: #ffae00; --iris-bg: #050505; }
        body { margin: 0; background: var(--iris-bg); font-family: 'Orbitron', sans-serif; color: white; overflow: hidden; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.4) contrast(1.2); }
        .glass-panel { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 255, 0.1); }
        .sidebar { position: absolute; top: 20px; left: 20px; z-index: 1000; width: 350px; bottom: 20px; display: flex; flex-direction: column; }
        .kpi-panel { position: absolute; top: 20px; right: 20px; z-index: 1000; width: 300px; }
        .bus-hex { width: 20px; height: 12px; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); transition: all 0.3s; }
    </style>
</head>
<body>
    <div class="sidebar glass-panel p-4">
        <h1 class="text-xl font-bold border-b border-cyan-900 pb-2 mb-4">IRIS HUB 58</h1>
        <div id="fleet-status" class="space-y-4">
            <h2 class="text-[10px] text-zinc-500 uppercase tracking-widest">État de la Flotte</h2>
            <div id="bus-list" class="text-[11px] space-y-2"></div>
        </div>
        <div id="console" class="mt-auto h-32 bg-black/50 text-[9px] p-2 font-mono text-cyan-400 overflow-y-auto"></div>
    </div>

    <div class="kpi-panel glass-panel p-4">
        <h2 class="text-xs font-bold mb-3 uppercase border-b border-zinc-800 pb-2 text-center">Audit Contrat IDFM</h2>
        <div class="grid grid-cols-2 gap-2 text-center">
            <div class="bg-zinc-900 p-2"><div class="text-[8px] text-zinc-500">KM RÉELS</div><div id="km-reel" class="text-cyan-400 font-bold">0.0</div></div>
            <div class="bg-zinc-900 p-2"><div class="text-[8px] text-zinc-500">KM PERDUS</div><div id="km-perdu" class="text-red-500 font-bold">0.0</div></div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        let map, fleet = {};
        const PCC_ID = 'IRIS-PCC-58-GLOBAL';

        function init() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.838, 2.318], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            const peer = new Peer(PCC_ID);
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'position') {
                        fleet[data.id] = { ...data, lastUpdate: Date.now(), connection: conn };
                        updateUI(data);
                        calculerEtDiffuserIntervalles();
                    }
                });
            });
        }

        function calculerEtDiffuserIntervalles() {
            const busArray = Object.values(fleet).sort((a, b) => b.lat - a.lat);
            busArray.forEach((bus, i) => {
                let prev = "--", next = "--";
                if (i > 0) prev = Math.round(map.distance([bus.lat, bus.lon], [busArray[i-1].lat, busArray[i-1].lon]) / 250);
                if (i < busArray.length - 1) next = Math.round(map.distance([bus.lat, bus.lon], [busArray[i+1].lat, busArray[i+1].lon]) / 250);
                
                if (bus.connection.open) {
                    bus.connection.send({ type: 'intervals', prev, next });
                }
            });
        }

        function updateUI(d) {
            const color = d.status ? '#ffae00' : '#00f2ff';
            if (!fleet[d.id].marker) {
                fleet[d.id].marker = L.marker([d.lat, d.lon], { 
                    icon: L.divIcon({ className: '', html: `<div class="bus-hex" style="background:${color}"></div>` }) 
                }).addTo(map).bindTooltip(d.id, {permanent: true, direction: 'right', className: 'bg-transparent border-0 text-white text-[8px]'});
            } else {
                fleet[d.id].marker.setLatLng([d.lat, d.lon]);
                fleet[d.id].marker.setIcon(L.divIcon({ className: '', html: `<div class="bus-hex" style="background:${color}"></div>` }));
            }
        }

        window.onload = init;
    </script>
</body>
</html>
