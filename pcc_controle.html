<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS PCC ULTIMATE | Ligne 58</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: #0a0c15; color: white; margin: 0; height: 100vh; overflow: hidden; font-family: sans-serif; }
        .pcc-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 400px; background: #0f172a; border-right: 1px solid #00f2ff33; display: flex; flex-direction: column; }
        
        /* Correction Affichage Carte */
        #map { 
            flex: 1; 
            height: 100% !important; 
            width: 100% !important; 
            background: #111; /* Fond de secours */
        }

        .bus-marker {
            background: #000; border: 2px solid #00f2ff; color: #00f2ff;
            padding: 2px 5px; font-weight: bold; font-size: 10px; border-radius: 4px;
            white-space: nowrap; box-shadow: 0 0 10px rgba(0,242,255,0.5);
        }
    </style>
</head>
<body>
<div class="pcc-container">
    <div class="sidebar">
        <div class="p-4 border-b border-cyan-500/20">
            <h1 class="text-xl font-bold text-cyan-400">IRIS PCC <span class="text-white">58</span></h1>
            <p class="text-[10px] text-slate-400 uppercase">Contrôle RATP - Janvier 2026</p>
        </div>
        <div id="fleetList" class="flex-1 overflow-y-auto p-4 space-y-2">
            </div>
        <div class="p-4 bg-black/50 border-t border-cyan-500/20">
            <button onclick="location.reload()" class="w-full bg-cyan-600 py-2 rounded font-bold text-xs text-black">RECHARGER CARTE</button>
        </div>
    </div>
    <div id="map"></div>
</div>

<script>
    // 1. Initialisation de la carte avec sécurité
    var map = L.map('map', { zoomControl: true }).setView([48.840, 2.318], 13);

    // 2. Utilisation du serveur OpenStreetMap (Plus fiable)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 3. Simuler les bus
    const buses = [
        {id: "58001", lat: 48.857, lng: 2.348, status: "OK"},
        {id: "58004", lat: 48.838, lng: 2.318, status: "RETARD"}
    ];

    buses.forEach(bus => {
        var icon = L.divIcon({ 
            html: `<div class="bus-marker">${bus.id}</div>`,
            className: ''
        });
        L.marker([bus.lat, bus.lng], {icon: icon}).addTo(map)
         .bindPopup(`Bus ${bus.id} - Statut: ${bus.status}`);
    });

    // Forcer le rendu si la carte est grise au départ
    setTimeout(() => { map.invalidateSize(); }, 500);
</script>
</body>
</html>
