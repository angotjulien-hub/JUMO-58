<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS | MISSION CONTROL CENTER</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --nasa-blue: #0052ff; 
            --neon-cyan: #00f2ff; 
            --warning-gold: #ff9d00;
            --danger-red: #ff003c; 
            --bg-black: #05070a; 
            --panel-glass: rgba(13, 17, 23, 0.95);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg-black); 
            font-family: 'Inter', sans-serif; 
            color: white; 
            overflow: hidden; 
        }

        /* --- HEADER NASA HUD --- */
        .hud-top { 
            height: 65px; background: rgba(0, 0, 0, 0.9); 
            border-bottom: 2px solid var(--nasa-blue); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 30px; box-shadow: 0 4px 20px rgba(0, 82, 255, 0.2); 
            z-index: 100;
        }
        .logo-box { font-family: 'Orbitron', sans-serif; letter-spacing: 4px; font-size: 1.6rem; }
        .logo-box b { color: var(--nasa-blue); }

        .telemetry-box { display: flex; gap: 40px; font-family: 'Orbitron', sans-serif; }
        .telemetry-item { text-align: right; }
        .telemetry-label { font-size: 0.6rem; color: #4b5563; display: block; }
        .telemetry-value { color: var(--neon-cyan); font-size: 1.1rem; }

        /* --- MAIN VIEWPORT --- */
        .viewport { display: flex; height: calc(100vh - 65px); }

        /* --- SIDEBAR FLEET MONITOR --- */
        .fleet-monitor { 
            width: 400px; background: var(--panel-glass); 
            border-right: 1px solid #1f2937; 
            display: flex; flex-direction: column; 
            box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 50;
        }
