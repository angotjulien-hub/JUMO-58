<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - FULL TACTICAL PCC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { background: #010208; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; margin: 0; }
        #map { flex: 1; filter: grayscale(1) invert(0.95) contrast(1.1) brightness(0.8) hue-rotate(195deg); }
        .sidebar { width: 420px; background: #05070a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 1001; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Tooltip style */
        .bus-label { background: rgba(15, 23, 42, 0.9); border: 1px solid #06b6d4; color: white; font-family: 'Orbitron'; font-size: 9px; border-radius: 4px; }

        /* Fenêtre TM Modale */
        #tm-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
        .tm-container { background: #0f172a; border: 1px solid #06b6d4; padding: 30px; border-radius: 20px; width: 80%; max-width: 900px; }

        /* Animation Couplage / Danger */
        .alert-flash { animation: bg-red-flash 0.8s infinite alternate; }
        @keyframes bg-red-flash { from { background: rgba(220, 38, 38, 0.2); } to { background: rgba(220, 38, 38, 0.7); } }
    </style>
</head>
<body class="flex">

    <div id="tm-modal">
        <div class="tm-container shadow-[0_0_50px_rgba(6,182,212,0.2)]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="orbitron text-xl text-cyan-400 italic tracking-tighter">ÉDITION STRATÉGIQUE DU TABLEAU DE MARCHE</h2>
                <button onclick="closeTM()" class="text-slate-500 hover:text-white transition-colors">✕ FERMER</button>
            </div>
            <div class="overflow-x-auto max-h-[500px]">
                <table class="w-full text-[10px] mono text-left">
                    <thead class="text-cyan-500 border-b border-white/10 uppercase sticky top-0 bg-[#0f172a]">
                        <tr><th class="p-3">TV ID</th><th class="p-3">AGENT</th><th class="p-3">DÉPART CTL</th><th class="p-3">ARRIVÉE VM</th><th class="p-3">STATUT</th></tr>
                    </thead>
                    <tbody id="tm-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="relative flex-1 flex flex-col">
        <div id="map"></div>
        
        <div id="collision-alert" class="hidden absolute top-6 left-1/2 -translate-x-1/2 z-[1000] bg-red-600 px-8 py-4 rounded-2xl orbitron font-black animate-bounce shadow-[0_0_40px_rgba(239,68,68,0.6)] border-2 border-white/20">
            <div class="flex items-center gap-4">
                <span class="text-2xl">⚠️</span>
                <div>
                    <p class="text-[12px] leading-tight">RISQUE DE COUPLAGE IMMINENT</p>
                    <p class="text-[8px] opacity-80 uppercase tracking-widest">Intervalle < 2 min détecté sur la ligne 58</p>
                </div>
            </div>
        </div>

        <div class="absolute bottom-6 left-6 z-[1000] flex gap-3">
            <button onclick="openTM()" class="px-6 py-4 bg-cyan-600/90 rounded-2xl orbitron text-[10px] font-black shadow-xl hover:bg-cyan-500 transition-all active:scale-95 border border-cyan-400/30">
                📊 GESTION DU RÉFÉRENTIEL (TM)
            </button>
        </div>
    </div>

    <div class="sidebar">
        <div class="p-6 border-b border-white/5 bg-slate-900/20">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-black orbitron italic italic">IRIS <span class="text-cyan-500">T-PCC</span></h1>
                    <p class="text-[8px] text-slate-500 uppercase mt-1 tracking-widest">Centre de Décision Ligne 58</p>
                </div>
                <div class="bg-green-500/20 text-green-400 px-2 py-1 rounded text-[8px] font-bold border border-green-500/30">ONLINE</div>
            </div>
        </div>

        <div class="p-4 border-b border-white/5 bg-black/40">
            <p class="text-[9px] text-cyan-500 font-black uppercase mb-3 tracking-widest italic">📟 Commandes Tactiques</p>
            <div class="space-y-2">
                <input type="text" id="msg-input" placeholder="Message broadcast..." class="w-full bg-slate-900 border border-white/10 p-3 rounded-xl text-xs outline-none focus:border-cyan-500 text-white placeholder:text-slate-600">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="sendMessage('Ralentissez')" class="bg-orange-500/10 text-orange-400 border border-orange-500/20 py-3 rounded-lg text-[9px] font-black hover:bg-orange-500/20 transition-all uppercase">Réguler (Slow)</button>
                    <button onclick="sendMessage('Accélérez')" class="bg-green-500/10 text-green-400 border border-green-500/20 py-3 rounded-lg text-[9px] font-black hover:bg-green-500/20 transition-all uppercase">Rattraper (Fast)</button>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="fleet-list">
            <div class="flex justify-between items-center mb-2">
                <p class="text-[9px] text-slate-600 font-black uppercase tracking-widest">Radar Temps Réel</p>
                <span class="text-[8px] mono text-slate-700" id="last-sync">--:--:--</span>
            </div>
            <div id="bus-cards-container" class="space-y-2">
                </div>
        </div>
    </div>

    <script>
        const map = L.map('map', {zoomControl: false}).setView([48.825, 2.325], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let busMarkers = {};

        async function syncRadar() {
            try {
                const res = await fetch('web_stats.json'); 
                const data = await res.json();
                
                document.getElementById('last-sync').innerText = data.last_update;
                const container = document.getElementById('bus-cards-container');
                container.innerHTML = "";

                data.bus_positions.forEach(bus => {
                    // 1. Mise à jour de la carte
                    if (busMarkers[bus.id]) {
                        busMarkers[bus.id].setLatLng([bus.lat, bus.lng]);
                        busMarkers[bus.id].getTooltip().setContent(`TV ${bus.id} | ${bus.eid}m`);
                    } else {
                        busMarkers[bus.id] = L.marker([bus.lat, bus.lng], {
                            icon: L.divIcon({
                                className: '',
                                html: `<div class="bg-cyan-500 w-4 h-4 rounded-full border-2 border-white shadow-[0_0_15px_cyan]"></div>`
                            })
                        }).addTo(map).bindTooltip(`TV ${bus.id} | ${bus.eid}m`, {permanent: true, direction: 'top', className: 'bus-label'});
                    }

                    // 2. Création de la carte dans la sidebar
                    const isDangerous = bus.intervalle < 3;
                    const card = `
                        <div class="p-3 rounded-xl border ${isDangerous ? 'border-red-500/50 bg-red-500/5 alert-flash' : 'border-white/5 bg-white/5'} transition-all">
                            <div class="flex justify-between items-start">
                                <span class="orbitron text-xs font-black text-cyan-400">TV ${bus.id}</span>
                                <span class="mono text-[9px] ${bus.eid > 5 ? 'text-orange-500' : 'text-green-500'}">+${bus.eid} min</span>
                            </div>
                            <div class="mt-2 flex justify-between items-center">
                                <span class="text-[8px] text-slate-500 uppercase font-bold tracking-tighter italic">Intervalle: ${bus.intervalle} min</span>
                                <span class="text-[8px] px-2 py-0.5 rounded bg-black/40 text-slate-300 mono">L58</span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;

                    // 3. Gestion de l'alerte sonore/visuelle globale
                    const alertBox = document.getElementById('collision-alert');
                    if (isDangerous) {
                        alertBox.classList.remove('hidden');
                    } else {
                        alertBox.classList.add('hidden');
                    }
                });
                
            } catch (e) { console.log("Radar IRIS en attente..."); }
        }

        function openTM() { document.getElementById('tm-modal').style.display = 'flex'; loadTMData(); }
        function closeTM() { document.getElementById('tm-modal').style.display = 'none'; }

        async function loadTMData() {
            try {
                const res = await fetch('referentiel/flux_live_2026.json');
                const data = await res.json();
                const body = document.getElementById('tm-table-body');
                body.innerHTML = "";
                
                // On affiche les 15 dernières positions enregistrées
                data.reverse().slice(0, 15).forEach(log => {
                    body.innerHTML += `
                        <tr class="border-b border-white/5 hover:bg-white/5 transition-all">
                            <td class="p-3 font-bold text-cyan-400 italic">${log.voiture}</td>
                            <td class="p-3 text-slate-500 mono
