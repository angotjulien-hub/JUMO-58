<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - STRATEGIC PCC v11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { background: #010208; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; margin: 0; }
        #map { flex: 1; height: 100%; filter: grayscale(1) invert(0.95) contrast(1.1) brightness(0.8) hue-rotate(195deg); }
        .sidebar { width: 450px; background: #05070a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 1001; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Bus & HUD Styles */
        .bus-marker { width: 14px; height: 14px; background: #00f2ff; border: 2px solid #fff; border-radius: 2px; transform: rotate(45deg); box-shadow: 0 0 15px #00f2ff; transition: all 0.4s ease; }
        .bus-off-route { background: #ff0055 !important; box-shadow: 0 0 20px #ff0055 !important; }
        .vector-line { stroke-dasharray: 4, 6; animation: flow 1s linear infinite; stroke-opacity: 0.5; }
        @keyframes flow { to { stroke-dashoffset: -20; } }
        
        .glass-ui { background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex">

    <div class="relative flex-1 flex flex-col">
        <div id="map"></div>
        
        <div class="absolute top-6 left-6 z-[1000]">
            <div class="glass-ui p-6 rounded-2xl w-85 shadow-2xl border-l-4 border-cyan-600">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[9px] font-black text-cyan-500 uppercase tracking-[0.2em] italic">Tactical Feed / L58</h3>
                    <div class="flex items-center gap-2">
                        <span class="text-[8px] text-slate-500 font-bold uppercase">Live</span>
                        <div class="w-1.5 h-1.5 bg-cyan-500 rounded-full animate-ping"></div>
                    </div>
                </div>
                <div id="telemetry-feed" class="space-y-2">
                    <p class="text-[10px] text-slate-600 italic">Aucune unité active sur le secteur.</p>
                </div>
            </div>
        </div>

        <div id="iris-alert-zone" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-[1000] w-[550px] pointer-events-none flex flex-col gap-3"></div>
    </div>

    <div class="sidebar shadow-2xl">
        <div class="p-8 border-b border-white/5 bg-slate-900/20">
            <h1 class="text-3xl font-black text-white italic orbitron tracking-tighter leading-none">IRIS <span class="text-cyan-500">T-PCC</span></h1>
            <p class="text-[8px] font-bold text-slate-500 uppercase tracking-[0.4em] mt-3 italic">Advanced Regulation System / v11.0</p>
        </div>

        <div class="grid grid-cols-2 gap-px bg-white/5 border-b border-white/5">
            <div class="p-6 bg-[#05070a]">
                <p class="text-[9px] text-slate-500 font-black uppercase mb-1 tracking-tighter italic italic">Production Km</p>
                <p id="km-total" class="text-2xl font-black orbitron text-white">0.00</p>
            </div>
            <div class="p-6 bg-[#05070a]">
                <p class="text-[9px] text-slate-500 font-black uppercase mb-1 tracking-tighter italic italic">Perte Offre (EID)</p>
                <p id="km-lost" class="text-2xl font-black orbitron text-red-600">0.00</p>
            </div>
        </div>

        <div class="p-6 flex-grow overflow-y-auto space-y-6">
            <div class="space-y-4">
                <select id="target-bus" class="w-full bg-[#0d1117] border border-white/10 p-4 rounded-xl text-xs font-bold text-cyan-400 outline-none focus:border-cyan-500">
                    <option value="ALL">-- SÉLECTION UNITÉ --</option>
                </select>
                <textarea id="msg-text" placeholder="Entrer consigne régulation..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-[11px] mono h-24 outline-none focus:border-cyan-500 transition-all text-white shadow-inner"></textarea>
                
                <div class="flex gap-2">
                    <button onclick="executeOrder('RETOURNEMENT')" class="flex-1 bg-orange-600/10 text-orange-500 border border-orange-500/30 py-4 rounded-xl font-black text-[9px] uppercase hover:bg-orange-600 hover:text-white transition-all shadow-lg">Rebroussage Sécurisé</button>
                    <button onclick="sendFreeMsg()" class="flex-1 bg-cyan-600 py-4 rounded-xl font-black text-[9px] uppercase text-black hover:bg-white transition-all shadow-lg shadow-cyan-600/20">Transmettre</button>
                </div>
            </div>

            <div id="bus-strips" class="space-y-2"></div>
        </div>

        <div class="p-4 bg-black border-t border-white/5">
            <button onclick="downloadIDFMReport()" class="w-full py-2 text-[8px] font-bold text-slate-600 hover:text-cyan-400 uppercase tracking-[0.2em] mb-4">Export Audit Régulation (.CSV)</button>
            <div id="logs" class="font-mono text-[9px] text-slate-800 h-24 overflow-y-auto">
                <div>[SYSTEM] IRIS CORE STABILIZED.</div>
            </div>
        </div>
    </div>

    <script>
        let map, fleet = {};
        let kmTotal = 0, kmPerdus = 0;

        // 1. CONFIGURATION RÉELLE LIGNE 58
        const LINE_58_PATH = [
            [48.8210, 2.2985], [48.8302, 2.3065], [48.8390, 2.3218],
            [48.8425, 2.3235], [48.8475, 2.3301], [48.8519, 2.3387],
            [48.8548, 2.3435], [48.8560, 2.3460]
        ];

        // 2. POINTS DE RETOURNEMENT HOMOLOGUÉS (CONSIGNES DE LIGNE)
        const SAFE_TURN_POINTS = [
            { id: "PR-PV", name: "Porte de Vanves (18 Juin)", lat: 48.8302, lon: 2.3065 },
            { id: "PR-RD", name: "Rue du Départ (Montparnasse)", lat: 48.8425, lon: 2.3235 },
            { id: "PR-FL", name: "Fleurus (Luxembourg)", lat: 48.8475, lon: 2.3301 },
            { id: "PR-OD", name: "Odéon (St-Germain)", lat: 48.8519, lon: 2.3387 },
            { id: "PR-QA", name: "Quai des Grands Augustins", lat: 48.8548, lon: 2.3435 }
        ];

        function init() {
            map = L.map('map', {zoomControl:false}).setView([48.8350, 2.3200], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            // Tracé Guide Neon
            L.polyline(LINE_58_PATH, {color: '#00f2ff', weight: 3, opacity: 0.1, dashArray: '1, 10'}).addTo(map);

            // Affichage des Safe Points
            SAFE_TURN_POINTS.forEach(pr => {
                L.circleMarker([pr.lat, pr.lon], {radius: 8, color: '#f59e0b', fillOpacity: 0.2, weight: 1.5}).addTo(map)
                 .bindTooltip(`PR : ${pr.name}`, {direction: 'top', offset: [0, -10]});
            });

            const peer = new Peer('IRIS-PCC-58-GLOBAL');
            peer.on('connection', conn => {
                conn.on('data', d => { if(d.type === 'pos') processTactical(d, conn); });
            });

            setInterval(predictiveConflict, 4000);
        }

        function processTactical(d, conn) {
            const id = d.pol;
            const raw = [d.lat, d.lon];
            const snapped = snapToLine(raw);
            const isOff = map.distance(raw, snapped) > 40;

            if(!fleet[id]) {
                fleet[id] = {
                    marker: L.marker(snapped, { icon: L.divIcon({html:`<div id="m-${id}" class="bus-marker"></div>`, className:''}) }).addTo(map),
                    vector: L.polyline([], {color: '#00f2ff', weight: 1.5, className: 'vector-line'}).addTo(map),
                    lastPos: snapped
                };
                updateSelect();
            }

            // KM Calculation
            let dist = map.distance(fleet[id].lastPos, snapped) / 1000;
            if(dist > 0.005) { kmTotal += dist; document.getElementById('km-total').innerText = kmTotal.toFixed(2); }

            // UI Refresh
            const mEl = document.getElementById('m-'+id);
            if(mEl) isOff ? mEl.classList.add('bus-off-route') : mEl.classList.remove('bus-off-route');

            // Vector Projection
            const dx = snapped[0] - fleet[id].lastPos[0];
            const dy = snapped[1] - fleet[id].lastPos[1];
            const future = [snapped[0] + dx * 12, snapped[1] + dy * 12];

            fleet[id].marker.setLatLng(snapped);
            fleet[id].vector.setLatLngs([snapped, future]);
            fleet[id].lastPos = snapped;
            fleet[id].futurePos = future;
            fleet[id].conn = conn;
            fleet[id].offRoute = isOff;

            updateHUD();
        }

        function snapToLine(latlng) {
            let cl = latlng; let min = Infinity;
            LINE_58_PATH.forEach(p => { let d = map.distance(latlng, p); if(d < min) { min = d; cl = p; } });
            return min < 40 ? cl : latlng;
        }

        function executeOrder(type) {
            const target = document.getElementById('target-bus').value;
            if(target === "ALL") return;
            const bus = fleet[target];

            if(type === 'RETOURNEMENT') {
                // Trouver le point sécurisé le plus proche
                let bestPR = SAFE_TURN_POINTS[0]; let minD = Infinity;
                SAFE_TURN_POINTS.forEach(pr => {
                    let d = map.distance(bus.lastPos, [pr.lat, pr.lon]);
                    if(d < minD) { minD = d; bestPR = pr; }
                });

                bus.conn.send({
                    type: 'RETOURNEMENT_STRICT',
                    instruction: `IRIS ORDER : Rebroussage autorisé au point sécurisé : ${bestPR.name}`,
                    lat: bestPR.lat, lon: bestPR.lon
                });
                
                // Pénalité km standard retournement
                kmPerdus += 3.5; 
                document.getElementById('km-lost').innerText = kmPerdus.toFixed(2);
                addLog(`CRITICAL : P${target} redirigé vers ${bestPR.id}`, "text-orange-500 font-black");
            } else {
                bus.conn.send({type: type});
            }
        }

        function predictiveConflict() {
            const ids = Object.keys(fleet);
            for(let i=0; i<ids.length; i++) {
                for(let j=i+1; j<ids.length; j++) {
                    const b1 = fleet[ids[i]], b2 = fleet[ids[j]];
                    if(b1.futurePos && b2.futurePos && map.distance(b1.futurePos, b2.futurePos) < 250) {
                        triggerAlert(ids[i], ids[j]);
                    }
                }
            }
        }

        function triggerAlert(p1, p2) {
            const zone = document.getElementById('iris-alert-zone');
            if(document.getElementById(`alert-${p1}-${p2}`)) return;
            const div = document.createElement('div');
            div.id = `alert-${p1}-${p2}`;
            div.className = "glass-ui p-6 rounded-2xl pointer-events-auto border-l-4 border-orange-600 flex justify-between items-center shadow-2xl";
            div.innerHTML = `<div><h4 class="text-[10px] font-black text-white italic">COUPLAGE DÉTECTÉ P${p1}/P${p2}</h4><p class="text-[9px] text-slate-500 font-mono">Action : Espacement ou Retournement PR le plus proche.</p></div>
                             <button onclick="applyOrder('${p2}', '${p1}-${p2}')" class="bg-orange-600 text-black px-4 py-2 rounded-lg font-black text-[9px] uppercase">Rebrousser</button>`;
            zone.appendChild(div);
        }

        function applyOrder(bid, aid) { executeOrder('RETOURNEMENT', bid); document.getElementById(`alert-${aid}`).remove(); }

        function sendFreeMsg() {
            const txt = document.getElementById('msg-text').value; const t = document.getElementById('target-bus').value;
            if(!txt) return;
            if(t === "ALL") Object.values(fleet).forEach(b => b.conn.send({type:'msg', content:txt}));
            else fleet[t].conn.send({type:'msg', content:txt});
            document.getElementById('msg-text').value = '';
            addLog(`TRANSMISSION : [${t}] Consigne envoyée.`, "text-cyan-500");
        }

        function updateHUD() {
            const f = document.getElementById('telemetry-feed'); f.innerHTML = '';
            Object.keys(fleet).forEach(id => {
                f.innerHTML += `<div class="flex justify-between items-center text-[10px] mono border-b border-white/5 pb-2">
                    <span class="text-white font-black italic">UNIT_P${id}</span>
                    <span class="${fleet[id].offRoute ? 'text-red-500' : 'text-cyan-400'} text-[8px] font-black uppercase tracking-tighter">${fleet[id].offRoute ? 'HORS-ITINÉRAIRE' : 'NOMINAL'}</span>
                </div>`;
            });
        }

        function updateSelect() {
            const s = document.getElementById('target-bus'); s.innerHTML = '<option value="ALL">-- DIFFUSION GÉNÉRALE --</option>';
            Object.keys(fleet).forEach(id => { s.innerHTML += `<option value="${id}">BUS POLICE ${id}</option>`; });
        }

        function addLog(m, c='') { const l = document.getElementById('logs'); l.innerHTML = `<div class="${c}">[${new Date().toLocaleTimeString()}] ${m}</div>` + l.innerHTML; }

        function downloadIDFMReport() {
            const csv = `DATE;PROD_KM;LOSS_KM\n${new Date().toLocaleDateString()};${kmTotal.toFixed(2)};${kmPerdus.toFixed(2)}`;
            const link = document.createElement('a'); link.href = 'data:text/csv;charset=utf-8,' + encodeURI(csv);
            link.download = `IRIS_58_EXPLOITATION.csv`; link.click();
        }

        window.onload = init;
    </script>
</body>
</html>
