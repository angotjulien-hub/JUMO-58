<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC CENTRAL v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #050505; font-family: 'Orbitron', sans-serif; color: white; overflow: hidden; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.3); }
        .pcc-panel { position: absolute; top: 20px; left: 20px; z-index: 1000; width: 320px; background: rgba(0,0,0,0.9); border-left: 4px solid #00f2ff; padding: 15px; border-radius: 0 10px 10px 0; }
        .bus-hex { 
            width: 22px; 
            height: 14px; 
            background: #00f2ff; 
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); 
            border: 1px solid white; 
            transition: all 0.5s ease;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        }
        #console { scrollbar-width: thin; scrollbar-color: #1a1a1a #000; }
        @keyframes panic { 0%, 100% { background: #050505; } 50% { background: #600; } }
    </style>
</head>
<body>
    <div class="pcc-panel shadow-2xl">
        <h1 class="text-[10px] font-bold border-b border-zinc-800 pb-2 mb-4 tracking-widest text-cyan-400">PCC LIGNE 58 - REGULATION TM</h1>
        
        <div id="console" class="text-[8px] text-cyan-600 h-48 overflow-y-auto font-mono flex flex-col-reverse mb-4 bg-black/50 p-2 border border-zinc-900">
            <div>> Système prêt. En attente de connexion...</div>
        </div>
        
        <label class="text-[7px] text-zinc-500 uppercase mb-1 block">Sélection Unité</label>
        <select id="select-bus" class="w-full bg-zinc-900 border border-zinc-800 text-[10px] p-2 mb-2 rounded text-cyan-400 outline-none">
            <option value="all">📢 TOUTE LA LIGNE 58</option>
        </select>

        <div class="grid grid-cols-2 gap-1 mb-4">
            <button onclick="setMsg('TENIR L\'ARRÊT POUR RECALAGE TM')" class="bg-zinc-800 hover:bg-orange-900 border border-zinc-700 p-2 text-[7px] uppercase font-bold transition-colors">⏳ Recalage TM</button>
            <button onclick="setMsg('REPRENDRE LA MARCHE NORMALE')" class="bg-zinc-800 hover:bg-green-900 border border-zinc-700 p-2 text-[7px] uppercase font-bold transition-colors">🟢 Marche Normale</button>
            <button onclick="setMsg('DANGER : PIÉTONS SUR VOIE')" class="bg-zinc-800 hover:bg-red-900 border border-zinc-700 p-2 text-[7px] uppercase font-bold transition-colors">⚠️ Danger</button>
            <button onclick="setMsg('APPEL RADIO IMMÉDIAT')" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 p-2 text-[7px] uppercase font-bold transition-colors">📞 Appel Radio</button>
        </div>

        <div class="flex gap-1">
            <input type="text" id="input-msg" placeholder="Message libre..." class="flex-1 bg-black border border-zinc-800 text-[10px] p-2 rounded outline-none focus:border-cyan-500 transition-all">
            <button onclick="envoyerMessage()" class="bg-cyan-600 px-4 rounded text-black font-bold text-xs hover:bg-cyan-400">ENVOYER</button>
        </div>
    </div>

    <div id="map"></div>

    <script>
        let map, fleet = {};
        const PCC_ID = 'IRIS-PCC-58-GLOBAL';

        function init() {
            // 1. Initialisation Carte
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.840, 2.318], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            // 2. Initialisation PeerJS
            const peer = new Peer(PCC_ID);

            peer.on('open', (id) => {
                log(`Serveur PCC en ligne : ${id}`, "text-green-500");
            });

            peer.on('connection', (conn) => {
                conn.on('data', (d) => {
                    // RÉCEPTION POSITION & TM
                    if (d.type === 'position') {
                        if (!fleet[d.id]) {
                            fleet[d.id] = { marker: null };
                            log(`Nouvelle unité : POLICE ${d.police}`, "text-cyan-400 font-bold");
                        }
                        
                        // Mise à jour de la connexion active pour ce bus
                        fleet[d.id].connection = conn; 
                        fleet[d.id].police = d.police;
                        fleet[d.id].delay = d.delay;
                        
                        updateMap(d);
                    }

                    // ACCUSÉ DE RÉCEPTION
                    if (d.type === 'ack_message') {
                        log(`✓ Message reçu par POLICE ${d.police}`, "text-green-400");
                    }

                    // SOS
                    if (d.type === 'SOS') {
                        triggerSOS(d.police);
                    }
                });

                conn.on('close', () => {
                    log("Une unité s'est déconnectée.", "text-zinc-500");
                });
            });

            peer.on('error', (err) => {
                log(`ERREUR : ${err.type}`, "text-red-500");
            });
        }

        function updateMap(d) {
            const delayTxt = d.delay > 0 ? ` [-${d.delay}']` : (d.delay < 0 ? ` [+${Math.abs(d.delay)}']` : " [0']");
            const label = `POL ${d.police}${delayTxt}`;
            
            // Création du marqueur si inexistant
            if (!fleet[d.id].marker) {
                fleet[d.id].marker = L.marker([d.lat, d.lon], { 
                    icon: L.divIcon({ 
                        className:'', 
                        html:'<div class="bus-hex"></div>',
                        iconSize: [22, 14]
                    }) 
                }).addTo(map)
                .bindTooltip(label, {
                    permanent: true, 
                    direction: 'right', 
                    className: 'bg-black/90 border-0 text-white text-[9px] px-2 orbitron'
                });

                // Ajout au menu déroulant
                const select = document.getElementById('select-bus');
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.text = `POLICE ${d.police}`;
                select.add(opt);
            } else {
                // Mise à jour position et texte
                fleet[d.id].marker.setLatLng([d.lat, d.lon]).setTooltipContent(label);
                
                // Couleur dynamique selon le TM
                const hex = fleet[d.id].marker._icon.querySelector('.bus-hex');
                if (hex) {
                    if (d.delay > 3) hex.style.background = "#ef4444";      // Retard (Rouge)
                    else if (d.delay < -1) hex.style.background = "#00f2ff"; // Avance (Cyan)
                    else hex.style.background = "#22c55e";                  // Heure (Vert)
                }
            }
        }

        function setMsg(t) { document.getElementById('input-msg').value = t; }

        function envoyerMessage() {
            const target = document.getElementById('select-bus').value;
            const txt = document.getElementById('input-msg').value;
            
            if(!txt) return;

            if (target === "all") {
                Object.values(fleet).forEach(bus => {
                    if(bus.connection && bus.connection.open) {
                        bus.connection.send({ type: 'message_pcc', texte: txt });
                    }
                });
                log(`📢 BROADCAST : ${txt}`, "text-yellow-500");
            } else {
                const bus = fleet[target];
                if(bus && bus.connection && bus.connection.open) {
                    bus.connection.send({ type: 'message_pcc', texte: txt });
                    log(`✉️ POLICE ${bus.police} : ${txt}`);
                } else {
                    log("❌ ERREUR : Unité hors ligne", "text-red-400");
                }
            }
            document.getElementById('input-msg').value = "";
        }

        function log(m, cls="text-cyan-600") {
            const c = document.getElementById('console');
            const time = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
            c.innerHTML += `<div class="${cls} mb-1 border-l border-zinc-800 pl-2"><span class="opacity-40">[${time}]</span> ${m}</div>`;
        }

        function triggerSOS(p) {
            document.body.style.animation = "panic 0.5s infinite";
            log(`🚨 SOS REÇU : POLICE ${p}`, "text-red-500 font-bold animate-pulse");
            setTimeout(() => { document.body.style.animation = "none"; }, 8000);
        }

        window.onload = init;
    </script>
</body>
</html>
