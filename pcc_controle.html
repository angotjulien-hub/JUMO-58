<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS - Poste de Commande Centralisé (PCC)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --pcc-navy: #0f1a24; --ratp-blue: #0055a4; --danger: #dc3545; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #eaeff2; display: flex; height: 100vh; }

        /* Sidebar : Liste des Bus */
        .sidebar { width: 350px; background: var(--pcc-navy); color: white; display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.3); z-index: 10; }
        .header-pcc { padding: 20px; background: var(--ratp-blue); text-align: center; }
        .bus-list { flex: 1; overflow-y: auto; padding: 10px; }
        .bus-card { background: rgba(255,255,255,0.1); margin-bottom: 10px; padding: 15px; border-radius: 8px; border-left: 5px solid #666; transition: 0.3s; }
        .bus-card.active { border-left-color: #009640; background: rgba(0, 150, 64, 0.1); }
        .bus-card.sos { border-left-color: var(--danger); background: rgba(220, 53, 69, 0.2); animation: flash 1s infinite; }

        /* Main : Carte */
        .map-container { flex: 1; position: relative; }
        #map { height: 100%; width: 100%; }

        /* Actions rapides */
        .btn-order { background: #ffc107; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem; margin-top: 10px; }
        .btn-order:hover { background: #e0a800; }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="header-pcc">
        <h1>IRIS PCC v2</h1>
        <p>Supervision Ligne 58</p>
    </div>
    <div id="busList" class="bus-list">
        <p style="text-align:center; padding:20px; opacity:0.5;">En attente de connexion conducteurs...</p>
    </div>
</div>

<div class="map-container">
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const SERVER_URL = "https://angot.pythonanywhere.com";
    let map;
    let markers = {}; // Stocke les marqueurs par POL

    function initMap() {
        map = L.map('map').setView([48.842, 2.318], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Rafraîchir les données toutes les 3 secondes
        setInterval(refreshData, 3000);
    }

    async function refreshData() {
        try {
            const res = await fetch(`${SERVER_URL}/get_buses`);
            const buses = await res.json();
            updateSidebarAndMap(buses);
        } catch (e) { console.error("Erreur synchro PCC"); }
    }

    function updateSidebarAndMap(buses) {
        const listContainer = document.getElementById('busList');
        listContainer.innerHTML = "";

        Object.keys(buses).forEach(pol => {
            const bus = buses[pol];
            const isSOS = bus.status.includes("SOS");

            // 1. Mise à jour de la Sidebar
            const card = document.createElement('div');
            card.className = `bus-card ${isSOS ? 'sos' : 'active'}`;
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <strong>POL ${pol}</strong>
                    <span style="font-size:0.8rem;">${bus.speed} km/h</span>
                </div>
                <div style="font-size:0.85rem; margin-top:5px; color:#ccc;">Statut: ${bus.status}</div>
                <button class="btn-order" onclick="sendPromptOrder('${pol}')">⚠️ ENVOYER ORDRE</button>
            `;
            listContainer.appendChild(card);

            // 2. Mise à jour de la Carte
            if (bus.lat && bus.lon) {
                if (markers[pol]) {
                    markers[pol].setLatLng([bus.lat, bus.lon]);
                } else {
                    markers[pol] = L.marker([bus.lat, bus.lon]).addTo(map)
                        .bindPopup(`<b>Bus POL ${pol}</b><br>${bus.status}`);
                }
                
                // Si SOS, on ouvre le popup automatiquement et on centre
                if (isSOS) {
                    markers[pol].getPopup().setContent(`<b>🚨 ALERTE SOS POL ${pol} 🚨</b>`).openOn(map);
                    map.setView([bus.lat, bus.lon], 16);
                }
            }
        });
    }

    async function sendPromptOrder(pol) {
        const msg = prompt(`Instruction à envoyer au POL ${pol} :`, "REBROUSSAGE : MONTPARNASSE");
        if (msg) {
            await fetch(`${SERVER_URL}/send_order`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ pol: pol, instruction: msg })
            });
            alert("Ordre transmis au conducteur.");
        }
    }

    initMap();
</script>
</body>
</html>
