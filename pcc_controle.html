<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - FULL TERMINAL CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #010208; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; margin: 0; }
        #map { flex: 1; height: 100%; filter: grayscale(1) invert(0.95) contrast(1.1) brightness(0.8) hue-rotate(195deg); }
        .sidebar { width: 450px; background: #05070a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 1001; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-ui { background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex">

    <div class="relative flex-1 flex flex-col">
        <div id="map"></div>
        
        <div class="absolute top-6 left-6 z-[1000]">
            <div class="glass-ui p-6 rounded-2xl w-80 border-l-4 border-cyan-600 shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[9px] font-black text-cyan-500 uppercase tracking-widest italic">PCC Tactique / L58</h3>
                    <div id="status-glow" class="w-2 h-2 bg-cyan-500 rounded-full animate-pulse"></div>
                </div>
                <div id="telemetry-feed" class="space-y-2 text-[10px] font-mono text-slate-400">
                    <p>> Moteur IRIS: CONNECTÉ</p>
                    <p>> Scan Intervalle: ACTIF</p>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="p-8 border-b border-white/5 bg-slate-900/20">
            <h1 class="text-3xl font-black text-white italic orbitron tracking-tighter">IRIS <span class="text-cyan-500">T-PCC</span></h1>
            <p class="text-[8px] font-bold text-slate-500 uppercase tracking-[0.4em] mt-3">Gestion de Ligne & Terminus</p>
        </div>

        <div class="grid grid-cols-2 gap-px bg-white/5 border-b border-white/5">
            <div class="p-6 bg-[#05070a]">
                <p class="text-[9px] text-slate-500 font-black uppercase mb-1">Missions Jour</p>
                <p id="km-total" class="text-2xl font-black orbitron text-white">--</p>
            </div>
            <div class="p-6 bg-[#05070a]">
                <p class="text-[9px] text-slate-500 font-black uppercase mb-1 text-red-500">EID Moyen</p>
                <p id="km-lost" class="text-2xl font-black orbitron text-red-600">0.0</p>
            </div>
        </div>

        <div class="p-6 overflow-y-auto flex-1">
            <h4 class="text-[10px] font-bold text-slate-600 uppercase mb-4 tracking-widest">Flux d'événements moteur</h4>
            <div id="event-logs" class="space-y-4 text-[11px] font-mono">
                </div>
        </div>
    </div>

    <script>
        const map = L.map('map', {zoomControl: false}).setView([48.8566, 2.3522], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        async function syncWithMoteur() {
            try {
                const response = await fetch('web_stats.json');
                const data = await response.json();
                
                // Mise à jour des compteurs sidebar
                document.getElementById('km-total').innerText = data.missions;
                document.getElementById('km-lost').innerText = "+" + data.eid_moyen;
                
                // Ajout d'un log si changement
                const logZone = document.getElementById('event-logs');
                const newLog = document.createElement('div');
                newLog.className = "text-cyan-500/80";
                newLog.innerHTML = `[${data.last_update}] Sync OK - Ponctualité ${data.ponctualite}%`;
                logZone.prepend(newLog);
                
            } catch (e) {
                console.log("Attente du flux web_stats.json...");
            }
        }

        setInterval(syncWithMoteur, 5000); // Sync toutes les 5 sec
    </script>
</body>
</html>
