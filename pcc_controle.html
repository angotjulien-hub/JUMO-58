<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC CENTRAL v3.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #050505; font-family: 'Orbitron', sans-serif; color: white; overflow: hidden; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.3) contrast(1.2); }
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(0,0,0,0.9); border-bottom: 1px solid #333; z-index: 2000; display: flex; align-items: center; px: 20px; }
        .pcc-panel { position: absolute; top: 70px; left: 20px; z-index: 1000; width: 340px; background: rgba(0,0,0,0.95); border-left: 4px solid #00f2ff; padding: 20px; border-radius: 0 15px 15px 0; }
        .bus-hex { width: 24px; height: 16px; background: #00f2ff; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); border: 2px solid white; transition: all 0.3s; }
        @keyframes panic { 0%, 100% { background: #050505; } 50% { background: #600; } }
    </style>
</head>
<body>
    <div class="top-bar flex justify-between items-center px-6">
        <div class="flex items-center gap-6">
            <h1 class="text-cyan-400 font-bold text-xs tracking-[5px]">IRIS 58 GLOBAL</h1>
            <div class="text-[9px] uppercase text-zinc-500">Unités: <span id="count-bus" class="text-white">0</span></div>
        </div>
        <div id="pcc-clock" class="text-xs text-zinc-400">00:00:00</div>
    </div>

    <div class="pcc-panel shadow-2xl">
        <div id="console" class="text-[8px] text-cyan-600 h-64 overflow-y-auto font-mono flex flex-col-reverse mb-6 bg-black/80 p-3 border border-zinc-900 rounded">
            <div>> PCC Ligne 58 Prêt.</div>
        </div>
        
        <select id="select-bus" class="w-full bg-zinc-900 border border-zinc-800 text-[10px] p-3 mb-4 rounded text-cyan-400 outline-none font-bold italic">
            <option value="all">📢 TOUTE LA LIGNE 58</option>
        </select>

        <div class="grid grid-cols-2 gap-2 mb-6">
            <button onclick="setMsg('TENIR L\'ARRÊT POUR RECALAGE TM')" class="bg-zinc-800 hover:bg-orange-800 border border-zinc-700 p-2 text-[7px] font-black uppercase tracking-tighter">⏳ Recalage TM</button>
            <button onclick="setMsg('REPRENDRE LA MARCHE NORMALE')" class="bg-zinc-800 hover:bg-green-800 border border-zinc-700 p-2 text-[7px] font-black uppercase tracking-tighter">🟢 Marche Normale</button>
            <button onclick="setMsg('DANGER : PIÉTONS SUR VOIE')" class="bg-zinc-800 hover:bg-red-900 border border-zinc-700 p-2 text-[7px] font-black uppercase tracking-tighter">⚠️ Danger</button>
            <button onclick="setMsg('APPEL RADIO IMMÉDIAT')" class="bg-zinc-800 hover:bg-blue-900 border border-zinc-700 p-2 text-[7px] font-black uppercase tracking-tighter">📞 Appel Radio</button>
        </div>

        <div class="flex gap-2">
            <input type="text" id="input-msg" placeholder="Consigne directe..." class="flex-1 bg-black border border-zinc-800 text-[10px] p-3 rounded outline-none focus:border-cyan-500">
            <button onclick="envoyerMessage()" class="bg-cyan-600 px-4 rounded text-black font-black text-[10px]">ENVOYER</button>
        </div>
    </div>

    <div id="map"></div>

    <script>
        let map, fleet = {};
        const PCC_ID = 'IRIS-PCC-58-GLOBAL';

        function init() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.840, 2.318], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            const peer = new Peer(PCC_ID);
            peer.on('open', (id) => log(`Serveur de régulation opérationnel.`, "text-green-500"));

            peer.on('connection', (conn) => {
                conn.on('data', (d) => {
                    if (d.type === 'position') {
                        if (!fleet[d.id]) {
                            fleet[d.id] = { marker: null };
                            const opt = document.createElement('option'); opt.value = d.id; opt.text = `POLICE ${d.police}`; document.getElementById('select-bus').add(opt);
                        }
                        fleet[d.id].connection = conn;
                        fleet[d.id].police = d.police;
                        updateMap(d);
                    }
                    if (d.type === 'signalement') log(`⚠️ SIGNALEMENT POL ${d.police} : ${d.label}`, "text-orange-400 font-bold");
                    if (d.type === 'ack_message') log(`✓ Lu par Pol ${d.police}`, "text-green-400");
                    if (d.type === 'SOS') triggerSOS(d.police);
                    updateStats();
                });
            });

            setInterval(() => { document.getElementById('pcc-clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        }

        function updateMap(d) {
            const delayTxt = d.delay > 1 ? ` [-${d.delay}']` : (d.delay < -1 ? ` [+${Math.abs(d.delay)}']` : " [H]");
            const label = `POL ${d.police}${delayTxt}`;
            if (!fleet[d.id].marker) {
                fleet[d.id].marker = L.marker([d.lat, d.lon], { icon: L.divIcon({ className:'', html:'<div class="bus-hex"></div>', iconSize:[24,16] }) }).addTo(map)
                .bindTooltip(label, {permanent:true, direction:'right', className:'bg-black/90 border-0 text-white text-[9px] px-2'});
            } else {
                fleet[d.id].marker.setLatLng([d.lat, d.lon]).setTooltipContent(label);
                const hex = fleet[d.id].marker._icon.querySelector('.bus-hex');
                hex.style.background = d.delay > 2 ? "#ef4444" : (d.delay < -1 ? "#00f2ff" : "#22c55e");
            }
        }

        function setMsg(t) { document.getElementById('input-msg').value = t; }
        function envoyerMessage() {
            const target = document.getElementById('select-bus').value;
            const txt = document.getElementById('input-msg').value;
            if(!txt) return;
            if(target === "all") Object.values(fleet).forEach(b => b.connection.send({type:'message_pcc', texte:txt}));
            else fleet[target].connection.send({type:'message_pcc', texte:txt});
            log(`✉️ ENVOI : ${txt}`);
            document.getElementById('input-msg').value = "";
        }

        function log(m, cls="text-cyan-600") {
            const c = document.getElementById('console');
            c.innerHTML += `<div class="${cls}">[${new Date().toLocaleTimeString()}] > ${m}</div>`;
        }

        function updateStats() { document.getElementById('count-bus').innerText = Object.keys(fleet).length; }

        function triggerSOS(p) {
            document.body.style.animation = "panic 0.5s infinite";
            log(`🚨 SOS POLICE ${p}`, "text-red-500 font-black italic underline");
            setTimeout(() => { document.body.style.animation = "none"; }, 10000);
        }

        window.onload = init;
    </script>
</body>
</html>
