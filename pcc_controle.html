<!DOCTYPE html>
<html lang="fr">
<head>

    <title>IRIS 58 - PCC COMMAND CENTER (LIGHT)</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains+Mono', monospace; background: #f8fafc; color: #0f172a; margin: 0; overflow: hidden; }
        /* Fond de carte clair Positron */
        #map { height: 100vh; width: 100vw; background: #e2e8f0; }
        
        /* Panneaux clairs avec effet flouté */
        .glass { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(6, 182, 212, 0.4); 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            color: #1e293b;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Marqueur Bus contrasté pour fond clair */
        .bus-marker { 
            background: #0369a1; /* Bleu pétrole foncé */
            color: white; 
            border: 2px solid #fff; 
            padding: 3px 10px; 
            border-radius: 6px; 
            font-weight: 800; 
            font-size: 12px; 
            box-shadow: 0 4px 10px rgba(3, 105, 161, 0.3);
            white-space: nowrap;
        }
        
        /* Points d'arrêts discrets */
        .stop-dot { background: white; border: 2px solid #0891b2; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.1); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>

                <div class="text-slate-400 italic text-right">UNITS: <span id="bus-count" class="text-cyan-600">0</span></div>
            </div>
        </div>
