<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC REGULATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #f4f4f7; display: flex; height: 100vh; font-family: sans-serif; }
        #map { flex-grow: 1; height: 100%; }
        .sidebar { width: 350px; background: white; border-left: 1px solid #ddd; display: flex; flex-col; padding: 20px; overflow-y: auto; }
        .stop-item { font-size: 10px; padding: 4px 0; border-bottom: 1px solid #f0f0f0; color: #666; }
        .stop-active { color: #2563eb; font-weight: bold; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="sidebar">
        <h2 class="font-black text-blue-600 mb-4 uppercase tracking-tighter">Flux Ligne 58</h2>
        <div id="bus-list" class="mb-6 space-y-2"></div>
        
        <hr class="mb-4">
        <h3 class="text-[10px] font-bold text-zinc-400 uppercase mb-2">Points de passage théoriques</h3>
        <div id="stops-container"></div>
    </div>

    <script>
        const PARCOURS = ["Vanves - Lycée Michelet", "Carrefour Albert Legris", "Jean Jaurès - Jean Bleuzen", "Adolphe Pinard", "Pont de la Vallée", "Porte de Vanves", "Colonel Monteil", "Didot", "Hôpitaux Broussais Et Saint-Joseph", "Alésia - Didot", "Pernety", "Château", "Losserand - Maine", "Gaîté", "Gare Montparnasse", "Vavin", "Raspail - Fleurus", "Musée du Luxembourg", "Sénat", "Saint-Germain - Odéon", "Châtelet"];
        
        let map, fleet = {};

        function init() {
            map = L.map('map').setView([48.830, 2.310], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
            
            const peer = new Peer('IRIS-PCC-58-GLOBAL');
            peer.on('connection', (conn) => {
                conn.on('data', (d) => {
                    if(d.type === 'position') {
                        updateBus(d, conn);
                        verifierRetournement();
                    }
                });
            });

            // Remplissage des arrêts
            PARCOURS.forEach(s => {
                const div = document.createElement('div');
                div.className = "stop-item";
                div.innerText = "• " + s;
                document.getElementById('stops-container').appendChild(div);
            });
        }

        function updateBus(d, conn) {
            if(!fleet[d.pol]) {
                fleet[d.pol] = { marker: L.circleMarker([d.lat, d.lon], {radius:10, color:'#2563eb', fillOpacity:1}).addTo(map).bindTooltip("POL "+d.pol, {permanent:true}) };
            }
            fleet[d.pol].marker.setLatLng([d.lat, d.lon]);
            fleet[d.pol].lat = d.lat;
            fleet[d.pol].lon = d.lon;
            fleet[d.pol].conn = conn;
        }

        function verifierRetournement() {
            const buses = Object.values(fleet);
            if(buses.length < 2) return;
            
            // IA : Calcul de distance entre les bus
            for(let i=0; i<buses.length; i++) {
                for(let j=i+1; j<buses.length; j++) {
                    const dist = map.distance([buses[i].lat, buses[i].lon], [buses[j].lat, buses[j].lon]);
                    // Si moins de 400m = RETOURNEMENT
                    if(dist < 400) {
                        buses[i].conn.send({type:'RETOURNEMENT'});
                        buses[j].conn.send({type:'RETOURNEMENT'});
                    }
                }
            }
        }
        window.onload = init;
    </script>
</body>
</html>
