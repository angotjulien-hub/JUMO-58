<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - STRATEGIC PCC v11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { background: #010208; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; margin: 0; }
        #map { flex: 1; height: 100%; filter: grayscale(1) invert(0.95) contrast(1.1) brightness(0.8) hue-rotate(195deg); }
        .sidebar { width: 450px; background: #05070a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 1001; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Bus & HUD Styles */
        .bus-marker { width: 14px; height: 14px; background: #00f2ff; border: 2px solid #fff; border-radius: 2px; transform: rotate(45deg); box-shadow: 0 0 15px #00f2ff; transition: all 0.4s ease; }
        .bus-off-route { background: #ff0055 !important; box-shadow: 0 0 20px #ff0055 !important; }
        .vector-line { stroke-dasharray: 4, 6; animation: flow 1s linear infinite; stroke-opacity: 0.5; }
        @keyframes flow { to { stroke-dashoffset: -20; } }
        
        .glass-ui { background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>

    <div class="relative flex-1 flex flex-col">
        <div id="map"></div>
        
        <div class="absolute top-6 left-6 z-[1000]">
            <div class="glass-ui p-6 rounded-2xl w-85 shadow-2xl border-l-4 border-cyan-600">

                    </div>
                </div>
                <div id="telemetry-feed" class="space-y-2">
                    <p class="text-[10px] text-slate-600 italic">Aucune unité active sur le secteur.</p>
                </div>
            </div>
        </div>

        <div id="iris-alert-zone" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-[1000] w-[550px] pointer-events-none flex flex-col gap-3"></div>
    </div>

            <p class="text-[8px] font-bold text-slate-500 uppercase tracking-[0.4em] mt-3 italic">Advanced Regulation System / v11.0</p>
        </div>
