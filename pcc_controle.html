// Bloc à insérer dans le script du PCC pour activer l'IA de Retournement
function detecterRetournement() {
    const keys = Object.keys(fleet);
    if(keys.length < 2) return;

    for(let i=0; i<keys.length; i++){
        for(let j=i+1; j<keys.length; j++){
            const b1 = fleet[keys[i]]; 
            const b2 = fleet[keys[j]];
            
            // Mesure de la distance réelle entre deux points GPS
            const dist = map.distance([b1.lat, b1.lon], [b2.lat, b2.lon]);
            
            // ALGORITHME IRIS : Si distance < 350m (intervalle brisé)
            if(dist < 350) { 
                console.log(`IA : Retournement nécessaire entre POL ${keys[i]} et POL ${keys[j]}`);
                if(b1.conn) b1.conn.send({type:'RETOURNEMENT'});
                if(b2.conn) b2.conn.send({type:'RETOURNEMENT'});
            }
        }
    }
}
