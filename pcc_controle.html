<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS 58 - PCC GLOBAL STRATÉGIQUE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --iris-blue: #00f2ff; --iris-orange: #ffae00; --iris-bg: #050505; }
        body { margin: 0; background: var(--iris-bg); font-family: 'Orbitron', sans-serif; color: white; overflow: hidden; transition: background 0.3s; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.4) contrast(1.1); z-index: 1; }
        .pcc-panel { position: absolute; top: 20px; left: 20px; z-index: 1000; width: 350px; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); border-left: 4px solid var(--iris-blue); padding: 20px; }
        .bus-hex { width: 22px; height: 14px; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); border: 1px solid white; transition: all 0.3s; }
        @keyframes panic { 0% { background: #050505; } 50% { background: #440000; } 100% { background: #050505; } }
    </style>
</head>
<body>
    <div class="pcc-panel shadow-2xl">
        <h1 class="text-xl font-bold text-white mb-1 tracking-tighter">HUB GLOBAL IRIS 58</h1>
        <div id="bus-count" class="text-[9px] text-zinc-500 mb-4 uppercase tracking-[2px]">Système Prêt</div>
        
        <div id="console" class="text-[9px] text-cyan-500 h-48 overflow-y-auto bg-black/80 p-3 border border-zinc-800 font-mono flex flex-col-reverse">
            <div class="text-zinc-600">> Initialisation des protocoles...</div>
        </div>
        
        <button onclick="stopSOS()" class="mt-4 w-full bg-red-900/20 border border-red-500/50 py-2 text-[9px] text-red-400 font-bold hover:bg-red-500 hover:text-white transition-all">ACQUITTER SOS</button>
    </div>

    <div id="map"></div>

    <script>
        let map, fleet = {};
        const PCC_ID = 'IRIS-PCC-58-GLOBAL';

        function init() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.840, 2.318], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            const peer = new Peer(PCC_ID);
            
            peer.on('open', (id) => log(`PCC CONNECTÉ : ${id}`, "text-green-400"));

            peer.on('connection', (conn) => {
                log(`LIAISON ÉTABLIE : ${conn.peer}`, "text-white");
                
                conn.on('data', (data) => {
                    if (data.type === 'position') {
                        fleet[data.id] = { ...data, lastUpdate: Date.now(), connection: conn };
                        updateBusOnMap(data);
                        diffuserIntervalles();
                        document.getElementById('bus-count').innerText = `${Object.keys(fleet).length} UNITÉS EN LIGNE`;
                    }
                    if (data.type === 'SOS') {
                        declencherSOS(data.id);
                    }
                });
            });
        }

        function updateBusOnMap(d) {
            const color = d.status ? '#ffae00' : '#00f2ff';
            if (!fleet[d.id].marker) {
                fleet[d.id].marker = L.marker([d.lat, d.lon], { 
                    icon: L.divIcon({ className: '', html: `<div class="bus-hex shadow-lg" style="background:${color}"></div>` }) 
                }).addTo(map).bindTooltip(d.id, {permanent: true, direction: 'right', className: 'bg-transparent border-0 text-white font-bold text-[10px]'});
            } else {
                fleet[d.id].marker.setLatLng([d.lat, d.lon]);
                fleet[d.id].marker.setIcon(L.divIcon({ className: '', html: `<div class="bus-hex" style="background:${color}"></div>` }));
            }
        }

        function diffuserIntervalles() {
            const busArray = Object.values(fleet).sort((a, b) => b.lat - a.lat);
            busArray.forEach((bus, i) => {
                let prev = "--", next = "--";
                if (i > 0) prev = Math.round(map.distance([bus.lat, bus.lon], [busArray[i-1].lat, busArray[i-1].lon]) / 250);
                if (i < busArray.length - 1) next = Math.round(map.distance([bus.lat, bus.lon], [busArray[i+1].lat, busArray[i+1].lon]) / 250);
                if (bus.connection && bus.connection.open) bus.connection.send({ type: 'intervals', prev, next });
            });
        }

        function declencherSOS(id) {
            document.body.style.animation = "panic 0.5s infinite";
            log(`🚨 ALERTE SOS : UNITÉ ${id} !`, "text-red-500 font-bold");
        }

        function stopSOS() {
            document.body.style.animation = "none";
            document.body.style.background = "#050505";
        }

        function log(m, colorClass = "text-cyan-500") {
            const c = document.getElementById('console');
            c.innerHTML += `<div class="${colorClass}">> ${m}</div>`;
            c.scrollTop = c.scrollHeight;
        }

        window.onload = init;
    </script>
</body>
</html>
