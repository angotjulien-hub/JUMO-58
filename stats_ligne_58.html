<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS v3.5 - Statistiques Ligne 58</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; }
    </style>
</head>
<body class="p-8">
    <header class="max-w-6xl mx-auto mb-12 flex justify-between items-end">
        <div>
            <h1 class="text-4xl font-black tracking-tighter text-cyan-400">IRIS ANALYTICS</h1>
            <p class="text-zinc-500 uppercase text-xs tracking-[0.3em]">Performance Opérationnelle Ligne 58</p>
        </div>
        <div class="text-right">
            <span class="text-[10px] text-zinc-600 block">DERNIÈRE ANALYSE MOTEUR</span>
            <span id="update-time" class="font-mono text-sm text-zinc-400">--/--/-- --:--</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="glass">
            <h3 class="text-sm font-bold mb-4 text-zinc-400">RÉGULARITÉ DE L'INTERVALLE (24H)</h3>
            <canvas id="intervalChart"></canvas>
        </div>

        <div class="glass">
            <h3 class="text-sm font-bold mb-4 text-zinc-400">DÉVIATIONS vs COUPLAGES ACTIFS</h3>
            <canvas id="couplingChart"></canvas>
        </div>

        <div class="glass flex flex-col justify-center items-center text-center">
            <span class="text-zinc-500 text-xs uppercase mb-2">Taux de Ponctualité</span>
            <span class="text-6xl font-black text-green-500">94.2%</span>
            <span class="text-[10px] text-zinc-600 mt-4">Calculé par moteur/audit_performance.py</span>
        </div>

        <div class="glass flex flex-col justify-center items-center text-center border-cyan-500/30">
            <span class="text-zinc-500 text-xs uppercase mb-2">Couplages Évités</span>
            <span class="text-6xl font-black text-cyan-400">12</span>
            <span class="text-[10px] text-zinc-600 mt-4">Grâce à la régulation proactive IRIS</span>
        </div>
    </main>

    <script>
        // Simulation des données qui seront injectées par update_dashboard.py
        const ctx1 = document.getElementById('intervalChart').getContext('2d');
        new Chart(ctx1, {
            type: 'line',
            data: {
                labels: ['6h', '9h', '12h', '15h', '18h', '21h'],
                datasets: [{
                    label: 'Intervalle Réel (min)',
                    data: [10, 14, 11, 18, 12, 10],
                    borderColor: '#00f2ff',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(0, 242, 255, 0.1)'
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#222' } } } }
        });

        document.getElementById('update-time').innerText = new Date().toLocaleString();
    </script>
</body>
</html>
