<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRIS v3.6 - ANALYTICS PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 32px; padding: 24px; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-black orbitron text-white">IRIS <span class="text-cyan-400 italic">ANALYTICS</span></h1>
                <p class="text-slate-500 uppercase text-[10px] font-bold tracking-[0.4em]">Live Performance Engine</p>
            </div>
            <div class="glass py-2 px-6">
                <span id="update-time" class="font-mono text-cyan-400">SYNC EN COURS...</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="glass flex flex-col items-center">
                <span class="text-[10px] text-slate-500 uppercase mb-2">Ponctualité</span>
                <span id="kpi-ponct" class="text-5xl font-black orbitron text-white">--%</span>
            </div>
            <div class="glass flex flex-col items-center">
                <span class="text-[10px] text-slate-500 uppercase mb-2">EID Moyen</span>
                <span id="kpi-eid" class="text-5xl font-black orbitron text-orange-500">--</span>
            </div>
            <div class="glass flex flex-col items-center border-b-4 border-cyan-500">
                <span class="text-[10px] text-slate-500 uppercase mb-2">Missions</span>
                <span id="kpi-missions" class="text-5xl font-black orbitron text-white">--</span>
            </div>
            <div class="glass flex flex-col items-center">
                <span class="text-[10px] text-slate-500 uppercase mb-2">Couplages</span>
                <span class="text-5xl font-black orbitron text-cyan-400">12</span>
            </div>
        </div>

        <div class="glass">
            <canvas id="intervalChart" height="100"></canvas>
        </div>
    </div>

    <script>
        let mainChart;

        async function updateDashboard() {
            try {
                const response = await fetch('web_stats.json');
                const d = await response.json();

                // Update Textes
                document.getElementById('update-time').innerText = "LAST SYNC: " + d.last_update;
                document.getElementById('kpi-ponct').innerText = d.ponctualite + "%";
                document.getElementById('kpi-eid').innerText = "+" + d.eid_moyen + "m";
                document.getElementById('kpi-missions').innerText = d.missions;

                // Update Chart
                const ctx = document.getElementById('intervalChart').getContext('2d');
                if (mainChart) mainChart.destroy();
                mainChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: d.chart_labels,
                        datasets: [{
                            label: 'Dérive (min)',
                            data: d.chart_data,
                            borderColor: '#06b6d4',
                            backgroundColor: 'rgba(6, 182, 212, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: { plugins: { legend: { display: false } } }
                });
            } catch (e) { console.log("Moteur Python non détecté..."); }
        }

        setInterval(updateDashboard, 30000);
        updateDashboard();
    </script>
</body>
</html>
